．また，歩行者挙動は画像解析を活用して定量的に評価し，適合度が最も高いケースを用いて傷害発生メカニズムを解","stream":"◯"},{"id":"401","title":"車両停車位置から見た衝突後の歩行者との位置関係について","author":"鈴木　基継 ・西本　哲也（日本大学）・本村　友一（日本医科大学）","aff":["日本大学","日本医科大学"],"abstract":"本研究は，歩行者事故における車両の最終停車位置と歩行者の倒れ込み位置との関係を検討した．実際の約18件の事例に限定した分析ではあるものの，車両停止位置からの距離を示した．これらの知見は，車載カメラを救急救命に活かすための基礎的な情報となるものと考える．","stream":"◯"},{"id":"402","title":"歩行者の即死性外傷を指標とした自転車乗員の受傷機序と身体重心の影響","author":"石井　慎一 ・大野　靖雄（千葉県警察本部）","aff":["千葉県警察本部"],"abstract":"第12次交通安全基本計画が掲げる死者数の大幅な削減という喫緊の課題に対し，歩行者における即死性外傷の発生機序を指標とし，自転車乗員に特有の受傷機序を明らかにした．自転車乗員と歩行者の受傷機序を分かつ決定的な要因は，自動車のエンジンフード前端高さに対する身体重心の垂直オフセット量にあった．","stream":"◯"}]},{"id":175,"title":"エンジン部品・潤滑油・トライボロジーI","day":16,"room":"小ホール","start":"9:30","end":"12:10","chair":"座長：菊原　浩司（早稲田大学）","talks":[{"id":"403","title":"4ストロークディーゼルエンジンにおけるピストン剛性とピン回転に関する研究","author":"関　健太郎 ・伊東　明美（東京都市大学）・坪田　頼昌・三輪　純一（いすゞ自動車）","aff":["東京都市大学","いすゞ自動車"],"abstract":"耐焼付性に優れる全浮動式ピストンピンの回転発生機序解明のため新たに開発した測定装置によりピンを回転させる力を測定した．ピンボス軸受周辺の剛性に着目し試験を行い，剛性が低いピストンでは回転力が小さく，軸受の変形による偏当りが回転を妨げる要因であることを示した．","stream":"◯"},{"id":"404","title":"ピストンスカートプロファイルまたはパターンコーティングにより付加された凹部内の油膜分布とスカート部摩擦損失","author":"大島　潤平 ・佐藤　健太・川島　久宜・鈴木　秀和・石間　経章（群馬大学）","aff":["群馬大学"],"abstract":"スカートプロファイル凹部の油膜分布を仮定した計算によりFMEP低減があること確認されている．本報告では実際に凹部があるピストンを試作して凹部の油膜分布を観察し，凹部へのオイル流入過程を考察した．得られた凹部油膜分布を用いてスカート部のFMEP計算を行った．その結果，凹部によるFMEP低減効果があることが分った．","stream":"◯"},{"id":"405","title":"ピストン形状変更によるピストンスカート潤滑性変化がピストン機能へ及ぼす影響","author":"小林　邦彦 ・林　健太・小林　俊夫・小坂　裕樹・櫻井　渉（アート金属工業）","aff":["アート金属工業"],"abstract":"シリンダーボアと接触しゅう動するピストンスカートの潤滑性は，しゅう動摩擦やブロックへの振動伝達特性に影響を及ぼすことが知られている．今回スカートの剛性，プロファイルの変更によりピストンスカート潤滑性を変化させた際の，ピストン機能への影響を調べ，また必要な潤滑性を得るためのピストン諸元指針を考察する．","stream":"✕"},{"id":"406","title":"ピストンTOPリング溝部における陽極酸化皮膜の平滑化","author":"村上　春彦 ・藤田　昌弘・鈴木　慎也（スズキ）","aff":["スズキ"],"abstract":"直噴エンジンにおける始動直後のPN排出増加に対し，ピストントップリング溝部の陽極酸化皮膜の平滑化による低減効果を検証した．実機試験により，溝部の表面粗さ（Ra, Rpk）とPN排出量に強い相関を確認した．また，交直重畳法は直流法よりも均質な皮膜を形成することを見出した．本研究では量産化を見据えた極低圧ショットブラスト法による平滑化技術を提案し，PN低減への有効性を示した．","stream":"✕"},{"id":"407","title":"ピストントップリング溝の陽極酸化皮膜がなじみプロセスとオイル消費に与える影響","author":"古溝　竜都 ・伊藤　俊輔・伊東　明美（東京都市大学）・藤田　昌弘・村上　春彦（スズキ）","aff":["東京都市大学","スズキ"],"abstract":"ピストントップリング溝の陽酸化処理皮膜は溝摩耗防止のために施されるが，同時に早期のなじみ形成やそれによるPN低減効果も期待される．本研究ではPNの代用特性としてオイル消費を測定し，性状が異なる平滑化された陽酸化処理皮膜のなじみプロセスやオイル消費量を観察した結果を報告する．","stream":"◯"},{"id":"408","title":"オイル上がり経路解明のためのランド部オイル分布観察","author":"竹中　亮 ・佐藤　健太（群馬大学）・井田　徳昭（三菱重工業）・川島　久宜・鈴木　秀和・石間　経章（群馬大学）","aff":["群馬大学","三菱重工業"],"abstract":"トップリングおよびオイルリングを変更したときのピストンランド部のオイル挙動について可視化した．2ピースと3ピースオイルリングおよびトップリング合口隙間を変更し，オイル上がりに与える影響を確認した．その結果，オイル上りはランド部オイル量の影響が大きく，リング仕様の影響は大きくないことが分った．","stream":"◯"}]},{"id":176,"title":"エンジン部品・潤滑油・トライボロジーII","day":16,"room":"小ホール","start":"13:10","end":"14:50","chair":"座長：石間　経章（群馬大学大学院）","talks":[{"id":"409","title":"冷却損失低減に向けた筒内遮熱膜および評価解析技術の研究 -（第3報）遮熱コーティングの熱特性評価II-","author":"阿部　陽香 ・篠田　健太郎・木下　幸一・漆原　友則・阿子島　めぐみ・久保田　英志・小熊　光晴（産業技術総合研究所）","aff":["産業技術総合研究所"],"abstract":"本研究は，産業技術総合研究所が開発したハイブリッドエアロゾルデポジション法を用いて，ピストンへの適用が可能な遮熱膜を作製し，エンジン熱効率向上に向けた冷却損失低減を目的とするものである．本報では，第2報で示した膜よりも低熱伝導率の新規遮熱膜を開発し，その熱伝導特性を評価した結果について報告する．","stream":"◯"},{"id":"410","title":"使用条件に依存したエンジンオイル中金属系添加剤の化学状態および構造変化","author":"国須　正洋 ・李　茜・村田　大輔・中島　沙知・冨永　達哉（東レリサーチセンター）","aff":["東レリサーチセンター"],"abstract":"エンジンオイル中金属系添加剤について，新品油，通常走行後油および条件差を与えた試料を対象に，X線吸収分光などの方法により，金属元素の結合状態や化学状態を評価した．使用条件に応じた化学状態および局所構造の差異が確認され，元素種によりリン酸塩化の傾向や水和イオンへの分解の進行挙動が示唆された．","stream":"◯"},{"id":"411","title":"油膜せん断応力に基づくエンジン用ジャーナル軸受の摩擦低減技術","author":"幸島　元彦 ・永田　真理・糸井川　寛・田村　忠教・安田　絵里奈（大同メタル工業）","aff":["大同メタル工業"],"abstract":"エンジン軸受の摩擦損失低減について，油膜内のせん断応力に着目し，新たに設計した試験装置を用いて実験的に評価した．得られた知見から，ベアリング表面特性の最適化が流体潤滑領域での摩擦損失低減に有効であることを示した．","stream":"◯"},{"id":"412","title":"内燃機関の実動時摩擦評価法の開発とクランク軸周りの摩擦低減検討","author":"戸井田　一宣 ・小山　崇・大河　誠・小川　輝（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"自動車用内燃機関において，筒内圧が作用する実動状態での摩擦を把握するにあたり指圧線図法が広く使われているがその計測精度には課題がある．そこで著者らは高精度に実動時の摩擦評価が可能な実用的な過給モータリング法を開発した．また解析で得たクランク軸周りの摩擦低減指針を本計測手法を用いて実証した．","stream":"◯"}]},{"id":177,"title":"安全一般II","day":16,"room":"小ホール","start":"15:20","end":"17:00","chair":"座長：大賀　涼（自動車安全運転センター／東京都市大学）","talks":[{"id":"413","title":"渋滞時EyesOff機能がドライバの運転負担に与える影響評価 -公道実車実験による検討-","author":"塚田　竹美 ・佐藤　広歩・米満　竜太・福里　司（本田技術研究所）・石橋　基範（日本大学）","aff":["本田技術研究所","日本大学"],"abstract":"渋滞時EyesOff機能の効果を公道で検証した．HandsOff機能と比較し，主観評価および生理指標によりドライバ状態の変化を評価した．その結果，HandsOffに対する効果やドライバ状態の相違点，および提供価値向上のための示唆が得られた．","stream":"◯"},{"id":"414","title":"交通流の観測式に基づく密度推定型 ACC 制御則の提案","author":"入江　喜朗 ・森本　知昭（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"これまで交通工学分野において，渋滞発生メカニズムの解明が広く行われてきた．本稿では，高度な車両制御システムの構築を目的とし，微視的（個々の車両）な視点から渋滞発生のメカニズムを詳細に分析するとともに，その知見をACC制御アルゴリズムへ組み込むための検討を行った．","stream":"◯"},{"id":"415","title":"衝突実験後車両事象確認におけるフォトグラメトリを用いた三次元モデル化手法の有効性","author":"橋本　透 ・中田　杏里（本田技術研究所）","aff":["本田技術研究所"],"abstract":"衝突実験後の車両事象確認は，現物確認を基本とする一方で，時間的・空間的制約が大きく，関係者間での情報共有や再確認に課題を有している．本研究では，衝突実験後車両を対象にフォトグラメトリを用いた三次元モデル化手法を適用し，事象確認への有効性を検討した．撮影条件およびモデル生成手順を整理した上で，得られた三次元モデルの再現性および事象視認性について評価を行った．その結果，従来の写真記録と比較して，損傷形態の把握性および共有性が向上することを確認した．本手法は，衝突実験後の事象確認プロセスの高度化に寄与する可能性を有する．","stream":"◯"},{"id":"416","title":"先進運転支援システム（ADAS）使用時の他車両の急接近に対する衝突回避性能に関する実験的考察","author":"児島　亨 ・真鍋　裕輝・阿部　晃大・宅島　護・北田　幸一（自動車技術総合機構）","aff":["自動車技術総合機構"],"abstract":"先進運転支援システム（ADAS）を使用中に他車両が急接近する場面の例として，先行車急減速および急な割込み（カットイン）の実車実験を行った．実験結果から，当該場面における衝突被害軽減ブレーキ（AEBS）の作動の有無を含む，システムの衝突回避性能について考察した．","stream":"◯"}]}]</script>
<script>
(()=>{'use strict';
const sessions=JSON.parse(document.getElementById('jsae-data').textContent);
const root=document.getElementById('jsae');
let day=14, onlyFav=false, query='',view='auto';
const storageKey='jsae2026fav_v4';let favorites={};let persistOk=false;
function saveStatus(message,ok){const el=document.getElementById('save-state');if(el){el.textContent=' ／ '+message;el.style.color=ok?'#168047':'#c03a2b';}}
function persist(){try{const val=JSON.stringify(favorites);localStorage.setItem(storageKey,val);if(localStorage.getItem(storageKey)!==val)throw new Error('保存後の検証に失敗');persistOk=true;saveStatus('☆は端末に保存済み',true);return true}catch(e){persistOk=false;saveStatus('この環境では☆を保存できません。「☆をコピー」を使ってください',false);return false}}
try{const val=localStorage.getItem(storageKey);favorites=val?JSON.parse(val):{};localStorage.setItem('__jsae_test__','ok');if(localStorage.getItem('__jsae_test__')!=='ok')throw new Error('ストレージ検証エラー');localStorage.removeItem('__jsae_test__');persistOk=true;saveStatus('端末保存を利用可能',true)}catch(e){persistOk=false;saveStatus('この環境では☆が保持されない可能性があります',false)}
function exportBackup(){const ids=Object.keys(favorites).filter(k=>favorites[k]).sort();const txt='JSAE2026:'+ids.join(',');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>alert('お気に入りコードをコピーしました。メモ帳等に保管してください。')).catch(()=>prompt('この文字列をコピーしてメモに保管してください',txt))}else prompt('この文字列をコピーしてメモに保管してください',txt)}
function restoreBackup(){const txt=prompt('保存した JSAE2026: で始まるお気に入りコードを貼り付けてください');if(txt===null)return;if(!txt.startsWith('JSAE2026:')){alert('コード形式が違います');return}const ids=txt.slice(9).split(',').filter(x=>/^[st]\d{1,4}$/.test(x));favorites={};for(const k of ids)favorites[k]=true;persist();render();alert(ids.length+'件のお気に入りを復元しました')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const min=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const tm=v=>String(Math.floor(v/60)).padStart(2,'0')+':'+String(Math.round(v%60)).padStart(2,'0');
function interval(s,i){let a=min(s.start),b=min(s.end),n=s.talks.length;return [tm(a+(b-a)*i/n),tm(a+(b-a)*(i+1)/n)]}
const sid=s=>'s'+s.id,tid=t=>'t'+t.id;
function starred(id){return !!favorites[id]}
function star(id){return `<button class="star ${starred(id)?'on':''}" data-star="${esc(id)}" aria-label="行きたいを${starred(id)?'解除':'登録'}" title="行きたい">${starred(id)?'★':'☆'}</button>`}
function match(s,t){if(!query)return true;let hay=[s.id,s.title,s.room,s.chair,t?.id,t?.title,t?.author,(t?.aff||[]).join(' '),t?.abstract].join(' ').toLocaleLowerCase();return hay.includes(query)}
function selected(s){const xs=s.talks.filter(t=>match(s,t)&&(!onlyFav||starred(tid(t))||starred(sid(s))));return xs}
function visible(s){if(s.day!==day)return false; if(!query&&!onlyFav)return true;return (match(s,null)&&(!onlyFav||starred(sid(s))||s.talks.some(t=>starred(tid(t)))))||selected(s).length>0}
function talks(s,compact){return s.talks.map((t,i)=>({t,i})).filter(({t})=>!onlyFav||starred(tid(t))||starred(sid(s))).filter(({t})=>!query||match(s,t)).map(({t,i})=>{let iv=interval(s,i),fav=starred(tid(t));if(compact)return `<div class="talkmini ${fav?'fav':''}"><div style="flex:1;min-width:0"><div class="meta">${esc(t.id)} · ${iv[0]}–${iv[1]}（推定）</div><div class="title">${esc(t.title)}</div><div class="meta">${esc(t.aff.join(' / '))}</div></div>${star(tid(t))}</div>`;
return `<article class="talkcard ${fav?'fav':''}"><div class="talktext"><div class="meta">No.${esc(t.id)} · ${iv[0]}–${iv[1]}（推定） ${t.stream==='✕'?'· 後日配信なし':''}</div><div class="talkname">${esc(t.title)}</div><div class="aff">所属：${esc(t.aff.join(' / ')||'記載なし')}</div><details class="details"><summary>著者・概要を見る</summary><div class="aff">${esc(t.author)}</div><div class="abstract">${esc(t.abstract)}</div></details></div>${star(tid(t))}</article>`}).join('')}
function sessionCard(s){return `<section class="sessioncard ${starred(sid(s))?'fav':''}"><div class="daytime">${esc(s.start)}–${esc(s.end)} · ${esc(s.room)}</div><div class="sessiontop"><div style="flex:1"><div class="meta">SESSION ${s.id} · ${s.talks.length}講演</div><div class="sessionheading">${esc(s.title)}</div></div>${star(sid(s))}</div><div class="meta">${esc(s.chair)}</div>${talks(s,false)}</section>`}
function render(){document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('active',Number(b.dataset.day)===day));document.querySelector('[data-action=fav]').classList.toggle('active',onlyFav);
const items=sessions.filter(visible).sort((a,b)=>min(a.start)-min(b.start)||a.room.localeCompare(b.room,'ja'));
document.getElementById('agenda').innerHTML=items.length?items.map(sessionCard).join(''):'<div class="empty">該当するセッションがありません</div>';
const rooms=[...new Set(sessions.filter(s=>s.day===day).map(s=>s.room))].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
const first=9*60,last=20*60,scale=1.65;
const header=`<div class="timehead">時刻</div>${rooms.map(r=>`<div class="roomhead">${esc(r)}</div>`).join('')}`;
document.getElementById('gridhead').innerHTML=header;
let axis=`<div class="timeaxis" style="height:${(last-first)*scale}px">`;for(let m=9*60;m<=last;m+=60)axis+=`<div class="tick" style="top:${(m-first)*scale}px">${tm(m)}</div>`;axis+='</div>';
const lane=rooms.map(r=>{let ss=items.filter(s=>s.room===r);return `<div class="roomlane" style="height:${(last-first)*scale}px">${ss.map(s=>{const y=(min(s.start)-first)*scale,h=(min(s.end)-min(s.start))*scale;let all=talks(s,true);return `<section class="sessionblock ${starred(sid(s))?'fav':''}" style="top:${y}px;height:${h}px" ><div class="sessiontop"><div class="sessionname">No.${s.id} ${esc(s.title)}<div class="meta">${s.start}–${s.end}</div></div>${star(sid(s))}</div><div style="overflow:auto;flex:1">${all}</div></section>`}).join('')}</div>`}).join('');document.getElementById('gridcontent').innerHTML=axis+lane;
document.getElementById('stats').textContent=`${items.length}セッション / ${items.reduce((n,s)=>n+s.talks.length,0)}発表`;
}
root.addEventListener('click',e=>{let b=e.target.closest('[data-star]');if(b){let k=b.dataset.star;favorites[k]=!favorites[k];persist();render();return}let d=e.target.closest('[data-day]');if(d){day=Number(d.dataset.day);render();return}let ac=e.target.closest('[data-action]');if(ac){if(ac.dataset.action==='fav'){onlyFav=!onlyFav;render()}if(ac.dataset.action==='ics'){exportIcs()}if(ac.dataset.action==='backup'){exportBackup()}if(ac.dataset.action==='restore'){restoreBackup()}}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLocaleLowerCase();render()});
function exportIcs(){let rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//JSAE Planner//JA'];const stamp=m=>{let h=Math.floor(m/60),n=Math.round(m%60);return String(h).padStart(2,'0')+String(n).padStart(2,'0')+'00'}; const safe=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,c=>'\\'+c);
