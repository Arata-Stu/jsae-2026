<div id="jsae" class="app embedded"><header class="toolbar"><div class="top"><div><div class="brand">JSAE 2026 · セッションプランナー</div><div class="sub">秋季大会 学術講演会 / 10月14日–16日</div></div><div class="stats" id="stats"></div></div><div class="controls"><button class="btn active" data-day="14">14 水</button><button class="btn" data-day="15">15 木</button><button class="btn" data-day="16">16 金</button><button class="btn" data-action="fav">☆ 行きたいのみ</button><button class="btn" data-action="ics">予定を出力</button><button class="btn" data-action="backup">☆をコピー</button><button class="btn" data-action="restore">☆を復元</button><input class="search" id="search" type="search" placeholder="発表・会社・著者・テーマで検索" aria-label="検索"></div><p class="hint">発表時刻はセッション時間を発表数で均等割した推定値です（休憩を個別考慮しない計算）。☆は保存を試みます。保存できない場合は「☆をコピー」で控え、次回「☆を復元」してください。<span id="save-state" role="status"></span></p></header><main class="body"><div class="gridscroll"><div class="gridhead" id="gridhead"></div><div class="gridcontent" id="gridcontent"></div></div><div class="agenda" id="agenda"></div><div class="bottomnote">データ出典：自動車技術会 2026年秋季大会 学術講演会（9月9日現在）／非公式ビューア</div></main></div>
<script type="application/json" id="jsae-data">[{"id":93,"title":"xEV・熱マネージメント","day":14,"room":"大ホール1","start":"9:30","end":"11:10","chair":"座長：清水　修（東京大学）","talks":[{"id":"001","title":"ヘリウム注入による液化水素サブクーリングに関する数値解析手法の構築","author":"奈良　駿希 ・二門　永・藤浦　厳・髙嶋　英厳（AIS北海道）・内海　政春（室蘭工業大学）","aff":["AIS北海道","室蘭工業大学"],"abstract":"液体に注入した気泡は拡散により界面で気化熱を発生させ液体を冷却する．本研究は，この現象を利用したサブクーリングにより極低温液体を高密度化する技術を開発し，タンクに充填する極低温燃料のエネルギー密度を高めることを目的とする．本報は，気泡による液体冷却を評価するために開発した数値解析手法を報告する．","stream":"◯"},{"id":"002","title":"冷凍サイクルAIサロゲートモデルと信頼性判定手法の開発","author":"上村　匠 ・小林　謙太・節家　淳（マツダ）・Bisser Raytchev（広島大学）","aff":["マツダ","広島大学"],"abstract":"電気自動車の開発においては電池劣化等への対応を目的に，冷凍サイクルとパワートレインを連携したサーマルマネジメントシステムを検討している．その中で計算負荷の高い冷凍サイクルCAEモデルをAIサロゲート化して高速解析を可能にし，さらに信頼性判定モデルによりAIモデル出力の妥当性を検証する取り組みを報告する．","stream":"◯"},{"id":"003","title":"プローブデータの多要素解析と機械学習を用いたEV空調消費電力予測モデルの構築","author":"長谷川　滉一 ・土川　晴久・松井　弘毅・福井　陽喜（日産自動車）","aff":["日産自動車"],"abstract":"当社BEVのIntelligent Route Planner機能は車両エネルギー消費予測を基盤としている．このうち空調電力は環境・使用条件により変動し高精度化が課題である．本報では車両プローブデータから特徴量を抽出，機械学習予測モデルを構築，実走行データ検証により予測高精度化を確認した．","stream":"◯"},{"id":"004","title":"日射熱と走行風を利用した車載熱電発電システムの基礎検討","author":"下池　昌弥 （SUBARU）・岩瀬　勉・香西　俊彦（群馬大学/SUBARU）","aff":["SUBARU","群馬大学/SUBARU"],"abstract":"日射熱と走行風を併用した熱電発電システムの車載可能性を検討した．車載環境を模擬するために独自構築した試験機を用いて試験片の開放電圧を測定し，空気層付加による発電量向上と日射停止後も発電継続が可能となる傾向を確認した．","stream":"◯"}]},{"id":94,"title":"xEV・インフラ協調","day":14,"room":"大ホール1","start":"12:10","end":"14:50","chair":"座長：真島　隆司（MJ総合研究所）","talks":[{"id":"005","title":"リチウムイオンキャパシタを活用した走行中ワイヤレス給電EVのライフサイクル温室効果ガス排出量評価","author":"仲山　朝陽 ・太田　涼介（東京都立大学）","aff":["東京都立大学"],"abstract":"走行中ワイヤレス給電は限られた区間で充電を行うため，車載バッテリへの負荷が大きい．そこで大電力の入出力が得意なリチウムイオンキャパシタを併用し，バッテリの寿命を延ばすシステムを検討する．寿命延長による効果をライフサイクル全体の温室効果ガス排出量に換算し，その削減効果を定量的に評価する．","stream":"◯"},{"id":"006","title":"走行中ワイヤレス給電と自動運転の融合技術の開発","author":"清水　修・花房　一義（東京大学）・ 王　志宏 ・廣岡　芳記・岸　繁男（ピューズ）","aff":["東京大学","ピューズ"],"abstract":"電気自動車（EV）の普及に伴い，走行中ワイヤレス給電（DWPT）が近年注目を集めている．DWPTを自動運転車両に適用することで無人で無限に走行できる車両が現実できる．この技術を利用する上で重要な課題となるのが，カメラ・LiDAR・GPSなどの外界センサを用いても送電コイルの位置を直接検知できない点である．DWPTでは受電電力とコイルの位置関係には関係がある．そこで，受信側直流電流とビークルダイナミクスを用いて推定した送電コイルの位置を基に，自動運転システム側で操舵制御を行う手法を提案する．","stream":"◯"},{"id":"007","title":"強化学習型Stackelberg Gameに基づくEV利用と共有電池充電価格の最適化","author":"大野　結人 （名古屋大学）・稲垣　伸吉（南山大学）・鈴木　達也（名古屋大学）・中野　日加里（NUVVE JAPAN株式会社）","aff":["名古屋大学","南山大学","NUVVE JAPAN株式会社"],"abstract":"太陽光発電の余剰電力活用に向け，地域コミュニティのEVと共有蓄電池を協調運用するエネルギーマネジメントシステムについて検討する．システムの運用手法を構築し，種々の観点から評価を行うことで，実用化に向けた有効性と今後の課題について議論する．","stream":"◯"},{"id":"008","title":"双方向充電器を搭載した車両における充放電時のEMC試験の検討","author":"森　晃 （トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"電気エネルギーを有効活用するために双方向充電器を搭載した電動車両の普及が進んでいる．双方向充電器は充電モードと放電モードを有するが，両者に対して法規で定められているEMC試験を実施した場合，試験工数の増加が課題となる．そのため両者のEMC試験結果を比較して等価性を示すことで，充電モードのみの試験で代替できないか検討した．","stream":"◯"},{"id":"009","title":"直流マイクログリッドinコンテナの可能性","author":"芹澤　毅（ダイハツ工業）・小林　信裕（前田建設工業）・ 武田　正二 （ダイハツ工業）","aff":["ダイハツ工業","前田建設工業"],"abstract":"自動車用インバータ技術を応用し，50kW級の直流マイクログリッドを開発した．これは小型PCSと172kWh蓄電池，V2Xを20フィートコンテナに内蔵し移動が可能である．BEVとの組み合わせで可搬型分散インフラを実現し電力最適化とBCP効果を実証している．これらの効果について説明する．","stream":"◯"},{"id":"010","title":"MG中性点を活用した車載ビルトイン型V2Xの開発","author":"芹澤　毅 （ダイハツ工業）・依田　和之・藤田　悟（富士電機）・武田　正二（ダイハツ工業）","aff":["ダイハツ工業","富士電機"],"abstract":"MGの中性点と主機インバータとの組み合わせることでビルトイン型V2Xが実現できる．実機と同構成の原理試作機にてその効果を確認したので報告する．BEVを電力インフラとして利用するには高価なV2Xが必要であったが，この構成であれば既存システムの小改造ですみBEV利活用に弾みがつくと考えられる．","stream":"◯"}]},{"id":95,"title":"xEV・エネルギーマネジメント","day":14,"room":"大ホール1","start":"15:20","end":"18:00","chair":"座長：郡司　大輔（東京大学）","talks":[{"id":"011","title":"xEVの実走行状態を台上で再現する走行抵抗決定方法の要件の検討 -（第1報）xEVにおける車両ロスの現状と台上評価における課題-","author":"鈴木　央一 （自動車技術総合機構）・井上　勇（小野測器）・古田　智信（明電舎）・広瀬　翼（堀場製作所）・中手　紀昭（日本自動車輸送技術協会）","aff":["自動車技術総合機構","小野測器","明電舎","堀場製作所","日本自動車輸送技術協会"],"abstract":"電動車では，クラッチがなく惰行時に原動機が連れ回るため車両ロスが非連続に変化するものがあるのに対し，台上での負荷設定時にはこれを近似式に合わせこんで対応している．この点はシャシダイナモ試験法分科会で目指す台上での実路走行の再現向けて改善の余地があると考え，本報では現状と問題意識について提起する．","stream":"◯"},{"id":"012","title":"機械学習によるデータ解析を前提とした連続計測によるe-Axle損失評価手法","author":"児玉　亮哉 ・土川　晴久・松井　弘毅・犬飼　隆哉・鷹嶋　一直（日産自動車）","aff":["日産自動車"],"abstract":"電動車の主要因であるe-Axle損失の計測は，車両状態において回転数・トルクに加え油温・電圧にも依存し，多次元条件の計測が必要で長期化する．本研究では，動作領域で油温・電圧が広く変動するよう連続計測を設計し，取得データに基づく機械学習によりe-Axle損失MAPを短期間で構築し，有効性を確認した．","stream":"◯"},{"id":"013","title":"クラスタリング手法による走行パターン分類を用いたエネルギーマネジメントの検討","author":"石橋　雄登 ・林　和樹・廣渡　庸介・小塚　信（日産自動車）","aff":["日産自動車"],"abstract":"現行シリーズHEVのエネルギーマネジメントは複数の走行パターンを考慮した包括的な制御パラメータ設定となっている．これを走行パターンごとに最適化できれば燃費向上の余地がある．そこで，過去走行データから作成したクラスタにより走行パターンを分類し，それに応じた制御を適用することで，提案制御の有効性を確認した．","stream":"◯"},{"id":"014","title":"Modelica言語を用いた車載太陽光発電システムモデルの開発とxEVモデルへの適用","author":"水嶋　教文 ・水野　英範（産業技術総合研究所）","aff":["産業技術総合研究所"],"abstract":"オフサイクルクレジット制度導入に向け，シャシダイナモ試験では評価が困難な省エネルギー技術による燃費改善効果の定量的な評価手法が求められる．本研究では，車載太陽光発電システムをModelica言語によりモデリングし，産総研の車両シミュレーションモデルに統合することで，燃費改善効果の評価手法を開発した．","stream":"◯"},{"id":"015","title":"電動ごみ収集車の走行実態調査ならびに電費改善のための速度変化パターン最適化 -戸別ごみ収集走行時を対象とした検討-","author":"方　亦园 ・高　佳カイ・鮑　義達・楊　イ翔・紙屋　雄史（早稲田大学）","aff":["早稲田大学"],"abstract":"本研究では，戸別ごみ収集運用時における電動ごみ収集車の実走行挙動およびエネルギ消費特性について調査した．さらに，代表的な走行トリップを対象として，同一走行条件下で速度変化パターン最適化を実施した．その結果，動力システム損失を低減し，実運用時と比較して約20～28％の電費改善が可能であることを示した．","stream":"◯"},{"id":"016","title":"実路走行によるハイブリット自動車の燃費向上技術解析","author":"加藤　彰 ・沼田　浩介・安生　吏玖（帝京大学）","aff":["帝京大学"],"abstract":"2050年CNの実現に向け自動車の電動化が進んでいる．BEVの普及には多くの課題を有しており，日本においてはHEVの販売比率が高い．本研究では，低燃費小型HEVを用いて実路試験を実施し，その結果を前年モデルのHEVと比較解析することにより実路走行によるHEVの燃費向上技術に関して解析したので報告する．","stream":"◯"}]},{"id":96,"title":"水素エンジン","day":14,"room":"大ホール3","start":"9:30","end":"12:10","chair":"座長：山下　晃（トヨタ自動車）","talks":[{"id":"017","title":"モーターサイクル用直噴水素エンジンにおける多点熱流束計測と異常燃焼の影響評価","author":"益子　翔貴 （東京都市大学大学院）・及川　昌訓・三原　雄司（東京都市大学）・加賀　裕貴・横森　蒼司（東京都市大学大学院）・岩田　拓実（モトラ）・加藤　洋史・和泉　恭平（カワサキモータース）・佐野　堅一（本田技研工業）・神尾　朋彦（ヤマハ発動機）・二宮　至成（スズキ）・尾鷲　道康（モトラ）","aff":["東京都市大学大学院","東京都市大学","モトラ","カワサキモータース","本田技研工業","ヤマハ発動機","スズキ"],"abstract":"モーターサイクル用直噴水素エンジンのシリンダヘッドに4点の熱流束センサを搭載し，2000〜10000rpmの広い回転域の瞬時熱流束計測を行った．さらに，高回転域で発生する異常燃焼時の熱流束挙動の取得にも成功した．本研究では，多点同時計測結果に基づき，高回転域の熱流束特性と異常燃焼が壁面熱負荷に与える影響を報告する．","stream":"◯"},{"id":"018","title":"モーターサイクル用直噴水素エンジンにおける異常放電に起因する異常燃焼の発生機構に関する研究","author":"加藤　洋史 ・和泉　恭平・中尾　祥典・松本　優作・市　聡顕（カワサキモータース）・神尾　朋彦（ヤマハ発動機）・二宮　至成（スズキ）・佐野　堅一・丸井　勇介（本田技研工業）・近藤　卓（本田技術研究所）","aff":["カワサキモータース","ヤマハ発動機","スズキ","本田技研工業","本田技術研究所"],"abstract":"プレイグニッションやノッキングなどの異常燃焼は，カーボンニュートラル実現に向けた水素エンジン開発における重要な課題である．本研究では，モーターサイクル用直噴水素エンジンを対象に，異常放電に起因する異常燃焼現象の発生状況を，筒内可視化および点火二次電圧の計測により調査した．","stream":"◯"},{"id":"019","title":"筒内可視化による水素への炭化水素の混合が火炎伝播特性に及ぼす影響解析","author":"中村　知裕 ・堀田　拓哉・須田　涼介・上野　隆盛（日本大学大学院）・中尾　祥典（カワサキモータース）・松下　耕一朗（本田技研工業）・神尾　朋彦（ヤマハ発動機）・二宮　至成（スズキ）・飯島　晃良（日本大学）","aff":["日本大学大学院","カワサキモータース","本田技研工業","ヤマハ発動機","スズキ","日本大学"],"abstract":"本研究では，水素と炭化水素の混合が燃焼特性に及ぼす影響を，筒内可視化実験と圧力解析により調査した．火炎挙動はハイスピードカメラで撮影し解析した．その結果，水素を混合することで火炎伝播速度の向上が見られた．また，着火性の向上により熱発生が早期化し，燃焼が安定することが分かった．","stream":"◯"},{"id":"020","title":"Dedicated EGR 方式による水素リーン＋ストイキ燃焼エンジンの研究 -(第1報)　数値シミュレーションによるシステム検討-","author":"陳　登沛 ・森吉　泰生・石田　剛士・窪山　達也（千葉大学）・加藤　秀輝・長田　英朗（日野自動車）","aff":["千葉大学","日野自動車"],"abstract":"ゼロエミッションの実現に向けて内燃機関からのCO2とNOx排出の同時低減が求められている．本研究では，リーン燃焼排気（二気筒分）の100% EGRによる希釈ストイキ燃焼（二気筒分）を用いてTWC適用可能な二段燃焼式水素エンジンシステムをシミュレーションにより提案した．その結果を基に四気筒ディーゼルエンジンをベースとした実機構築を含めて検討した．","stream":"◯"},{"id":"021","title":"CFD数値解析による混合気形成の分析に基づく機械学習を活用した直噴水素エンジンの燃焼室形状の最適化","author":"箕田　賢太郎 （東京都市大学大学院）・新村　暢大（東京都市大学大学院/川崎重工業）・及川　昌訓（東京都市大学 HEET）・塚本　翔太（東京都市大学大学院）・宮本　世界（川崎重工業）・三原　雄司（東京都市大学 HEET）・高木　靖雄（東京都市大学）","aff":["東京都市大学大学院","東京都市大学大学院/川崎重工業","東京都市大学 HEET","川崎重工業","東京都市大学"],"abstract":"水素エンジンの高熱効率かつ低エミッションを実現するためには，燃焼室形状をはじめとする混合気形成の最適化が重要である．本研究では，混合気形成に対して均質度など3つの指標を設定し，機械学習を用いてこれらを定量的に評価することで，燃焼室形状の最適化を行った．さらに，その妥当性を実験的に評価した．","stream":"◯"},{"id":"022","title":"水素エンジンの混合気均質化に関わる噴流挙動と混合気形成過程の解析","author":"鮎川　健 ・山口　顕央・西村　星耶・佐々木　覚・後藤　政典・芹澤　一史（デンソー）","aff":["デンソー"],"abstract":"水素エンジンはカーボンニュートラルの実現に向けた有望な選択肢であるが，異常燃焼回避と高出力・低NOxの両立には，混合気の均質度向上が課題である．本研究では，均質混合気形成に必要な噴射・噴流の要件について，エンジン筒内における混合気形成メカニズムに着目し，CFD解析およびエンジン実機評価により明らかにした．","stream":"◯"}]},{"id":97,"title":"排気後処理I","day":14,"room":"大ホール3","start":"13:10","end":"14:50","chair":"座長：二宮　弘行（日野自動車）","talks":[{"id":"023","title":"アークプラズマ蒸着を利用した触媒スクリーニング法の検討（第2報） -NH3選択酸化触媒の探索-","author":"大堀　鉄平 ・米山　香澄・後藤　操（いすゞ中央研究所）・町田　正人（熊本大学）・小澤　恒（いすゞ中央研究所）","aff":["いすゞ中央研究所","熊本大学"],"abstract":"アークプラズマ蒸着を利用した触媒スクリーニング手法を用いて，NH3選択酸化触媒（NH3-SCO）の候補材料を探索した．得られた知見をディーゼルエンジンの後処理装置に用いられるアンモニアスリップ触媒に適用した結果，アンモニア酸化活性が高く，また，NOxやN2Oの副生が少ない優れた触媒特性を示した．","stream":"◯"},{"id":"024","title":"尿素SCRシステムにおける尿素水由来の白色固体の分析","author":"佐藤　梢・ 小島　隼人 （早稲田大学）・酒井　順司（いすゞ自動車）・草鹿　仁（早稲田大学）","aff":["早稲田大学","いすゞ自動車"],"abstract":"尿素SCRシステムでは低温域で尿素とその重合生成物由来とみられる堆積物が排気管内に生じる．本研究では低温の異なる排気温度で堆積物を採取し，熱化学分析によりこれらの組成を推定した．さらに，堆積物を昇温した際の消失過程を3段階の一次反応と仮定し，各反応の衝突頻度因子と活性化エネルギーを実験的に算出した．","stream":"◯"},{"id":"025","title":"尿素SCR触媒における尿素パルス噴射によるNOx浄化性能変化の研究","author":"植木　悠仁 ・吉田　楓香・草鹿　仁（早稲田大学）","aff":["早稲田大学"],"abstract":"ディーゼル車のNOx排出量削減が求められている．本研究では1Hz毎に行われる尿素の定常噴射と，定常噴射に任意のDuty比で尿素噴射の有無を制御するパルス噴射を行い，尿素SCR触媒のNOx浄化性能変化を調査した．尿素の噴射方法がNOx浄化性能に与える影響を調査するため，計算モデルを作成した．","stream":"◯"},{"id":"026","title":"水素エンジンへの適用を想定したCu-CHA型SCR触媒の水熱劣化の研究","author":"大野　史佳 ・吉田　楓香・新川　真生（早稲田大学）・森　高行・山田　浩也（東京濾器）・草鹿　仁（早稲田大学）","aff":["早稲田大学","東京濾器"],"abstract":"カーボンニュートラル化が進められる中で，水素エンジンが注目されている．水素エンジンの後処理にはNOx浄化のためSCRシステムが採用されており，本研究では複数種のCu-CHA型SCR触媒について水熱劣化及び排出ガスにおける水分含有量による影響を実験と数値計算によって調査した．","stream":"◯"}]},{"id":98,"title":"排気後処理II","day":14,"room":"大ホール3","start":"15:20","end":"16:35","chair":"座長：中山　智裕（SUBARU）","talks":[{"id":"027","title":"リアルワールドエミッション低減技術開発 -（第3報）V2X情報を活用した車両制御によるエミッション低減検討-","author":"加藤　美江 ・池本　雅里・塚越　崇博・西岡　寛真・川口　文悟（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"リアルワールドの複合条件下，時々刻々と変化する交通流は運転操作を介してエンジン作動および触媒状態に影響を与え，結果として排出ガス特性を変化させる．そのため，交通と車両が適切に協調することでリアルワールドエミッションの更なる低減ポテンシャルが期待される．本研究では，V2Xを模擬した交通情報を既報のデジタルツイン環境で再現し，交通・車両協調が排出低減に寄与し得る効果を示す．","stream":"◯"},{"id":"028","title":"リアルワールドエミッション低減技術開発（第4報） -ドライバの運転行動変容によるエミッション低減に関する研究-","author":"池本　雅里 ・今井　幸平・守山　恵太・塚越　崇博・西岡　寛真・川口　文悟（トヨタ自動車）・荒川　豊（九州大学）","aff":["トヨタ自動車","九州大学"],"abstract":"リアルワールドゼロエミッション実現には，パワートレーン・ドライバ・交通流の三位一体の開発が重要．本研究では，ドライバ運転操作によるエミッションを先読みし，ドライバへの行動変容働きかけによるエミッション低減効果を検証し，適切な働きかけによる環境配慮への意識変容とNOxの有意な低減を確認した．","stream":"◯"},{"id":"029","title":"100％電動駆動ハイブリッドパワートレインにおける再始動時触媒内酸素量検知によるHC，NOx浄化率向上","author":"村上　浩一 ・諸星　篤史・坂田　知弘（日産自動車）","aff":["日産自動車"],"abstract":"100％電動駆動ハイブリッド車でのエンジン再始動時の排出ガス低減を検討した．多段化した三元触媒システムでの各触媒の酸素吸蔵量の制御に着目し，触媒間に酸素センサを配置し目標空燃比を最適化した結果，前段触媒での迅速な酸素量消費と後段触媒での酸素量保持によりHC，NOx浄化率は大きく向上した．","stream":"◯"}]},{"id":99,"title":"排出ガス・CO 2 低減","day":14,"room":"104+105","start":"9:30","end":"12:10","chair":"座長：柴田　元（北海道大学）","talks":[{"id":"030","title":"脱炭素化に伴うエネルギー変革が2050年大気質に与える影響評価 -排気および非排気エミッションの影響-","author":"安川　侑佑 ・山田　裕之（東京電機大学）・山田谷　佳明・森川　多津子・早崎　将光（日本自動車研究所）・渡辺　宏江（日産自動車）・田中　光太郎（茨城大学）・岡山　紳一郎（モトリティ）・柴田　芳昭（大気環境総合センター）・木所　徹（トヨタ自動車）","aff":["東京電機大学","日本自動車研究所","日産自動車","茨城大学","モトリティ","大気環境総合センター","トヨタ自動車"],"abstract":"第7次エネルギー基本計画に基づきカーボンニュートラルを実現する2050年の大気質シミュレーションを行った．また，その結果における自動車環境対策の有効性を示す目的で，テールパイプ，非テールパイプエミッションおよび両方に対する感度解析を行った．","stream":"◯"},{"id":"031","title":"自動車セクターを対象とした中長期シナリオ分析におけるCO2排出量と費用対効果の検討","author":"金成　修一 ・平井　洋・北村　高明（日本自動車研究所）","aff":["日本自動車研究所"],"abstract":"自動車セクターを対象に2050年までのCO2排出量予測モデルを構築した．従来の車両単体対策だけでなく，交通流対策や自動車の最適利用も追加し，統合対策による費用算出を可能にしている．これをエネルギー基本計画に基づく複数のシナリオへ適用し，脱炭素化に向けた統合対策のCO2削減費用を詳細に検討した．","stream":"◯"},{"id":"032","title":"Effect of Fabrication Parameters on CO Oxidation Characteristics of Three-Way Catalyst Microparticles Membrane on Gasoline Particulate Filter","author":"Eugene Gatete ･Tsuyoshi Nagasawa (Institute of Science Tokyo)","aff":["Institute of Science Tokyo"],"abstract":"This paper investigate effect of membrane fabrication parameters on CO oxidation for advanced gasoline particulate filters with three ways catalytic TWCGPF functionality. Using ultrasonic spray, TWC microparticles were generated at 700 and deposited onto GPF wall. CO oxidation were conducted to investigate catalytic performance of metal amounts and sintering temperatures. Comparing both two and four times precious metal loadings over standard TWC/GPF fired at 900, the light-off temperature T50 decreased the catalyst performance by 4.196 and 9.091 percent, however it led to an increase of CO conversion rate at full conversion temperature T100 by 33.984 and 32. 031 percent respectively","stream":"◯"},{"id":"033","title":"周期的再生式DPFを搭載したディーゼルエンジンにおける固体粒子数の排出挙動と評価法","author":"志村　渉 （自動車技術総合機構）","aff":["自動車技術総合機構"],"abstract":"周期的再生式DPFでは，捕集効率の変動に伴ってSPN排出量が大きく変動し，特に再生直後は捕集効率の低下により，SPNの排出量とばらつきが増大する．本研究では，周期的再生式DPFを搭載した重量車用ディーゼルエンジンにおけるSPN排出挙動を評価し，認証試験においてSPN排出量を簡便かつ適切に評価する方法を提案する．","stream":"◯"},{"id":"034","title":"尿素SCRシステムを搭載した大型貨物車の使用過程における排出ガス性能の変化に関する研究","author":"山本　敏朗 （自動車技術総合機構）","aff":["自動車技術総合機構"],"abstract":"尿素SCRシステム搭載大型貨物車に対して，15万km～50万kmと積算走行距離が増加する中で定期的にシャシダイナモメータ試験を実施し，同一車両の排出ガスデータを継続的に収集した．これを基に，使用過程におけるNOx，PM，N2O等の排出量から排出ガス性能の変化を把握すると共に変化の原因を探った．","stream":"◯"},{"id":"035","title":"DAC用ハニカム構造体の自動車への搭載可能性検討","author":"佐久間　亮輔 ・金山　洸大・朱　樹為・三浦　和人・豊嶋　秀幸・豊島　哲雄（NGK）","aff":["NGK"],"abstract":"DAC用ハニカム構造体の自動車搭載可能性検討のため，車両走行時の空気流動を模擬し，CO₂吸着挙動を確認した．走行条件と吸着速度の関係から適切な構造体容積および交換頻度等を検討した．","stream":"◯"}]},{"id":100,"title":"新型機関・評価","day":14,"room":"104+105","start":"13:20","end":"14:35","chair":"座長：石本　淳（東北大学）","talks":[{"id":"036","title":"フリーピストンを用いた可変圧縮比システム -アトキンソンサイクルを実現する新しいメカニズム-","author":"佐藤　智明 （神奈川工科大学）・北原　立朗（湘南工科大学）","aff":["神奈川工科大学","湘南工科大学"],"abstract":"本研究は，シリンダー内に配置したフリーピストンにより，エンジン稼働中でも圧縮比を自在に変更できる新しい内燃機関システムを提案する．これによって，複雑な機構なしでアトキンソンサイクルを実現し，運転条件に応じた最適制御を可能とするとともに，新たな熱機関サイクル創出の可能性を示す．","stream":"◯"},{"id":"037","title":"小型2ストロークユニフロー掃気対向ピストンエンジンの研究","author":"大槻　涼真 （日本大学大学院）・荒岡　快・奥山　拓海（日本大学）・大川原　育未・山崎　良明（日本大学大学院）・飯島　晃良（日本大学）","aff":["日本大学大学院","日本大学"],"abstract":"近年，脱炭素化に伴いEVの普及が進む一方，航続距離や充電インフラ不足などの課題から内燃機関が再注目されている．こうした状況下で，従来設計とは異なる高効率エンジンの需要が高まっている．そこで本研究では，発電用エンジンに着目し，2ストローク対向ピストンエンジンの有用性について検討，評価を行う．","stream":"◯"},{"id":"038","title":"ハイブリッド車両のエンジン効率ベンチマーキングにおける測定手法の比較","author":"Sukjoo Kim ・Youngkuk An・Byungsoon Min（テナジ）","aff":["テナジ"],"abstract":"ハイブリッド車両のエンジン効率は燃費性能を左右する重要な指標であり，競合車両の正確な評価は開発方向の選定に重要である．CAN通信取得トルクによる簡易推定法，燃料流量計と燃焼圧による算出法，車両接続状態でエンジンと変速機間にトルクセンサーを設置した実測法の三手法を比較し，測定精度と実用性を評価した．","stream":"◯"}]},{"id":101,"title":"LCA・リユース・リサイクル","day":14,"room":"104+105","start":"15:05","end":"17:45","chair":"座長：古山　隆（東北公益文科大学）","talks":[{"id":"039","title":"リビルト部品製造工程の環境影響評価","author":"花木　斗椰 ・山田　樹（富山県立大学）・早川　明宏・根津　俊大・藤田　光伸（NGP）・井上　全人（明治大学）・森　孝男・山田　周歩（富山県立大学）","aff":["富山県立大学","NGP","明治大学"],"abstract":"従来のリサイクル部品の環境影響評価は，気候変動に対するGHG排出量に着目したものが主であり，多角的な環境影響の分析が不足していた．本研究では自動車のエンジン及び補機類を対象に，使用済み車の解体からリビルト製造に至るプロセスの環境影響を，LIME2を用いて評価し，各工程の影響と効果的な改善工程を特定した．","stream":"◯"},{"id":"040","title":"自動車CVTのリマニュファクチャリングを対象とした環境影響評価","author":"一沢　直起 （早稲田大学）・児玉　真吾・澤井　晶子（アイシン）・成田　浩（オーキス）・伊坪　徳宏（早稲田大学）","aff":["早稲田大学","アイシン","オーキス"],"abstract":"循環経済の実現に向け，CVTのリマニュファクチャリングにおける環境影響評価を行った．製造現場の詳細なプロセス調査に基づく実測データを用いてLCAを実施し，部材の再利用が複数領域の環境負荷および統合化された環境被害コストを大幅に抑制することを実証し，国内再生市場の発展に資する定量的基盤を提示した．","stream":"◯"},{"id":"041","title":"メカニカルリサイクルに伴うポリプロピレン中オリゴマーおよび添加剤の構造変化","author":"塩路　浩隆 ・谷口　暢子・田村　俊・山中　亨（東レリサーチセンター）・橋本　陸・池上　亮（アイシン）","aff":["東レリサーチセンター","アイシン"],"abstract":"自動車用途においてポリプロピレン（PP）は主要な部品であり，そのリサイクルは重要である．リサイクルに伴うPPの変化を把握することは，バージン材との差異を理解するうえでも重要である．本研究では，メカニカルリサイクルに伴うPP中のオリゴマーや添加剤の構造変化について分析検討を行った．","stream":"◯"},{"id":"042","title":"ブラックマスの初期組成が湿式リサイクルにおける有価金属回収率に及ぼす影響","author":"青木　靖仁 ・森脇　博文・伊東　知宏・八尋　惇平・辻　洋悦・関　伸弥（東レリサーチセンター）","aff":["東レリサーチセンター"],"abstract":"電動車両の普及に伴い，使用済みLIBリサイクルの重要性が高まっている．本講演では，初期状態の異なる2種類のブラックマスを用い，湿式プロセスにおけるNi，Co，Mn，Liの溶出挙動および不溶残渣の組成を比較し，有価金属回収率に及ぼすブラックマス初期組成の影響を検討する．","stream":"◯"},{"id":"043","title":"リユース部品生産におけるトラック解体工程モデルの一般化と環境影響評価","author":"納村　青葉 ・北　和将（富山県立大学大学院）・早川　明宏・根津　俊大（NGP）・竹中　優一（トラックリファインパーツ協会）・藤田　光伸（NGP）・井上　全人（明治大学）・森　孝男・山田　周歩（富山県立大学）","aff":["富山県立大学大学院","NGP","トラックリファインパーツ協会","明治大学","富山県立大学"],"abstract":"自動車リサイクルにおいて，トラック解体工程は工場により異なり，標準的なモデルが存在しない．そのため，リユース部品活用による環境負荷削減効果の算出結果が工場ごとに異なる問題がある．本研究では，異なる2工場をおけるトラック解体工程モデルを一般化し，その環境影響を示す．","stream":"◯"},{"id":"044","title":"車載電池二次利用システムの長寿命化制御","author":"楊　殿宇 ・伊沢　理加・永野　弘起（マツダ）・石丸　淳一・小川　明宏（中国電力）・瀬尾　宣英・村重　和宏・宇都宮　隆・藤川　叶夢・和田　信敬（広島大学）","aff":["マツダ","中国電力","広島大学"],"abstract":"車載用電池の二次利用は環境負荷低減の観点から期待されるが，複数電池で構成される二次利用システムでは電池劣化のばらつきにより最短寿命電池が全体寿命を制約する．本研究では劣化モデルに基づくモデル予測制御（MPC）による電力配分制御を構築し，外部電力要求を満足しつつシステム寿命を延長する手法を提案する．","stream":"◯"}]},{"id":102,"title":"車両運動I","day":14,"room":"107+108","start":"9:30","end":"12:35","chair":"座長：服部　義和（豊田中央研究所）","talks":[{"id":"045","title":"ドライビングシミュレータとブレーキHILS連成による車両運動性能予測","author":"秋山　公太 ・井手　亮介・前田　義紀（トヨタ自動車）・武智　健太郎・河合　美紅（トヨタテクニカルディベロップメント）","aff":["トヨタ自動車","トヨタテクニカルディベロップメント"],"abstract":"本研究では，開発初期段階における車両運動性能の予測を目的とした統合評価環境を提案する．ケーススタディとして，跨ぎμ路におけるトラクションコントロール性能を評価した．本環境により，安定性と加速性能のトレードオフ解析が可能となり，実車試験への依存を低減できることを示した．","stream":"◯"},{"id":"046","title":"ボディ剛性が車両挙動に及ぼす影響に関する詳細タイヤモデルを考慮した車両運動シミュレーション","author":"本田　晴樹 ・大下　晴矢・吉田　憲司（広島工業大学）","aff":["広島工業大学"],"abstract":"学生フォーミュラ車両を対象とし，ボディ剛性が車両挙動に及ぼす影響について，詳細タイヤモデルを考慮した四輪モデルによる車両運動シミュレーションを行う．転舵や制動の入力に対する過渡領域に注目し，ボディ変形によるタイヤの姿勢や荷重変化が車両挙動に及ぼす影響を明らかにし，必要十分なボディ剛性を定量的に示す．","stream":"◯"},{"id":"047","title":"車両運転時におけるシート動的支持性能の定量評価手法の構築","author":"澁江　秀明 ・小林　裕太郎・村松　英行（S&VL）","aff":["S&VL"],"abstract":"本研究は，車両運転時におけるシート性能を客観的・定量的に評価可能な新たな評価手法の確立を目的とする．ドライバの身体挙動およびステアリング操作力・把持力を統合的に計測し，シートの動的支持特性を指標化する枠組みを構築した．ドライビングシミュレータ実験によりシート特性差を捉え，本手法の有効性を示した．","stream":"◯"},{"id":"048","title":"Development of 3-wheel EV vehicle Durability Mode Through Local Measurement in India","author":"Seungyong Bae ･Daejin Kim･Seongwoo Kim･Miyong Lee･Seungwan Son･Donghyun Ha･Damhyun Kim･Gyunam Park･Jaewan Kwon･Junwoo Chung (Hyundai Motor)","aff":["Hyundai Motor"],"abstract":"The company is pursuing the development of a three-wheeled electric vehicle to enter the Indian market and has set securing durability performance as a key task. This study aims to improve vehicle design and verification efficiency by developing a TDP that reflects the driving conditions in India. It sets durability targets, sets road ratios, constructs routes, sensors, and measures. Accelerated durability testing scenarios were developed using competitor testing routes. Finally, three types of TDPs were constructed for the combined actual road, unpaved road, and Rig test conditions to establish a durability evaluation system.","stream":"◯"},{"id":"049","title":"車体横滑り角速度に基づく制駆動力配分制御による操縦安定性向上手法","author":"馬塲　翔眞 ・澤瀬　薫・豊田　博充・古賀　亮佑・河合　一憲（三菱自動車工業）","aff":["三菱自動車工業"],"abstract":"電動車は高自由度・高応答な制駆動力制御により高い操縦性を発揮できる一方，悪路においてリヤ安定性低下の懸念がある．本課題に対し従来のヨーレイトフィードバック制御に車体横滑り角速度を一定範囲に収束させる新たな制御則を追加した．提案制御により悪路における車両安定性および操舵追従性の向上を確認した．","stream":"◯"},{"id":"050","title":"線形域の車両運動における減衰比制御の基礎的検討","author":"大久保　直人 ・小山　亮・本庄　史明（本田技術研究所）","aff":["本田技術研究所"],"abstract":"ヨーレートと横すべり角の定常ゲイン，ならびに固有振動数を変化させることなく，前後力による直接ヨーモーメントの付加により減衰比を任意に調整可能な制御手法を考案した．さらに，本手法により減衰比のみを変化させることを狙った制御の効果を，シミュレーションにより検証した．","stream":"◯"},{"id":"051","title":"積載条件を考慮したBEVトラックの運転・運動特性の解析","author":"髙橋　和匡 ・鎌田　崇義（東京農工大学）","aff":["東京農工大学"],"abstract":"本研究は安全な車両制御システム開発のために，近年電動化が進む小型BEVトラックを対象として車両の運動特性を解析した．トラックはその用途から荷物の積載状態によっても運動特性が変化すると考えられるため，5つの積載条件を設定し従来の小型内燃機関トラックと小型BEVトラックの操舵に対する応答の比較を行った．","stream":"◯"}]},{"id":103,"title":"車両運動II","day":14,"room":"107+108","start":"13:45","end":"15:50","chair":"座長：占部　博之（本田技術研究所）","talks":[{"id":"052","title":"MR流体減衰力可変ロータリーダンパーの開発と性能評価","author":"谷口　翔 ・釜田　忍・兼重　宙・花嶋　幸博・石原　宙・Ramadhan Bayu Priyo（THK）","aff":["THK"],"abstract":"近年，車両運動制御の高度化により，減衰力可変ダンパーへの性能要求が高まっている．本研究では，ロータリーダンパーにMR流体を組み合わせ磁場印加することで，広範囲の減衰力制御と小型化を実現したMR流体減衰力可変ダンパーを開発している．今回，台上および実車で性能検証を実施したので報告する．","stream":"◯"},{"id":"053","title":"旋回時ジャッキング特性の理論的考察と台上実験検証","author":"山本　真規 （神奈川工科大学）・大木　幹志（トヨタ自動車）","aff":["神奈川工科大学","トヨタ自動車"],"abstract":"定常旋回におけるジャッキング特性について，独立懸架式サスペンションだけでなく，トーションビーム式に代表されるリジッド系サスペンションも含めて理論的に考察する．また，路面入力の影響を受けない台上試験装置による実車実験手法を考案し，サスペンション形式とジャッキング特性の関係を検証する．","stream":"◯"},{"id":"054","title":"Development of an Edge Device and Cloud Environment for Replica Vehicle Implementation","author":"Seungwan Son ･Daejin Kim･Seungyong Bae (Hyundai Motor)･Minchul Lee (ACEWORKS)","aff":["Hyundai Motor","ACEWORKS"],"abstract":"To support the establishment of vehicle durability targets using data from a large fleet, an AI-based virtual sensor was developed to enable the creation of a replica vehicle. An Edge Device was implemented to provide an onboard development environment, built on the ROS framework, enabling machine learning model development using CAN RAW data and measurement data. These models facilitated the estimation of suspension transfer loads. Furthermore, a cloud-based development environment was constructed to support scalable data acquisition, model training, and load prediction, contributing to reliable and data-driven durability evaluation.","stream":"✕"},{"id":"055","title":"道路曲率・カントを考慮した大型バスの車両運動モデルに基づくPath Following制御","author":"蟻田　知希 ・櫻井　亮輔・杉町　敏之・櫻井　俊彰・矢作　修一（東京都市大学）・籾山　冨士男・青木　啓二（先進モビリティ）","aff":["東京都市大学","先進モビリティ"],"abstract":"バスの操舵制御では，車両特性を考慮した制御系設計が重要である．本研究では，道路曲率およびカントを考慮した大型バスの車両運動モデルを構築し，モデルに基づくPath following制御系を設計した．さらに，横風外乱を導入したシミュレーションを実施し，提案制御系の制御性能および横風環境下におけるロバスト性について評価した．","stream":"◯"},{"id":"056","title":"旋回中の自動二輪車を表す簡易モデルにおけるモード解析","author":"平澤　順治 （茨城工業高等専門学校）","aff":["茨城工業高等専門学校"],"abstract":"自動二輪車の簡易モデルの確立を目的とした研究である．直立近傍での直進を前提にしたSharpの二輪車モデルで旋回中の解析を行うことに限界があるため，新たに基準ロール角で旋回する二輪車を元にモデルを構築，モード解析を行う．","stream":"◯"}]},{"id":104,"title":"車両運動III","day":14,"room":"107+108","start":"16:20","end":"19:00","chair":"座長：木谷　友哉（静岡大学）","talks":[{"id":"057","title":"EPSシステムのピニオンギヤ支持構造に関する一考察","author":"三好　尚 （本田技術研究所）","aff":["本田技術研究所"],"abstract":"本研究では，ダイレクトな操舵感を実現するため，EPSにおけるトーションバーを含むピニオンギヤの支持構造に求められる機械的性能を検討した．その結果，ピニオンギヤに作用する横荷重と変位の線形性がダイレクト感へ寄与度することが明確となったため，操舵感向上に寄与し得る新構造を提案する．","stream":"◯"},{"id":"058","title":"操舵系と車両運動の連成構造から見た等価操舵トルク特性が人による車両運動性能評価に及ぼす影響","author":"石尾　隼 （本田技術研究所）・安部　正人・久代　育生・山本　真規（神奈川工科大学）・鈴木　礼音（神奈川工科大学大学院）・山門　誠（神奈川工科大学）","aff":["本田技術研究所","神奈川工科大学","神奈川工科大学大学院"],"abstract":"制御を含む操舵系と車両運動を連成系として定式化し，非線形EPSアシストを含む場合にも内力を介して操舵系を1自由度に縮約できることを示した．さらに導出した等価操舵トルク特性を用い，これが人による車両運動性能の評価に及ぼす影響を，ドライビングシミュレータを用いて確認した．","stream":"◯"},{"id":"059","title":"タイヤ回転次数振動の位相結合構造に基づくロードインフォメーション再現加振手法の提案","author":"鈴木　拓也 （本田技術研究所）","aff":["本田技術研究所"],"abstract":"ステアバイワイヤ車両のロードインフォメーション再現を目的に，ステアリング走行振動を位相差解析した．タイヤ回転次数振動のサイドバンドがキャリアと180°の位相結合を持ち，振幅変調のFFT表現であることを発見した．本知見に基づくパラメトリック加振モデルにより，従来手法に対する信号再現性の向上を示した．","stream":"◯"},{"id":"060","title":"階層勾配法を用いたステアバイワイヤ転舵制御の開発 -（第一報）-","author":"深井　怜 ・古市　崇・坪内　淳志（本田技術研究所）・澁江　秀明・村松　英行（S&VL）・岩村　誠人（福岡大学）","aff":["本田技術研究所","S&VL","福岡大学"],"abstract":"ステアバイワイヤを搭載した車両の旋回安定性向上を目的に転舵制御を開発している．複数の最適化条件に対して安定的な最適化を可能とする階層勾配法により，旋回安定性の高い転舵量を導出することで制御を行う．本報では転舵制御への階層勾配法の適用手法とドライビングシミュレータを用いた初期評価結果を報告する．","stream":"◯"},{"id":"061","title":"複数の電子部品の電圧降下を考慮したアース配置検討","author":"清野　賢子 ・駒田　匡史・鴫原　孝佳（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"操安性に関連する複数の電子部品の安定作動には，電圧降下を抑えたアース配置が重要である．本報では，実車ボデーシェルモデルに対して抵抗値計算を行い，複数アースにおける電流入力の組み合わせ条件下で生じるアース間電位差のばらつきと電圧降下を低減するアース配置の検討法について報告する．","stream":"◯"},{"id":"062","title":"データ駆動型ADRCに基づく車両横運動制御","author":"矢作　修一 （東京都市大学）・梶原　逸朗（北海道大学）","aff":["東京都市大学","北海道大学"],"abstract":"本研究では，車両横運動系を対象とした能動的外乱抑制制御（ADRC）のデータ駆動型設計法を提案する．提案手法は，所望の制御性能を実現するADRCを一組のデータから直接的に設計することが可能である．シミュレーションにより，本手法の有効性を検証し，良好な制御性能が得られることを確認した．","stream":"◯"}]},{"id":105,"title":"SLAM・生成AIによる設計支援","day":14,"room":"中ホールA","start":"9:30","end":"11:10","chair":"座長：山下　隆義（中部大学）","talks":[{"id":"063","title":"Parking-to-Parking自動運転に向けた市販車データに基づくクラウドソーシングの駐車場地図生成手法の検討","author":"加藤　雄大 ・早川　和孝・岡部　寛（アイシン）・前川　敬介・長瀬　伊織（パナソニックアドバンストテクノロジー）・福田　直季（アイシン）","aff":["アイシン","パナソニックアドバンストテクノロジー"],"abstract":"出発地の駐車区画から目的地の駐車区画まで公道および駐車場内を含めて自動走行する機能（Parking to Parking）を実現するため，本研究では市販車から収集されるセンサデータを活用した駐車場地図のクラウドソーシング生成技術を検討する．GNSSが利用困難な屋内・地下環境においても，複数車両の観測を統合することで幾何情報と意味情報を付与した地図を生成し，継続的な更新を可能とする．専用計測車両に依存しない低コストかつスケーラブルな地図構築方式の実現を目指し，提案手法の構成および有効性を検討する．","stream":"◯"},{"id":"064","title":"AVP向けクラウド型駐車場地図生成技術の開発","author":"坂野　盛彦 ・酒井　貴大（日立製作所）・小笠原　佳伸・豊田　英弘（Astemo）","aff":["日立製作所","Astemo"],"abstract":"Automated Valet Parking（AVP）向けに，クラウド型駐車場地図生成および高速自己位置推定技術を提案する．深層学習特徴とハンドクラフト特徴を併用するデュアルディスクリプタ地図により，高精度地図生成とリアルタイム自己位置推定を両立した．さらに地図の分割・統合生成により，大規模駐車場における実用性を実証した．","stream":"◯"},{"id":"065","title":"電動ウォーターポンプの形状設計を対象とした形状生成AI活用による最適化プロセスの構築と実務適用課題","author":"茨木　優花 （アイシン）・寺部　俊紀（トヨタ自動車）・北村　恭平・中井　祥平（アイシン）","aff":["アイシン","トヨタ自動車"],"abstract":"電動ウォーターポンプを対象に，DeepSDFによる形状生成とサロゲートモデルを組み合わせた形状最適化手法を検討した．潜在変数と性能の関係を活用することで，新規形状の最適化と性能予測を実現した．本講演では，実務適用において顕在化した課題と今後の展望について報告する．","stream":"✕"},{"id":"066","title":"潜在空間を活用した性能起点型3D形状生成技術の研究","author":"大竹　啓介 ・鈴木　啓晃・架場　勇介（ヤマハモーターエンジニアリング）・四條　清文・Muhammad Ibram Hibbanurrohim（アストライアーソフトウエア）","aff":["ヤマハモーターエンジニアリング","アストライアーソフトウエア"],"abstract":"本研究では，潜在空間を用いた3D形状生成および設計支援手法を提案した．VAEと拡散モデルを融合した生成モデルを構築し，生成された3D形状に対するCAE解析結果を潜在空間上に対応付けることで，所望性能に基づく形状逆探索と新規形状創出の可能性を示すとともに，設計支援手法としての有用性を確認した．","stream":"◯"}]},{"id":106,"title":"AI・データ解析と評価技術","day":14,"room":"中ホールA","start":"12:10","end":"13:50","chair":"座長：松下　晃洋（日産自動車）","talks":[{"id":"067","title":"任意走行ルートでの車両動特性予測へ向けた実車走行ビッグデータ解析","author":"岡本　真範 （トヨタシステムズ）・樗澤　英明・吉村　知浩（トヨタ自動車）・Thomas Bernes Lasserre（Toyota Motor Europe）・長谷川　茂樹（トヨタ自動車）","aff":["トヨタシステムズ","トヨタ自動車","Toyota Motor Europe"],"abstract":"コネクティッドカーから収集した市場走行ビッグデータを用い，車種・地域・道路条件の違いによる車両動特性（車速・加速度等）への影響を分析した．本研究で得られた特性は，任意走行ルートにおける走行挙動の高精度予測，およびそれを活用した動力・燃費・耐久性等のシミュレーションへの適用が期待される．","stream":"◯"},{"id":"068","title":"機械学習を用いた車両旋回時における官能評価の定量化","author":"金堀　凌也 ・清水　友博・杉山　諭・岡本　信・浅野　貴文・金子　隆（SUBARU）","aff":["SUBARU"],"abstract":"車両運動性能の把握は官能評価に依存しており，設計・制御への定量的反映に多大な工数を要していた．そこで走行データと官能評点を用い，ランダムフォレストと特徴量空間の類似度評価を組み合わせた分析の自動化を実現．高評価挙動に対応する性能指標を短期間かつ再現性高く導出可能とし，設計効率化の基盤技術を構築した．​‌","stream":"◯"},{"id":"069","title":"自動運転システムの安全性評価に向けた路上画像生成AIに関する検討","author":"尾崎　信利 ・新国　哲也（自動車技術総合機構）","aff":["自動車技術総合機構"],"abstract":"自動運転システムの安全性評価では，多様な交通状況をシステムが適切に認識できるかを検証する必要がある．一方，実環境データだけでは，評価に必要な場面を十分に網羅することが難しい．そこで本研究では，路上画像の物体検出AIの評価を想定し，画像生成AIを用いた評価シーンの生成手法について検討する．","stream":"◯"},{"id":"070","title":"数理最適化手法による試験スケジューリングの自動化","author":"渡辺　敏博 ・吉本　博・寺部　俊紀・長村　雄也・阿部　淳一（トヨタ自動車）・鈴木　浩介・阪本　哲郎・生田　朋子（フィックスターズ）","aff":["トヨタ自動車","フィックスターズ"],"abstract":"これまで熟練者の経験とノウハウに頼っていた試験計画業務に対し，誰でも短時間で最適な試験計画を立案できることを目指し，数理最適化手法を導入した．試験に必要な装置や人等を洗い出し，熟練者の暗黙知やルールを数式化することで，短時間での計画立案ができることに加え，試験実施のボトルネックの分析が可能となった．","stream":"✕"}]},{"id":107,"title":"SIL/HIL・仮想ECU検証技術","day":14,"room":"中ホールA","start":"14:20","end":"17:00","chair":"座長：Juyal Chirag（スズキ）","talks":[{"id":"071","title":"ADAS ECUとメータ表示の整合性評価システム","author":"髙野　博幸 （日産自動車）・Anhtuan Ngo・Ducphong Nguyen（日産オートモーティブテクノロジーベトナム）・木田　知宏（不動技研工業）・丸田　大介（アクセンチュア）・常門　茂徳（日産自動車）","aff":["日産自動車","日産オートモーティブテクノロジーベトナム","不動技研工業","アクセンチュア"],"abstract":"ADAS ECU信号とメータ表示の整合性を自動で評価するHILシステムを開発した．カメラで取得したアイコン画像を画像認識し，ECU信号と同期して比較・判定する．メータ表示の多様複雑な表現を信号化しECU信号と同期比較することで単純化した．車両検証工程に投入し評価を行いテスト工数を削減した．","stream":"◯"},{"id":"072","title":"A Method for Time Error Correction in SIL Simulation","author":"Kyungnam Kim ･Seungkyu Yoo･Hyunrak Ko･Sumin Park (Hyundai Autoever)","aff":["Hyundai Autoever"],"abstract":"Precise time synchronization is crucial in Software-in-the-Loop (SIL) simulations. Conventional Sleep () functions lack microsecond accuracy, while Spinlock causes severe CPU degradation. This study proposes a hybrid time-delay method achieving 1-microsecond precision while maximizing CPU efficiency. It dynamically combines a low-cost timer (Sleep) with a high-cost timer (Spinlock). Using Welford's online algorithm, the system calculates the Sleep timer's statistical execution error in real-time. To save resources, it utilizes Sleep initially, transitioning to Spinlock only when the remaining wait time falls below the predicted error, effectively eliminating time discrepancies.","stream":"◯"},{"id":"073","title":"Research on Interface Methods between Virtual IP Models and Simulators in SIL Environments","author":"Jaekyung Kim ･Kyungnam Kim･Subin Jung･Haram Park (Hyundai Autoever)","aff":["Hyundai Autoever"],"abstract":"In SIL environments, integrating virtual IP models with simulators using FMU standard causes performance degradation. This paper proposes direct interface approaches without FMU wrapper, defining optimized interfaces for data exchange and time synchronization. Experiments demonstrate reduced latency and increased throughput compared to conventional FMU-based approaches.","stream":"◯"},{"id":"074","title":"Development of a Parallel Level 4 Virtual Electronic Controller Unit Verification Platform Based on Cloud Infrastructure","author":"Daeki Kim ･YoungMo Lee (Hyundai Autoever)･HanSeung Myoung (Hyundai Motor)･Sunghoon Woo (Hyundai Autoever)","aff":["Hyundai Autoever","Hyundai Motor"],"abstract":"Conventional on-premises Level 4 virtual ECU verification has bottlenecks due to limited computing resources. This research proposes a parallel verification platform using cloud infrastructure. The platform executes multiple virtual ECU instances simultaneously in a distributed computing environment and processes verification in parallel according to software requirements. This reduces verification execution time and enables collaborative verification across multiple countries and departments. The results are expected to improve verification efficiency in automotive software development and shorten the development, verification, and deployment cycle.","stream":"◯"},{"id":"075","title":"Intelligent Fault Injection Scenario Generation Using Level 4 Virtual Electronic Controller Unit and Verification Efficiency Enhancement -Systematic Fault Injection and Coverage Evaluation on a Level 4 AUTOSAR Virtual ECU-","author":"YoungMo Lee ･Daeki Kim･SungHoon Woo (Hyundai Autoever)","aff":["Hyundai Autoever"],"abstract":"Manual fault injection scenario in Level 4 virtual ECU verification causes omission, redundancy, and inefficient resource allocation. This research proposes a methodology to automatically generate fault injection scenarios from functional safety requirements using AI. The methodology analyzes ISO 26262 requirements through machine learning and generates scenarios to enhance verification coverage. A priority determination algorithm eliminates redundancy and optimizes verification sequence, reducing verification time while expanding coverage. The results are expected to automate functional safety-oriented Basic Software verification, improve development processes, and reduce human errors.","stream":"◯"},{"id":"076","title":"Development of a TC39x TriCore Instruction Set Simulator for AUTOSAR OS Conformance ELF Verification using AI-Assisted Methodology","author":"Sunghoon Woo ･Daeki Kim･Youngmo Lee･Kyungnam Kim･Jaekyung Kim (Hyundai Autoever)","aff":["Hyundai Autoever"],"abstract":"This paper investigates whether AUTOSAR OS test ELFs can be executed on a SystemC ISS for the Infineon TC39x using AI-Assisted Methodology. The ISS implements six TriCore v1.6.2P cores with CSA chain, trap/interrupt handling, and 30 peripheral stubs (STM, MPU, MULTICAN, CAN-XL, GETH, FlexRay, ASCLIN etc). Completeness was improved via AI-driven datasheet analysis, MCAL sample code-based hardware modeling, and AI-assisted AUTOSAR OS boot register implementation. Key challenges -CSA linked-list reconstruction and 2-/6-core boot synchronization- were resolved under human knowhow.","stream":"◯"}]},{"id":108,"title":"xEVバッテリーマネジメント","day":14,"room":"中ホールB","start":"9:30","end":"11:10","chair":"座長：牟田　浩一郎（トヨタ自動車）","talks":[{"id":"077","title":"シリーズハイブリッド自動車における勾配予見を用いた予測型バッテリー充電制御システムの構築","author":"阿部　雄飛 ・清水　隆寛・中上　飛河・新川　真生・草鹿　仁（早稲田大学）","aff":["早稲田大学"],"abstract":"本研究では，道路勾配情報を用いた予測型バッテリー充電制御システムをシリーズHEVに対して構築した．登坂時にバッテリーを積極的に使用し，降坂時の回生エネルギー回収を最大化する制御を提案した．実車データに基づく同定シミュレーションモデルにより評価した結果，回生エネルギーの増加および燃費の向上が確認された．","stream":"◯"},{"id":"078","title":"Efficient Kalman Filter-Based Battery Pack SOC Estimation Using Bar Delta Filtering","author":"Seyedmehdi Hosseininasab･Changwei Lin･ Lennart Bauer (FEV Europe)･Tsuyoshi Horiba･Yasutaka Ikawa (FEV Japan)","aff":["FEV Europe","FEV Japan"],"abstract":"Accurate estimation of SOC in lithium-ion battery packs is essential for safe reliable and optimized BMS in electric vehicles and energy storage. This study presents an efficient framework combining a lightweight Kalman filter with the Bar-Delta method for series-connected LFP cells. A simulation model with realistic cell-to-cell variations evaluates performance. The method estimates pack average SOC and cell deviations with lower computational cost. Results show comparable accuracy to full Kalman filtering while significantly reducing computation, enabling real-time embedded applications. It is suitable for resource-constrained hardware and scalable pack monitoring deployments today.","stream":"◯"},{"id":"079","title":"Comparison of IR, EKF, and NARX Estimators for Battery SOC and Voltage Prediction Across EV Pack Sizes","author":"Alessandro Massimo Bertucci ･Xinwei Li･Ratnak Sok (Waseda University)･Keiki Tanabe･Goro Iijima (Mitsubishi Fuso Truck and Bus)･Jin Kusaka (Waseda University)","aff":["Waseda University","Mitsubishi Fuso Truck and Bus"],"abstract":"This study compares Internal Resistance (IR), Extended Kalman Filter (EKF), and Nonlinear Autoregressive with Exogenous Inputs (NARX) estimators for battery state-of-charge and terminal-voltage prediction across S, M, and L electric-vehicle battery pack configurations. On regular-temperature JE05 measured logger data, IR and EKF achieved similar SOC accuracy but poor voltage reproduction, especially for the L configuration. NARX achieved higher joint SOC and voltage accuracy on the same data. Cold-chamber NARX results were separated by driving cycle, showing strong performance for 50 km/h and 80 km/h cases, while JE05 at -25 degC remained the most difficult voltage condition.","stream":"◯"},{"id":"080","title":"ビッグデータと生成AIを活用した市場環境における電池負荷予測技術","author":"波頭　佑哉 （マツダ）","aff":["マツダ"],"abstract":"電動車両のLiBでは，実際のユーザーの車両の使い方において，劣化や熱暴走に対する信頼性の確保が求められる．そこで市場のビッグデータと生成AIを活用し，ユーザーの使い方の特徴を再現した走行シナリオを生成する．そして，生成したシナリオと1Dモデルを用いて，市場で想定される電池の負荷強度を評価する手法を構築した．","stream":"◯"}]},{"id":109,"title":"xEVバッテリー技術","day":14,"room":"中ホールB","start":"12:10","end":"14:15","chair":"座長：大塩　伸太郎（日産自動車）","talks":[{"id":"081","title":"LFPセル電気化学モデルの高精度化に向けた計測ベースのモデル構築","author":"長谷川　貴俊 ・宮﨑　亮太朗・高橋　壱尚・荒木　謙吾・江嶋　睦仁（IDAJ）・辻　洋悦・森脇　博文（東レリサーチセンター）","aff":["IDAJ","東レリサーチセンター"],"abstract":"電池を用いた製品開発では電気化学モデルの活用が進む一方，必要パラメータの取得法が十分に整理されず，電気化学パラメータが調整項として扱われる課題がある．本取り組みでは計測に基づいた詳細な電気化学モデルの構築を行い，その価値と必要性を示す．","stream":"◯"},{"id":"082","title":"等価衝突性能条件でのアルミニウム合金製および鋼製BEV用電池パックの環境負荷評価","author":"竹中　峻 ・仲村　宗起・鎮西　将太（神戸製鋼所）・吉野　初美（コベルコビジネスパートナーズ）・濱田　和幸・渡辺　憲一・吉田　正敏（神戸製鋼所）","aff":["神戸製鋼所","コベルコビジネスパートナーズ"],"abstract":"環境負荷低減への期待の高まりを背景に，電池パックには衝突安全性の確保と環境負荷低減の両立が求められている．本研究では，アルミニウム合金および鋼構造の電池パックを対象に，同一車体条件下で等価な衝突性能を満たすよう設計を行い，重量およびライフサイクルにおける環境負荷を評価した．","stream":"✕"},{"id":"083","title":"アノードフリー全固体電池のサイクル耐久性向上に向けた取り組み -（第2報）-","author":"中川　嵩 ・和泉　享兵・氏家　俊太郎・楠下　颯・長嶺　健太（本田技術研究所）","aff":["本田技術研究所"],"abstract":"アノードフリー全固体電池の劣化解析，および，負極集電箔の仕様改良による充放電サイクル耐久性の向上について，報告する．","stream":"◯"},{"id":"084","title":"レーザ照射法を用いたリチウム析出セルにおける熱暴走および熱連鎖挙動の評価","author":"小鹿　健一郎 （自動車技術総合機構）・釣賀　英樹（電気安全環境研究所）・森田　朋和（東芝）・本多　啓三（電気安全環境研究所）","aff":["自動車技術総合機構","電気安全環境研究所","東芝"],"abstract":"本研究では，レーザ照射法を用いてリチウム析出セルの熱暴走および熱連鎖挙動を評価した．単セル試験により熱暴走の発生特性を比較するとともに，隣接セルとの組合せによる熱連鎖試験を実施した．その結果，リチウム析出の存在は熱暴走の誘起を促進し，熱連鎖の発生を助長することを明らかにした．","stream":"✕"},{"id":"085","title":"リパーパスを模擬した組電池のサイクル劣化過程における非破壊診断を用いたSOH・セルバランス推定","author":"森田　朋和 （東芝）・小鹿　健一郎（自動車技術総合機構）・釣賀　英樹・本多　啓三（電気安全環境研究所）","aff":["東芝","自動車技術総合機構","電気安全環境研究所"],"abstract":"劣化履歴の異なるセルにより構成されたリパーパスを模擬した組電池を作製し，サイクル劣化試験を実施した．組電池および各セルのSOHとセルバランスを推定する非破壊診断として充電曲線解析およびセルOCV-SOCに基づく推定手法を用いて組電池の劣化状態推定し，組電池実測容量と比較して推定精度を評価した．","stream":"◯"}]},{"id":110,"title":"FC・水素利用","day":14,"room":"中ホールB","start":"14:45","end":"16:00","chair":"座長：今村　大地（日本自動車研究所）","talks":[{"id":"086","title":"FCシステムシミュレータによるFCセル用接着シートの市場耐久性予測","author":"市川　亮輔 ・竹井　隆朗・荻原　直貴・紺野　周重（トヨタ自動車）・小林　恭平・渡部　誉之（東洋紡）","aff":["トヨタ自動車","東洋紡"],"abstract":"燃料電池（FC）技術の多用途展開を目指す上で，耐久要求のシビア化に対する最適設計が求められる．FCセルのシールおよび絶縁機能を担う接着シートの加水分解を例に，走行中のFCセル内発電分布を非定常計算できるFCシステムシミュレータにストレスとストレングスの概念を統合することで，耐久予測技術を構築する．","stream":"✕"},{"id":"087","title":"ECMS-based Energy Management Strategy for a Hydrogen Fuel Cell Hybrid Yard Tractor","author":"Juhan Lee ･Beomho Lee･Taeho Park･Dohyun Park･Janghyeok Won･Deokjin Kim (Korea Automotive Technology Institute)","aff":["Korea Automotive Technology Institute"],"abstract":"Hydrogen fuel cell (FC) hybrid powertrains are a zero-emission option for port yard tractors (YTs), whose high peak power, low average power, and frequent start-stop operation challenge battery-electric solutions. A software-in-the-loop (SILS) model of an FC hybrid YT-80 kW FC stack, 90.7 kWh battery, 310 kW motor-is built in MATLAB/Simulink with IPG TruckMaker. A representative duty cycle from 191 in-service trips shows 22 kW average and 232 kW peak power. The baseline rule-based supervisor yields bimodal FC operation, motivating a proposed ECMS with a PI-based adaptive equivalence factor to shift FC operation into its high-efficiency region while sustaining charge.","stream":"✕"},{"id":"088","title":"ポーラスリブGDL/MPLを組み込んだ水冷FCスタックの製作と性能評価","author":"布川　拓未 ・宮田　愛子・恩田　拓実（SUBARU）・那須　三紀（エノモト）・内田　誠・渡辺　政廣（山梨大学）・吉村　尚秀（SUBARU）","aff":["SUBARU","エノモト","山梨大学"],"abstract":"燃料電池セパレータの加工コスト低減とセルの体積出力密度向上を狙い，ポーラスリブGDL/MPLを用いた本格的な水冷燃料電池セルを作製．さらに複数枚を重ねてショートスタック化した．これに対する発電試験結果と効果について報告する．","stream":"◯"}]},{"id":111,"title":"振動・騒音・乗り心地I","day":14,"room":"特別会議場","start":"9:30","end":"11:35","chair":"座長：松岡　久祥（日産自動車）","talks":[{"id":"089","title":"分系のモードエネルギー寄与度解析を利用した大減衰系の連成の解明","author":"平岩　大知 （岐阜大学大学院）・松村　雄一（岐阜大学）・橋岡　正人・駒田　匡史（トヨタ自動車）","aff":["岐阜大学大学院","岐阜大学","トヨタ自動車"],"abstract":"高減衰系の任意の周波数における定常応答に対する各分系のモード寄与をエネルギー量として定量的に分析する手法を開発した．本分析法を，ロードノイズの発生要因となる振動を簡易的に再現可能な有限要素モデルに適用し，その有用性を検証した結果を報告する．","stream":"◯"},{"id":"090","title":"Full-Field Measurement of Transient Tire Vibrations Using Digital Image Correlation and Dynamic Mode Decomposition","author":"Hailemichael Solomon Addisu ･Yuki Kato (Kochi University of Technology)","aff":["Kochi University of Technology"],"abstract":"Accurate measurement of transient tire vibrations is essential for vibration design and noise evaluation. However, conventional contact sensors are difficult to use on operating tires and offer limited spatial resolution. Image-based methods, such as digital image correlation (DIC), enable full-field structural measurements, but suffer from high-frequency noise and limited subpixel accuracy. To overcome these issues, this study integrates DIC with dynamic mode decomposition. The proposed framework was validated by 2D-DIC on an aluminum cantilever beam and then applied to 3D-DIC measurement of tire tread blocks.","stream":"✕"},{"id":"091","title":"自動車用ディスクブレーキにおけるHot Judderの発生メカニズムに関する実験的研究","author":"佐田　賢也 ・中江　貴志・劉　孝宏・北村　純一（大分大学）・鈴木　剛・池田　英明・堀井　孝紘・野口　哲弥（曙ブレーキ工業）","aff":["大分大学","曙ブレーキ工業"],"abstract":"自動車用ディスクブレーキにおいて，高速制動時にHot Spotと呼ばれる熱の縞模様が発生し，これに起因してHot Judderと呼ばれる振動が車両に生じる．著者らは，本現象の発生メカニズム解明を目的としてダイナモ試験機による実験的検証を行い縞模様は発生と減衰を繰り返し，時間経過とともに数が増加することを明らかにした．","stream":"◯"},{"id":"092","title":"等速ジョイント起因による走行時車両振動の予測方法の構築","author":"平田　淳一 ・鈴木　大輝・藤原　秀人（NTN）","aff":["NTN"],"abstract":"等速ジョイントに起因する走行時車両横揺れを対象に，6自由度仮想点を用いたコンポーネントベースTPAを適用し振動伝達経路の寄与を調査した．調査結果をもとに車両評価点における横揺れ加速度の簡易予測式を構築した．機構解析で求めた等速ジョイントの誘起スラスト力を用いて予測値を計算し，実測値と比較した．","stream":"◯"},{"id":"093","title":"リアルタイム音予測システム開発とステアリングギヤボックス異音評価への適用","author":"原　啓志 ・深澤　浩希・武藤　秀和・姫野　信幸（エステック）・中村　光孝・石尾　隼（本田技術研究所）","aff":["エステック","本田技術研究所"],"abstract":"ステアリング異音開発で評価のフロントローディングを実現するため，入力の微細な違いによって生じる音の変化を把握可能な台上評価環境が求められている．そこで，伝達経路解析技術を用いてリアルタイムに完成車の音を予測して，試聴可能なシステムを構築し，ステアリング異音開発に適用した．","stream":"◯"}]},{"id":112,"title":"振動・騒音・乗り心地II","day":14,"room":"特別会議場","start":"12:35","end":"15:15","chair":"座長：杉山　康二（スズキ）","talks":[{"id":"094","title":"交通環境が搭乗者にもたらす心理的負担要因の探索と評価 -自然言語処理を用いたデータ駆動型アプローチ-","author":"淺井　二千夏 （セールスフォース・ジャパン）・岩井　律子（理化学研究所）・熊田　孝恒（京都大学）","aff":["セールスフォース・ジャパン","理化学研究所","京都大学"],"abstract":"近年自動運転技術の発展は著しい一方，搭乗者の主観的快適性については十分ではない．そこで本研究では，搭乗者に心理的負担を喚起する交通環境の探索的整理を行った後，自然言語処理及び大規模言語モデルを用いた質問紙自動生成の提案，構築された心理的負担尺度と搭乗者のパーソナリティ特性との関連性の検討を行った．","stream":"◯"},{"id":"095","title":"自動運転車における視覚情報の提示条件が乗員の乗り心地評価に与える影響","author":"佐津　佑弥 （近畿大学大学院）・樹野　淳也（近畿大学）・石松　一真（滋慶医療科学大学大学院）・前田　節雄（ノッティンガム・トレント大学）","aff":["近畿大学大学院","近畿大学","滋慶医療科学大学大学院","ノッティンガム・トレント大学"],"abstract":"自動運転車を模擬したドライビングシミュレータ実験を用いて，フロントウインドウ及びサイドウインドウに風景とは異なる情報を提示した際の乗り心地評価への影響を調査する実験を行った．その結果，同一の振動条件下であっても，前景からの視覚刺激の違いによって，乗り心地評価が変化する可能性が示唆された．","stream":"◯"},{"id":"096","title":"電気自動車室内音質の客観評価法（第2報） -電気自動車室内の音質評価法-","author":"藤井　謙弥 ・鳥居　建史（本田技術研究所）","aff":["本田技術研究所"],"abstract":"筆者らは電気自動車の室内音質を定量化するための検討を進めている．前報では，車室内の電動パワートレインノイズを対象とした音質評価指標を開発した．これを踏まえ，対象を車室内音全体へ拡張した新たな主観評価実験を実施した．本報では，その結果を示すとともに車室内音質を総合的に向上するために重要な音質要素を明確化する．","stream":"◯"},{"id":"097","title":"電気自動車室内音質の客観評価法（第3報） -振動騒音エキスパートによる電気自動車音質指標の汎化性検証-","author":"鳥居　建史 ・藤井　謙弥（本田技術研究所）","aff":["本田技術研究所"],"abstract":"筆者らは，これまでに電気自動車室内の音質向上には，ラウドネスおよび電動パワートレインに起因するトーナルノイズの低減が重要なことを示し，各々に対応した客観評価指標を開発した．本報では，これらの妥当性をエキスパートによる主観評価実験により検証するとともに，車両ごとの音質差異を可視化する音質マップを提案する．","stream":"◯"},{"id":"098","title":"走行状態の時間履歴を考慮した運転負荷に基づくエンジン音評価の認知構造分析","author":"菅沼　真一 （中央大学大学院）・長江　新平（日産自動車）・戸井　武司（中央大学）","aff":["中央大学大学院","日産自動車","中央大学"],"abstract":"公道走行データを用いた車両情報を説明変数とするエンジン音評価推定モデルにおいて，前報で走行状態の時間履歴の影響を把握した．今回ドライビングシミュレータを用い，走行環境および運転条件を変えて評価することで運転負荷を変化させ，時間履歴の影響変化を検討し，エンジン音認知構造を分析した．","stream":"◯"},{"id":"099","title":"NV官能評価の定量化システム開発による車両ドライバビリティ向上への貢献","author":"木本　博行 ・力武　俊介・矢野　正雄・山北　悠太・信原　邦啓・吉村　仁（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"車両の操安／静粛性，質感向上にNV解析とその評価は重要であるが，人によらない識別／判断をすることは困難であった．我々は内製データ解析統合システム「WAVEBASE」を開発適用し，ドラビリ／操作質感向上への除電効果を明確にした．","stream":"◯"}]},{"id":113,"title":"振動・騒音・乗り心地III","day":14,"room":"特別会議場","start":"15:45","end":"17:50","chair":"座長：森田　英憲（トヨタ自動車）","talks":[{"id":"100","title":"第3世代100%電動駆動ハイブリッドパワートレインを搭載した新型コンパクトSUVの静粛性開発","author":"関根　立弓 ・松永　亮・宮川　隆行・金山　雅洋・森　行広（日産自動車）","aff":["日産自動車"],"abstract":"すでに市場に投入されている第一世代，第二世代e-POWERはEVの様な静粛性が受け入れられ，好評を得ている．発電特化型エンジン（HR14DDeエンジン）と5-in-1システムを組み合わせることにより，高効率かつ低騒音性能を両立させた第三世代のe-POWERユニットを開発した．今回，静粛性の観点から，e-POWERの進化と第三世代e-POWERを搭載した新型コンパクトSUVの静粛性開発について報告する．","stream":"✕"},{"id":"101","title":"100％電動駆動ハイブリッドを搭載した新型ミニバンの車内騒音低減技術","author":"生井　裕樹 ・岡田　和久・小穴　祐太・桑田　敏久・森　行広（日産自動車）","aff":["日産自動車"],"abstract":"高効率と低騒音を両立させた第三世代e-POWERユニットを搭載した次期型ミニバンの静粛性向上技術を紹介する．高剛性プラットフォームと高性能な防音材の採用により，クラストップの静粛性を実現した．","stream":"◯"},{"id":"102","title":"最新世代ハイブリッドシステムおよび新型ミニバンに向けた次世代アクティブ・ノイズ・コントロール技術","author":"會見　春奈 ・生越　渉・越智　大輔・岡田　和久・森　行広・榎本　敏夫（日産自動車）","aff":["日産自動車"],"abstract":"従来日産で採用しているアクティブ・ノイズ・コントロール（ANC）はエンジン爆発次数のこもり音を低減する，単一周波数に対応したシステムであったが，新型ミニバンではエンジン発電時騒音とロードノイズの両方に対応したブロードバンドANCを世界初採用している．本講演では，高性能なANCを実現するための考え方などについて発表する．","stream":"◯"},{"id":"103","title":"Test Method for Unification and Luxury of Operating Interior Electric Curtain Noise","author":"Sangkyun Ahn (Hyundai Motor)","aff":["Hyundai Motor"],"abstract":"Recently, the electrification of indoor parts has been rapidly progressing. In order to develop a sense of unity, luxury, and differentiation by utilizing statistical techniques, we intend to present new development criteria by matching noise measurement factors with emotional variables. Through this evaluation method, we intend to provide differentiated interior sound sensibility to our customers. This study was conducted in The order of developing emotional quantification factors and securing noise measurement and emotional data in Section 2.1, verifying significance factors through statistical analysis in Section 2.2, and establishing guidelines for differentiation, luxury, and uniformity in Section 2.3. Finally, the actual project verification was conducted through the Genesis large flagship SUV in Section 2.4","stream":"◯"},{"id":"104","title":"A Study on Vibration Devices for Vehicle Interior Applications","author":"SeokHwan JI (KOMOS)","aff":["KOMOS"],"abstract":"The automotive industry is developing technologies to improve driver convenience and safety through autonomous driving and in-vehicle interface systems. Interest in haptic systems using vibration motors has increased. This study investigates the structural and performance characteristics of vibration motors for vehicle interior applications. The motors must ensure stable vibration transmission, low noise, structural reliability, and proper thermal characteristics within limited spaces. Therefore, stiffness, noise, heat generation, strength, and sensitivity characteristics were analyzed and evaluated to verify the performance of vehicle interior vibration motors.","stream":"◯"}]},{"id":114,"title":"車両開発I","day":14,"room":"201+202","start":"9:30","end":"12:10","chair":"座長：今長　久（日本自動車研究所）","talks":[{"id":"105","title":"クロスドメインモデルを用いた大域的な設計最適化を実現するMBD手法の開発 --第2報: モジュールを考慮した寄与度把握と妥協計画法を用いた仕様判断 --","author":"内海　碧人 ・高橋　成光・小嶋　麻由佳・清野　昌之（日産自動車）","aff":["日産自動車"],"abstract":"本発表では第1報（FY26春季自技会）にて報告した「クロスドメインモデルCAEM（Collective Automotive Engineering Model: 燃費性能，操安性能など，大きく物理ドメインが異なる複数の性能領域が統合したモデル）」から得られる結果を用いた複数性能間のトレードオフを考慮する車両全体設計における多変量最適化の適用事例について報告する．車両全体設計において設計変数やモジュールの選定の最適化が可能であることを確認した．","stream":"◯"},{"id":"106","title":"クロスドメインモデルを用いた大域的な設計最適化を実現するMBD手法の開発 -第 3 報 統合平文と暗黙知の段階的な文面化による LLM エージェントの構築手法-","author":"高橋　成光 ・内海　碧人・清野　昌之（日産自動車）","aff":["日産自動車"],"abstract":"クロスドメインモデルCAEMの運用は熟練者の暗黙知に依存する．本報は，知識・手順・ツールを統合した単一のプレーンテキスト（統合平文，FUMI）を人とLLMがともに読み書きし，暗黙知を段階的に文面化しながらエージェントを構築する手法を提案する．暗黙知は事前に書き切らず，誤りを指摘するたびにFUMIへ書き起こす．構築と継承が同時に進み，書き切る前から業務に使えることをCAEM運用で確認した．","stream":"◯"},{"id":"107","title":"性能感度に基づいて潜在空間拡張する自己成長AIの開発とブラケット設計への適用","author":"河村　樹人 ・寺部　俊樹・神庭　千佳・大河　誠・佐野　拓生（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"ブラケット設計ではNV，熱応力等の複数性能を同時に満たしつつ，設計期間を短縮する必要がある．しかし従来のCAEを用いた設計手法は試行回数に依存するため設計期間短縮は難しい．本研究ではサロゲート，形状生成AIをCAEと組み合わせ，エキマニ用ブラケット設計の探索を高速化し，その効果と運用課題を報告する．","stream":"✕"},{"id":"108","title":"製造制約を考慮した骨格断面生成による設計空間探索手法の開発","author":"石外　哲也 ・新谷　浩平・谷口　真潮・山中　翔・森田　隼太（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"近年，開発期間短縮に向け，形状最適化や機械学習の活用が検討されている．しかし，車体骨格部品を製造可能な範囲で生成し，有効な設計候補を複数提示するプロセスは未確立である．本稿は平坦部と曲率部で構成される実際の部品形状を生成する手法を開発し，効率的に設計案を提示するプロセスを提案する．","stream":"◯"},{"id":"109","title":"少数サンプル学習サロゲートモデルによるEVバッテリープレートの材料・形状同時最適化","author":"齋藤　博之 ・道下　孝之・河尻　耕太郎（エイゾス）","aff":["エイゾス"],"abstract":"放熱性能を担うEVバッテリープレートの設計では，熱および強度特性を同時に満たす必要がある．本検討では，少数サンプル学習で構築した高精度な熱・構造物理場予測サロゲートモデルを活用し，リアルタイム予測および材料・形状同時最適化を可能にする手法を示す．","stream":"◯"},{"id":"110","title":"Target Cascading of Tire Performances using Machine Learning","author":"Yeonsang Yoo (Hyundai Motor)･Benjamin Schaefer (RWTH Aachen University)･Yongdae Kim･JinSil Kyeong (Hyundai Motor)","aff":["Hyundai Motor","RWTH Aachen University"],"abstract":"The automotive industry is shifting towards Model-Based Systems Engineering (MBSE) to manage increasing complexity in development. However, virtual tire development has a significant limitation: setting tire performance targets in early stage is difficult without physical testing. To overcome this situation, this study proposes a Target Cascading (T/C) process to derive tire performance targets directly from vehicle performance requirements and validated the process. Previously developed performance prediction models were improved for refined T/C process. Additionally, a GUI was developed to integrate the prediction models and T/C process for user convenience.","stream":"✕"}]},{"id":115,"title":"車両開発II","day":14,"room":"201+202","start":"13:10","end":"15:50","chair":"座長：宮鹿野　智（トヨタ自動車）","talks":[{"id":"111","title":"データ同化によるスポット溶接破断予測モデルの特性推定","author":"伊藤　里沙子 ・石橋　慶輝・佐藤　太一・登坂　泰浩（日産自動車）","aff":["日産自動車"],"abstract":"CAEによるスポット溶接の破断予測は，従来は溶接部に作用する荷重を評価指標としてきたが，破断起点となる熱影響部の複合入力による応力状態を再現するより詳細な溶接部モデルが提案されている．しかし，試験による熱影響部の特性取得は容易ではないため，本報ではデータ同化により材料・破断特性推定を試みた．","stream":"◯"},{"id":"112","title":"簡易鋳造解析による衝突解析でのアルミダイキャスト部品挙動再現性向上の検討","author":"深川　健一朗 （本田技術研究所）","aff":["本田技術研究所"],"abstract":"近年車体への適用検討が拡大しているアルミダイカストは物性分布があり，衝突解析再現性向上にはその反映が重要となる．分布予測手法は鋳造解析等があるが，開発初期での実施難度が高い．本研究では開発初期でも実施可能な，簡易鋳造解析による物性分布予測と衝突解析への反映手法の検討を行った．","stream":"◯"},{"id":"113","title":"Trimmed Solidを用いたIsogeometric解析による破断解析に関する研究","author":"西　紳之介 ・内藤　正志（本田技術研究所）・清水　則雄（JSOL）","aff":["本田技術研究所","JSOL"],"abstract":"Trimmed Solidを用いたIGAは，複雑形状でもモデリングが容易であり，高次基底関数を用いた高精度な解析が可能なため，アルミダイカスト部品をはじめとする厚肉部品への適用が望まれる．本稿では，LAS要素を取り入れたTrimmed Solidを用いてアルミ部品の破断解析へ適用し，実機比較を通してFEMソリッド要素からの有用性について議論する．","stream":"◯"},{"id":"114","title":"線形座屈解析を用いた衝突部品の最適形状導出","author":"揚場　遼 ・樋貝　和彦・新宮　豊久（JFEスチール）","aff":["JFEスチール"],"abstract":"電動化により高まる衝突部品への性能要求と自動車開発期間の短縮に対応するため，部品の形状最適化技術が有用である．一方，衝突解析は計算コストが高い非線形解析であり形状最適化とは相性が悪い．本研究では，線形解析により求められる座屈耐力を目的関数とすることで，衝突部品に対応する最適化手法を開発した．","stream":"◯"},{"id":"115","title":"A study on securing Torsional Stiffness in the Early Design Stage to Enhance Chassis Frame Durability","author":"Namjin Kim ･Gunwoo Nam･Geonhee Cheon･Eunsu Jang･Soosang Yoo･Hyun Sung･Jungsub Kim (Seojin Industrial)","aff":["Seojin Industrial"],"abstract":"Torsional loads during driving significantly impact the fatigue life and durability of a chassis frame. This study analyzes the correlation between torsional stiffness and durability performance. Initially, 1D element based analysis identified main design parameters regarding cross sections and thickness. These parameters were validated using a 2D flexible body finite element model for precise stiffness verification. Finally, durability analysis confirmed that increased stiffness effectively reducing stress and extends fatigue life. These results indicate that securing structural stiffness during the early design stage is critical for enhancing overall durability.","stream":"◯"},{"id":"116","title":"A Study of the Durability analysis method considering various contact conditions","author":"JinHee Jang (Hyundai Motor)･DongJun Kim (Cadence)･MoonHo Yang (Hyundai Motor)","aff":["Hyundai Motor","Cadence"],"abstract":"The durability performance directly related to safety is an item that must be satisfied. Because endurance testing requires a lot of cost and time, it is very efficient to evaluate simulation before testing. In this study, we examined the application of Nastran's recently developed Glue contact technology to the durability analysis of chassis components. And we developed a method to apply residual stress such as bolt pre-tension and pipe interference fit. Since the method implemented in this study can be used to study various boundary conditions in durability analysis.","stream":"✕"}]},{"id":116,"title":"車両開発III","day":14,"room":"201+202","start":"16:20","end":"18:00","chair":"座長：櫻井　俊彰（東京都市大学）","talks":[{"id":"117","title":"インパネ触感の摩擦計測，および指表面可視化による高触感要件の特定","author":"山岸　和輝 ・西城戸　蘭・髙橋　巧朋（マツダ）","aff":["マツダ"],"abstract":"内装材などタッチポイントの触感は個人差が大きく，設計要件は熟練者の経験則に依存し定量化が困難である．本研究では被験者数十名に対し，触動作中の摩擦計測を行い，一部の指表面では可視化を行った．これらの結果から，摩擦現象解明と統計的評価により，感覚を物理量に紐づけを行ったので，この内容を報告する．","stream":"✕"},{"id":"118","title":"Pre-verification of the development of the deco bezel specification steering wheel through analysis","author":"Dongmin Kim (KOMOS)","aff":["KOMOS"],"abstract":"When manufacturing automotive steering wheels, a high defect rate occurs during the manual leather stitching process. Therefore, we developed a steering wheel with a deco bezel specification that eliminates this manual leather stitching process to reduce the defect rate and allows for the application of a high-end design to the front of the steering wheel. Accordingly, this study pre-verifies the issues encountered during the development of the deco bezel specification steering wheel through analysis.","stream":"◯"},{"id":"119","title":"A Study on Partition Layouts for Configuring Independent Spaces in Vehicles","author":"Jiseob Park (Hyundai Motor)･ Jaemoon Jung (SeoYon E-Hwa)","aff":["Hyundai Motor","SeoYon E-Hwa"],"abstract":"This study proposes a partition layout for creating independent spaces in autonomous vehicles. Based on aircraft full-cover partitions, the design was redefined to suit limited vehicle interiors. A console-type partition was developed and evaluated through usability testing. The optimized design integrates a variable armrest, cup holder, smartphone mount, and PDLC film. The results verify its feasibility for improving privacy, convenience, and spatial independence in autonomous vehicle interiors.","stream":"◯"},{"id":"120","title":"The Development of Active Air Skirt for reducing Drag Force","author":"Jinyoung Yoon ･Soobok Kim･Nakkyoung Kong･Hongheui Lee･Dongha Kim･Haklim Kim (Hyundai Motor)･Jaesup Byun･Jangho Kim (hyundai Mobis)","aff":["Hyundai Motor","hyundai Mobis"],"abstract":"There are various active air flaps, active rear spoilers, and active deflectors, which are various active aerodynamic devices to improve the aerodynamic performance of electric vehicle. This technology is an active air skirt that improves the air resistance of the front wheel tire by controlling the air flow in the front lower part and improves the air flow to the rear, and is deployed/stored according to the vehicle speed. As a result of conducting a wind tunnel test by applying it to a real vehicle, the effective CD (coefficient of Drag) value was confirmed, and mass production feasibility was confirmed through robust design of the actuator and operating mechanism.","stream":"✕"}]},{"id":117,"title":"エレクトロニクスI -センサ-","day":14,"room":"204","start":"9:30","end":"10:45","chair":"座長：久保田　直行（東京都立大学）","talks":[{"id":"121","title":"塗膜のミリ波透過性能に対する予測モデルの構築と影響因子の解明","author":"小湊　裕允 ・山川　啓介・落合　洸矢・奥木　友和・松井　寛杜・桂　大詞（マツダ）・山本　崇史（工学院大学）・平野　拓一（東京都市大学）","aff":["マツダ","工学院大学","東京都市大学"],"abstract":"意匠性とミリ波透過性能を高次元で両立可能な高機能バンパー部材の技術開発を進めている．ミリ波透過を阻害する塗膜内部の金属製光輝材の配合要件を効率的に導出するため，本研究では，透過性能を実用的精度で予測可能な数値解析モデルを構築し，光輝材が透過性に及ぼす影響因子を明確化した．","stream":"◯"},{"id":"122","title":"ステレオカメラにおける画像拡大率を利用した基線方向の三次元測定","author":"城戸　英彰 （日立製作所）・入江　耕太（Astemo）","aff":["日立製作所","Astemo"],"abstract":"魚眼ステレオカメラシステム向けに，基準方向における3次元距離測定手法を提案する．本手法では平面面仮定の下で画像拡大率を用いて距離を推定する．数値シミュレーションおよびCGを用いた実験により，入射角が90度に近い場合，従来の視差ベースの測定と比較して精度の向上が得られることが示された．","stream":"◯"},{"id":"123","title":"Research on Lamp System for Vision Sensor","author":"Byoungsuk Ahn ･Hyungsun Kim (Hyundai Motor)･Jungsub Lim･Hyunchang Hwang (Hyundai Mobis)","aff":["Hyundai Motor","Hyundai Mobis"],"abstract":"This study investigates the effect of high-definition micro-LED (HD) beam control on camera-based lane detection under nighttime driving conditions. Conventional low and high beam was compared with an HD adaptive lighting system across various road environments. Conventional lighting reduced lane recognition accuracy, particularly on curved roads and near reflective structures that induced glare. In contrast, the HD module enhanced lane visibility through precise light distribution control and maintained more stable recognition performance. These findings suggest that HD adaptive lighting may improve vision-based ADAS perception and enhance nighttime driving safety.","stream":"✕"}]},{"id":118,"title":"エレクトロニクスII -ECU-","day":14,"room":"204","start":"11:45","end":"13:25","chair":"座長：荒川　俊也（東京電機大学）","talks":[{"id":"124","title":"BGAはんだ接合の信頼性設計への検討と対策","author":"西森　久雄 ・武藤　潤・柴田　靖文（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"電子部品の高機能化では外観検査できないBGAはんだ接合を同一基板上に多数実装する設計となり，故障モードを理解した製品設計と製造工程で品質を作りこむ必要がある．BGAはんだ接合状態を非破壊と破壊解析により把握し，製造品質を含む信頼性の高い設計に向け，国際規格も活用した検討内容について紹介する．","stream":"◯"},{"id":"125","title":"プリント配線板製造品質向上に向けたAIと統計学的手法を用いた製造管理アプローチ","author":"成田　隼翼 ・堀川　敦・上野　智之（日産自動車）","aff":["日産自動車"],"abstract":"自動車の電子化が進み，プリント配線板には更なる高度化が求められ，その実現には高い製造品質が望まれる．そこで，製造管理を閾値管理から分布管理に変更する事で，品質と効率を両立する手法を検討した．本研究ではAI，MLの高い演算能力を用いてベイズ推定を適用し，早期の推定分布作成と外れ値判定のプロセスを提案する．","stream":"◯"},{"id":"126","title":"高速通信用コネクタのSnめっきから生じるウィスカの発生メカニズムと対策の提案 第2報","author":"武藤　潤 ・西森　久雄・役田　仁・折中　ミイユ・柴田　靖文・山田　孝司・初岡　涼平（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"近年，車載電子部品においても通信の高速伝送化によって様々なシールド筐体を有するコネクタが使われている．そのなかで亜鉛ダイカスト製シールド筐体上のSnめっきから熱応力ストレスによってウィスカが発生することが知られている．本報告ではこれらについて実験を行いその結果から予測されるウィスカを抑制するめっきの仕様について報告する．","stream":"◯"},{"id":"127","title":"高温環境下の車載ECUにおける異常加熱現象の簡易評価方法開発","author":"森　鴻輝 ・堀川　敦・岸　文人（日産自動車）","aff":["日産自動車"],"abstract":"電子部品には偶発故障があり，故障後に電流が継続的に通電されると異常加熱を起こす．車載ECUは他用途ECUに比べて，高温環境下のより厳しい条件で使用されるため，異常加熱の要因検証，対策設計の効果確認が必要である．本研究では，導入コストの高い恒温槽を使わない高温環境の簡易評価構築手法を提案する．","stream":"◯"}]},{"id":119,"title":"エレクトロニクスIII -評価技術-","day":14,"room":"204","start":"13:55","end":"16:35","chair":"座長：戸田　雄一郎（岡山大学）","talks":[{"id":"128","title":"自動運転用センサー評価に向けた動的気象環境を再現する人工気象室の開発とその評価方法（第4報）","author":"吉田　樹 ・Hemant SUBHAS Ningaraddi・榎　浩之・嶋　寿泰（エスペック）・大石　威風・五十嵐　想（同志社大学大学院）・中川　正夫（同志社大学）","aff":["エスペック","同志社大学大学院","同志社大学"],"abstract":"自動運転技術の普及に向け，気象環境の影響を受けるカメラやLiDAR等の車載センサーの新たな認識性能評価方法が求められている．本研究では，人工気象試験装置を用いた霧の粒径並びに視程を制御した霧環境下において自動運転にも使用される複数種のセンサーの認識性能評価を行った．","stream":"◯"},{"id":"129","title":"自動運転に向けたSNN判断モデルの検討","author":"泉名　克郎 ・冨田　克樹・有馬　悠也・黄　爍（NTTデータオートモビリジェンス研究所）","aff":["NTTデータオートモビリジェンス研究所"],"abstract":"従来の人工ニューラルネットワーク（ANN）に対し，脳により近い構造を模したスパイキングニューラルネット（SNN）は低消費電力や低レイテンシの点で有利とされハードウェア要求の厳しい自動車向け機能での応用が期待される．強化学習による判断モデル構築の一環として，簡易な実験環境にてSNNの評価とその考察を報告する．","stream":"◯"},{"id":"130","title":"物理誘導型2段階異常検知フレームワークによる産業用コネクタ嵌合検査","author":"伊藤　龍翔 ・佐々木　茉子・市毛　弘一（横浜国立大学）・松尾　弘達・宇賀治　篤史・羽田　松太郎・阿部　浩二（日産自動車）","aff":["横浜国立大学","日産自動車"],"abstract":"コネクタ嵌合検査の不良流出ゼロを保証する物理誘導型2段階異常検知を提案する．第1段階はCWTスカログラムを用いたCAEとMSE-SSIMスコアで検知し，第2段階は独自物理量のフェイルセーフ層で見逃しを排除する．5種コネクタで誤検知ゼロ，未知異常条件下でも加重平均Recall 99.97%を達成した．","stream":"◯"},{"id":"131","title":"ESAイミュニティ試験方法間の相関性について（第2報） -回路インピーダンス及び注入位置による影響-","author":"伊藤　紳一郎 ・小林　敬史（自動車技術総合機構）・塚原　仁（日本品質保証機構）","aff":["自動車技術総合機構","日本品質保証機構"],"abstract":"ISO 11452で規定されているESAイミュニティ試験方法であるALSE法，BCI法及びRVC法間の相関性に関する測定を実施した．その結果，回路インピーダンスが異なる場合の影響については，これら3つの試験方法とも比較的小さいことがわかった．また，BCI法において注入位置が異なる場合の影響については，ヌル点周波数は注入位置によって変化する可能性があるものの，注入位置による誘起電圧の影響は比較的小さいことがわかった．","stream":"◯"},{"id":"132","title":"シャシダイナモ走行中におけるエミッション性能への影響検討","author":"青木　克将 （トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"市場電磁波環境の変化に伴いEMCの規制対応が厳格化されつつあり，EMC性能確保の重要性が高まっている．車両EMCのエミッション性能はCISPR36などで規定され，シャシダイナモ上での走行中の計測が求められている．本稿ではシャシダイナモ走行中に発生する静電気がエミッション性能に与える影響を検討した．","stream":"◯"},{"id":"133","title":"車両電源システム開発における統合MBD環境の構築と適用効果 -MILS/HILSによる車両電源システム成立性評価-","author":"木下　貴博 ・畑　佑樹（SUBARU）","aff":["SUBARU"],"abstract":"補機電源制御システムMILS技術開発の概要と成果について報告する．","stream":"◯"}]},{"id":120,"title":"ドライバ状態I","day":14,"room":"206","start":"9:30","end":"12:35","chair":"座長：栗谷川　幸代（日本大学）","talks":[{"id":"134","title":"自動運転Lv.2における不注意状態推定のための指標に関する検討","author":"中島　希 （慶應義塾大学大学院）・佐川　立昌・水野　伸洋・吉澤　顕（デンソーアイティーラボラトリ）・大門　樹（慶應義塾大学）","aff":["慶應義塾大学大学院","デンソーアイティーラボラトリ","慶應義塾大学"],"abstract":"自動運転レベル2において，ドライバの監視への注意が低下し，思考へ没入する不注意状態を推定するための指標を検討した．ドライビングシミュレータを使用し，2次タスクを課すことで，不注意状態を再現した．不注意状態での監視とドライバが安全であると想定する監視における視認行動の特徴を比較検討した結果を報告する．","stream":"✕"},{"id":"135","title":"前方注視点の動的推定に基づく通常とは異なるドライバの潜在意識の検知","author":"佐藤　学 （東洋大学大学院）・鈴木　宏典（東洋大学）","aff":["東洋大学大学院","東洋大学"],"abstract":"本研究は，3車線高速道路を走行するドライバの潜在的な不安全意識を検知する．前方注視モデル（PDM）を使用し，前輪操舵角のデータに対してパーティクルフィルタを用いることで，推定した各パラメータから前方注視点を推定する．直接計測が困難な前方注視点を可視化し，不安全意識の検知と妥当性を検証した．","stream":"◯"},{"id":"136","title":"適切なリアルタイム介入の実現に向けたドライバ・乗員状態変化検出手法の提案と実データを用いた試行","author":"大須賀　美恵子 （大阪工業大学／ウエルネスラボ）・竹内　大樹（産業医科大学）・鎌倉　快之（大阪工業大学）","aff":["大阪工業大学／ウエルネスラボ","産業医科大学","大阪工業大学"],"abstract":"自動運転の進展に伴い，ドライバ・乗員状態のモニタリングニーズはむしろ高まっている．特にその目的の一つはリアルタイム介入にある．本発表では，適切なタイミングと方法による介入に必要な要件と課題を整理し，保有データに基づく探索的検討から得られた知見を報告する．","stream":"◯"},{"id":"137","title":"生体指標に基づく多感覚刺激の最適化 -覚醒促進に寄与する刺激組み合わせの検討-","author":"小川　由理恵 ・大平　真也・興梠　有人・福原　千絵（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"ドライバーの覚醒度を向上させるシステム開発のため，官能評価と生体評価で音・空調・香り刺激の効果，及び相互作用による効果の増減を定量化．実車内では空調の風向が音の聞こえ方や香りの流れを変え，効果量を変動させることが示唆された．その結果に基づき，効果を最大化するための車両制御調整指針を提示した．","stream":"◯"},{"id":"138","title":"安静時平均皮膚温と同程度の暑熱環境下における2列配置および1列配置ファン内蔵カーシートの冷却効果","author":"髙橋　勇人 ・和田　健太郎・永井　暉之（京都工芸繊維大学大学院）・北川　哲也（フォルテック）・西崎　友規子・山下　直之（京都工芸繊維大学）","aff":["京都工芸繊維大学大学院","フォルテック","京都工芸繊維大学"],"abstract":"安静時平均皮膚温と同程度の環境温にて，カーシートの背面3行および座面2行に2列または1列でファンを配置し，送風時の体温調節反応を検討した．直腸温および平均皮膚温の変化は，2列配置と1列配置の間で同程度であったため，この環境下では1列配置のファン内蔵カーシートによる送風でも十分であることが示唆された．","stream":"◯"},{"id":"139","title":"低放射ガラスが冬季車室内における乗員生理・心理量に与える影響に関する車室内被験者実験と分析","author":"尾関　義一 （AGC）・龍崎　輝（竹中工務店）・辻本　雄一朗・新藤　幹・田辺　新一（早稲田大学）","aff":["AGC","竹中工務店","早稲田大学"],"abstract":"ガラスの放射率が車内熱環境，人体心理的・生理的反応に及ぼす影響について検討した．低放射率（low-E）ガラスと通常のガラスを両側に配置した車両にて，冬季実車実験を実施した．その結果，自動車用途向けの単層low-Eガラスは車内放射環境を大幅に改善し，建築用途向けのlow-E複層ガラスと同等の熱環境となった．さらにlow-Eガラスは皮膚温の低下を抑え寒さも感じ難く，これは感覚量数値モデルでも確認された．","stream":"◯"},{"id":"140","title":"顔表情および生理量を用いた乗員温熱快適性推定に関する検討","author":"河村　力 ・原　裕子・児玉　悠貴（マツダ）・辻　敏夫（広島大学）","aff":["マツダ","広島大学"],"abstract":"車室内空調制御の目標値設定に資する乗員温熱快適性推定手法の検討を目的に，車室内で比較的取得が容易な顔表情および生理量を用いた推定モデルの構築を試みた．これら指標を用いた推定の有効性と技術的課題を明らかにした．","stream":"◯"}]},{"id":121,"title":"ドライバ状態II","day":14,"room":"206","start":"13:35","end":"16:15","chair":"座長：大須賀　美恵子（大阪工業大学）","talks":[{"id":"141","title":"運転特性を考慮した走行データクラスタリングに基づくアクセル操作予測モデルの構築","author":"細木　貴文 ・室谷　立・佐藤　進（東京科学大学）","aff":["東京科学大学"],"abstract":"本研究では，実路走行データを運転特性に基づいてクラスタリングし，クラスタごとにLSTMベースのアクセル操作予測モデルを構築した．提案手法は走行データごとの操作傾向を反映した予測を行うことを目的としている．実験結果より，クラスタ別にモデル化することで，アクセル操作の予測性能が向上することが示された．","stream":"◯"},{"id":"142","title":"HRVと内分泌系指標の同期化による精神・身体ストレス分類を用いた車室内ヒト状態推定","author":"西　雅章 （本田技術研究所）・和泉　慎太郎・谷口　信人・野田　悠斗（神戸大学）・椎野　俊秀・野口　恭史（本田技術研究所）","aff":["本田技術研究所","神戸大学"],"abstract":"車室内で乗員のストレスや快・不快を推定するため，心拍変動と内分泌系変動の関係に着目し，唾液採取時刻を基準に過去の心拍変動解析窓をオフセット探索して同期化した．さらに，CNN（畳み込みニューラルネットワーク）推定モデルを用いてホルモン変動を推定し，精神・身体ストレス分類への有効性を示した．","stream":"◯"},{"id":"143","title":"運転支援機能への信頼を構築することが乗車時の安心に及ぼす効果","author":"古谷　庸介 ・岡本　宜久・神尾　大成・釼持　寛正・道田　奈々江（マツダ）・定藤　規弘（立命館大学）","aff":["マツダ","立命館大学"],"abstract":"安心して運転を楽しむためには，車の安全運転支援の機能に対して，信頼をしていることが重要だと考えている．信頼関係を築くための要件は「期待に応える支援であること」であるという仮説を立て，信頼の構築が運転時の安心につながることを，ドライビングシミュレ―タを用いた実験で明らかにした．","stream":"◯"},{"id":"144","title":"実路走行環境パラメータを用いたブレーキ予測機構搭載型アクセル操作予測モデルの構築","author":"室谷　立 ・細木　貴文・佐藤　進（東京科学大学）","aff":["東京科学大学"],"abstract":"自動車開発における車両シミュレーションへの適用を目的として，車間距離等の実路走行環境変数からドライバのアクセル操作を予測するモデルを機械学習（LSTM/Transformer）により構築した．モデルはブレーキを踏む確率を並列に予測する．結果をゲート機構で統合することで精度向上を達成し，特に停車前後で高い予測精度を示した．","stream":"◯"},{"id":"145","title":"気流刺激に対する身体部位の感受特性に基づくドライバの覚醒維持方策","author":"市川　太陽 ・林　瑶子（東京科学大学）・郭　鐘聲（拓殖大学）・平尾　章成（芝浦工業大学）・小竹　元基（東京科学大学）","aff":["東京科学大学","拓殖大学","芝浦工業大学"],"abstract":"ドライバの熱的不快感の抑制と覚醒維持を目的として，温熱環境下における気流刺激による身体部位の感受特性に着目し，頸部への気流刺激が熱的快適感と覚醒度に与える影響を検討した．その結果，初期の覚醒状態による差がみられたものの，熱的不快感を抑制しながら覚醒維持効果が得られる可能性が示唆された．","stream":"◯"},{"id":"146","title":"事業用自動車ドライバ向け居眠り予測システム（DAPS）の開発：覚醒度評価手法の基礎的検討","author":"田中　信壽 ・新国　哲也（自動車技術総合機構）","aff":["自動車技術総合機構"],"abstract":"事業用自動車ドライバの居眠り事故低減を目的に，点呼後の運行中に覚醒度低下を検出し居眠りの発生を予測するシステム（DAPS）を構想．眠気に伴う作業記憶と発話能力の変化に着目し，これらを評価するテストを夜間反復して行う被験者実験を実施．眠気上昇に伴い成績低下が見られ，各テストで用いた指標の有望性を示した．","stream":"✕"}]},{"id":122,"title":"ドライバの安全行動I","day":14,"room":"206","start":"16:45","end":"19:25","chair":"座長：中村　弘毀（日本自動車研究所）","talks":[{"id":"147","title":"一般道上での交通参加者との位置関係を考慮した交通外乱シナリオの体系化","author":"三浦　大輔 ・吉田　学立・林　玲秀（NTTデータオートモビリジェンス研究所）・森　真由（メイテック）・古在　由武（NTTデータオートモビリジェンス研究所）・長谷川　諒・小西　薫・今長　久（日本自動車研究所）","aff":["NTTデータオートモビリジェンス研究所","メイテック","日本自動車研究所"],"abstract":"一般道における車両・二輪車・自転車・歩行者との交通外乱シナリオについて，FunctionalとLogicalの中間層となるPre-Logicalシナリオ（Pre-LS）を定義した．道路形状・自車挙動・交通参加者の位置・向き・挙動の6要素による統一的な表現体系を提案する．","stream":"◯"},{"id":"148","title":"自動運転車が遭遇する交通外乱に対する網羅的安全性評価に向けた基盤技術構築 -道路構造・標識等に対応する法令と交通外乱シナリオの結合抽出-","author":"吉田　学立 ・三浦　大輔・林　玲秀（NTTデータオートモビリジェンス研究所）・森　真由（メイテック）・古在　由武（NTTデータオートモビリジェンス研究所）・長谷川　諒・小西　薫・今長　久（日本自動車研究所）","aff":["NTTデータオートモビリジェンス研究所","メイテック","日本自動車研究所"],"abstract":"一般道における交通外乱Pre-Logicalシナリオ（Pre-LS）を網羅的に生成し，道路構造・物理構造物・法令の制約を各シナリオに対応付けることで，安全性評価に必要なシナリオを体系的に抽出する手法を提案する．本手法を実装した自動化ツールを開発し，ケーススタディにより有効性を確認した．","stream":"◯"},{"id":"149","title":"2次元占有格子地図を利用した交差点リアルタイムリスク予測手法の開発","author":"茶屋　博紀 ・豊田　平司郎（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"本研究では，交差点におけるリアルタイムリスク予測手法を提案する．現場で観測した交通データを活用し，車両や歩行者ごとに信号状態や速度を考慮して，過去の類似状況から将来のニアミスリスクとその危険候補を効率的に抽出した．本手法により，複数主体が交錯する可能性を同時かつ俯瞰的に予測可能とした．","stream":"✕"},{"id":"150","title":"交差点を右折する一般ドライバの注意深い運転行動に関する研究","author":"真鍋　裕輝 ・児島　亨・阿部　晃大・宅島　護・北田　幸一（自動車技術総合機構）","aff":["自動車技術総合機構"],"abstract":"周辺車両との調和を含む，自動運転車にとって規範となる人間ドライバの運転行動を調査するため，交差点を右折する際に対向直進車両と接近する可能性がある場面における一般ドライバの注意深い運転行動に関して，ドライビングシミュレータを用いて調査した．","stream":"◯"},{"id":"151","title":"ドライブレコーダ映像と3D-LiDARデータによる走行軌跡の高精度推定方法に関する研究","author":"松村　英樹 （自動車技術総合機構）・田井中　一輝（東京都立大学）・石塚　康大朗・杉山　幹（交通事故総合分析センター）・久保田　直行（東京都立大学）","aff":["自動車技術総合機構","東京都立大学","交通事故総合分析センター"],"abstract":"交通事故の防止又は被害軽減のためには事故の原因究明が必要とされるが，その究明のためには可能な限り確からしい事故の再現が重要である．本検討では，事故再現の確からしさを向上させるため，ドライブレコーダ映像と3D-LiDARデータを用いて，走行軌跡を高精度に推定する方法について検討を行った．","stream":"◯"},{"id":"152","title":"ドライブレコーダ映像及びEDRデータ並びに走行軌跡の高精度推定結果を用いた事故再現とその有用性に関する検討","author":"石塚　康大朗 （交通事故総合分析センター）・松村　英樹（自動車技術総合機構）・田井中　一輝（東京都立大学）・杉山　幹（交通事故総合分析センター）・久保田　直行（東京都立大学）","aff":["交通事故総合分析センター","自動車技術総合機構","東京都立大学"],"abstract":"交通事故の原因究明に重要な事故再現に関して，著者らは，ドライブレコーダ（DR）映像とEDRデータを用いた客観的且つ定量的な再現方法と，DR映像と3D-LiDARデータを用い高精度の走行軌跡推定方法を提案した．本検討では，これらの方法を用いて実際の事故の再現と分析を行ったので報告する．","stream":"✕"}]},{"id":123,"title":"自動車用材料I","day":14,"room":"207","start":"9:30","end":"10:45","chair":"座長：三輪　紘敬（日産自動車）","talks":[{"id":"153","title":"市場回収データに基づく自動車板金部品の腐食深さの経時変化のベイズ統計手法","author":"徳永　淳志 （SUBARU）","aff":["SUBARU"],"abstract":"市場から部品を回収し腐食状態を調査して得られる腐食データは，数が少なく分散も大きいため，腐食量の経時変化を表す回帰分析に工夫が必要である．本発表では，原理的に妥当な腐食量の経時変化を示し，確率分布の上側裾野をできる限り精度よく推定するベイズ統計手法と自動車販売計画を考慮した発展手法について紹介する．","stream":"◯"},{"id":"154","title":"低温封孔処理によるアルミニウム部品の耐食性評価","author":"小野　晋太郎 ・村上　春彦・藤田　昌弘（スズキ）","aff":["スズキ"],"abstract":"船外機エンジンは冷却に海水を使用するため，複雑な形状の冷却水路部に高い耐食性が必要となる．本研究では，形状依存性の低い陽極酸化処理と，低温・短時間で耐熱性と耐食性を両立可能な新たな封孔処理を組み合わせた表面処理技術を開発した．本稿では，当該技術の特性評価結果を報告し，その有効性を検証する．","stream":"◯"},{"id":"155","title":"電極-電解液界面を考慮した劣化現象の機構解析","author":"櫻本　和弘 ・白井　敬介（豊田自動織機）","aff":["豊田自動織機"],"abstract":"電池性能および寿命を支配する電極-電解液界面では，電気二重層の形成を含む複雑かつ多体的な現象が発現し，実験的な直接観察や従来の計算手法による再現は困難である．本研究では，界面構造を考慮可能なシミュレーション手法を用い，Al腐食現象の機構解析を行った．","stream":"✕"}]},{"id":124,"title":"自動車用材料II","day":14,"room":"207","start":"11:55","end":"13:35","chair":"座長：川下　宜郎（日産自動車）","talks":[{"id":"156","title":"新JASO M 609法と防錆迅速評価法の相関検討","author":"江﨑　達哉 ・浅田　照朗（マツダ）","aff":["マツダ"],"abstract":"自動車の防錆品質の造り込みには精度が高く効率的な防錆塗膜の耐食性評価法が重要である．この度，より市場相関性が高い腐食試験法として新JASO M 609法が制定された．耐食性を高効率に評価するために開発した迅速評価技術は，この新JASO法とも相関性が高く，広い用途で防錆品質の造り込みに有効である．","stream":"◯"},{"id":"157","title":"車載内装加飾フィルムの耐薬品性における溶媒拡散挙動と分子鎖緩和の関係解析","author":"渋谷　滝人 （本田技術研究所）","aff":["本田技術研究所"],"abstract":"車載内装加飾フィルムにおける白化不具合の一因として，柑橘系芳香剤成分リモネンの侵入によるボイド形成がある．本研究では吸収解析と動的粘弾性測定により，アクリル種の違いが分子鎖緩和を介して拡散挙動を変化させ，ボイド形成を伴う白化挙動に影響することを明らかにし，耐薬品性に優れたアクリル層設計指針を示した．","stream":"◯"},{"id":"158","title":"耐火性樹脂の高温・燃焼中におけるin-situ引張試験手法の開発 -バッテリーパック用樹脂複合材料の比較評価-","author":"榎田　智志 ・梶谷　昂平・幸　淳史（ダイキョーニシカワ）・山田　裕紀・安田　周平・小川　淳一（マツダ）・大越　雅之・仲井　朝美（岐阜大学）","aff":["ダイキョーニシカワ","マツダ","岐阜大学"],"abstract":"BEVの普及に伴い火災時の構造安全性要求が高まる一方，高温燃焼過程における樹脂の機械特性評価法は未確立である．そこで筆者らは，樹脂燃焼中のその場引張試験機を開発した．本報では，バッテリーパック用構造部材に適用可能な2種類の樹脂複合材料を評価し，炭化層を形成するSMCが優れた強度保持性を示した結果を報告する．","stream":"◯"},{"id":"159","title":"リサイクルCFRPの品質評価の高度化に向けた繊維含有率の非破壊評価に関する研究 -アクティブサーモグラフィ法による熱拡散率計測-","author":"赤井　淳嗣 （京都教育大学）・濱田　幸宏（トヨタ自動車）・佐藤　康元（豊田中央研究所）・三国　敦（トヨタ自動車）","aff":["京都教育大学","トヨタ自動車","豊田中央研究所"],"abstract":"炭素繊維強化複合材料（CFRP）の中でも，リサイクル繊維を用いたCFRP（リサイクルCFRP）が近年注目されている．リサイクルCFRPの品質評価においては，繊維含有率の均一性を非破壊で評価することが重要である．CFRPの厚さ方向の繊維含有率を評価する指標として，著者らは厚さ方向の熱拡散率に着目した．本研究では，フラッシュランプを用いたアクティブサーモグラフィ法をCFRPに適用し，厚さ方向の熱拡散率を計測した．さらに，熱拡散率を用いた繊維含有率評価の可能性について検討した．","stream":"◯"}]},{"id":125,"title":"自動車用材料III","day":14,"room":"207","start":"14:05","end":"15:45","chair":"座長：片桐　知克（JFEテクノリサーチ）","talks":[{"id":"160","title":"エンジン軸受用積層めっき材料における下地結晶粒径が被膜組織および軸受性能に及ぼす影響","author":"前川　優平 ・金谷　竜次・羽根田　祐磨（大同メタル工業）","aff":["大同メタル工業"],"abstract":"積層めっき被膜による耐疲労性向上を目的として，下地の結晶粒による組織制御を検討した．下地結晶粒は金属添加量により微細化でき，積層する被膜の結晶粒にも影響を及ぼす．下地の結晶粒制御によって応力分散や亀裂進展の挙動に変化し，すべり軸受性能の向上に寄与する可能性を示した．","stream":"✕"},{"id":"161","title":"Evaluation of Liquid Metal Embrittlement and Spot Weldability in E-Coated, Galvannealed 1.8 GPa Hot-Stamped Steel","author":"Wook Jin Oh ･Chang Wook Lee (Hyundai Motor)･Je Youl Kong (Hyundai Steel)･Dong Hyun Kim (Hyundai Motor)･Jae Wook Kang (Hyundai Steel)","aff":["Hyundai Motor","Hyundai Steel"],"abstract":"This study investigates the effects of E-coating on mechanical properties, spot weldability, and liquid metal embrittlement of galvannealed (GA) 1.8 GPa hot-stamped steel. GA steel shows superior elongation and bending performance with Al-10Si coated steel. Liquid metal embrittlement is controlled by heat treatment conditions, requiring adequate holding to suppress zinc penetration. Resistance spot weldability is maintained despite surface oxidation. These results support GA hot-stamped steel application in automotive structural components.","stream":"◯"},{"id":"162","title":"等価指標による水素脆化評価の規格差整合","author":"木村　亜聞 ・溝上　達志・深堀　貢（マツダ）","aff":["マツダ"],"abstract":"近年の自動車軽量化・衝突安全性向上の要求により，高強度鋼板の適用が拡大している．高強度鋼板は水素脆化の解決が信頼性における重要課題の一つであり，適切な評価手法の確立が求められる．本研究では国内外で用いられる4点曲げ試験とU字曲げ試験で等価な水素脆化評価を実現する手法について報告する．","stream":"◯"},{"id":"163","title":"動的負荷環境下における水素脆化耐性の判断指標","author":"前田　晋 （本田技術研究所）・鈴木　純弥（本田技研工業）・宝田　龍哉（本田技術研究所）・田中　秀樹（本田技研工業）・一條　秀治・仁平　瑞貴・後藤　一斗（本田技術研究所）","aff":["本田技術研究所","本田技研工業"],"abstract":"ベアリング等の動的負荷環境における水素脆化事象は，発生メカニズムが不明確であり，決定的な結論には至っていなかった．本報では，オイル皮膜形成能に及ぼす添加剤の影響と，実使用環境における振動影響に着目し，メカニズム解明に取り組み，一定の結論を得た．また，実運用可能な水素脆化強度の判断指標を構築した．","stream":"◯"}]},{"id":126,"title":"高齢ドライバI","day":14,"room":"小ホール","start":"9:30","end":"11:10","chair":"座長：伊藤　安海（山梨大学）","talks":[{"id":"164","title":"日本における高齢ドライバ人口と操作間違いによる事故の推移","author":"加藤　洋子 ・松井　靖浩・関根　道昭（自動車技術総合機構）","aff":["自動車技術総合機構"],"abstract":"日本では高齢化が進行している．一方，自動車依存の高まりや運転経験世代の変化等を背景として，ドライバの高齢化はより速いペースで進行している可能性がある．本講演では，高齢ドライバの増加度合を定量的に示すとともに，ペダル踏み間違い事故等，高齢ドライバに多いとされる事故の年次推移について考察する．","stream":"◯"},{"id":"165","title":"高齢者向け電動モビリティのユーザー体験評価と身体・認知機能特性との関係 -－移動支援実証内における探索的研究－-","author":"渡邉　寛 ・山崎　宏（オートテクニックジャパン）・森山　修・武藤　健伸・高野　映子・近藤　和泉（国立長寿医療研究センター）","aff":["オートテクニックジャパン","国立長寿医療研究センター"],"abstract":"地域高齢者の移動支援実証において，パーソナルモビリティの利用者調査を実施した．身体・認知機能と2車種のUX評価の関連を分析した結果，利用者特性に応じた機器選択及び調整の重要性が示唆された．","stream":"◯"},{"id":"166","title":"高齢ドライバ個人特性からみたVRトレーニングの安全確認行動への効果","author":"吉原　佑器 ・江　林京・Nihan Karatas・原田　あすか・金森　等（名古屋大学）・小島　基資（トヨタ自動車）・田中　貴紘（名古屋大学）","aff":["名古屋大学","トヨタ自動車"],"abstract":"高齢ドライバを対象にVRトレーニングの介入実験を実施し，実車走行における安全確認行動への効果をドライバ特性，認知機能スコアとの関連から検討した．安全傾向を有するドライバ群では，トレーニング成績と実車での確認行動に正の相関が認められ，ドライバ特性が介入効果の転移に影響することが示唆された．","stream":"◯"},{"id":"167","title":"高齢ドライバの生活・健康意識，運転経験，ADAS必要性および運転適性診断結果の関連に基づく事故リスク要因の検討 -（50）運転寿命延伸を目指したドライバ運転特性研究-","author":"谷口　俊治 ・伊藤　倫・青木　宏文（名古屋大学）","aff":["名古屋大学"],"abstract":"本研究は，生活・健康・運転行動・安全意識を含む調査と運転適性検査を統合し，事故リスクの構造を多面的に分析した．その結果，健康低下が認知機能を介して事故リスクを高める経路を確認するとともに，自己評価と実測能力の乖離を明らかにした．さらにADAS必要性との関連を示し，安全対策の方向性を提示した．","stream":"◯"}]},{"id":127,"title":"エアコンディショナ","day":14,"room":"小ホール","start":"12:10","end":"13:25","chair":"座長：六嶋　公平（デンソー）","talks":[{"id":"168","title":"車室内快適性向上に向けた対流空調流れの最適化検討","author":"鈴木　順 ・丸本　真玄・桝井　茜・河上　晃希・研井　暁（マツダ）","aff":["マツダ"],"abstract":"自動車空調の快適性向上と仕事低減の両立に向け，車室内対流空調流れの流れ場を高速に計算可能なCFDサロゲートモデルを構築し，同モデルを用いたパラメータスタディ・最適化を用いて，人体各部位近傍の温度場・速度場分布に対する空調の吹出条件（風量・分配など）の影響を明らかにした．","stream":"◯"},{"id":"169","title":"車室内空調を模擬した吹き出し噴流におけるReynolds平均型乱流モデルの予測精度検証","author":"伊藤　和樹 （広島大学）・森下　正浩・武藤　亘平（ハイリマレリジャパン）・中島　卓司（広島大学）・郡　逸平（東京都市大学）・尾関　義一（AGC）・井上　実（マツダ）・松永　和彦（神奈川県立産業技術短期大学校）・陸田　秀実（広島大学）","aff":["広島大学","ハイリマレリジャパン","東京都市大学","AGC","マツダ","神奈川県立産業技術短期大学校"],"abstract":"車室内空調における乗員の等価温度評価では対流熱伝達率を含む熱収支予測が重要で，空調気流の更なる予測精度向上が求められる．本研究では吹出し噴流を対象に，高応答多孔プローブによる計測との比較からRealizable k-εモデルによる乱流エネルギ輸送メカニズムの再現性を検証し，精度向上のための課題を整理した．","stream":"◯"},{"id":"170","title":"低GWP冷媒向けPOE冷凍機油の基礎特性","author":"皆川　有成 ・髙木　智宏・澤田　健・桜庭　吏・水谷　祐也（ENEOS）","aff":["ENEOS"],"abstract":"近年，冷凍・空調機器分野では，地球温暖化係数（GWP）が低く，環境負荷の小さい冷媒が注目されている．本報告では，冷凍圧縮機の潤滑を担う冷凍機油について，R290（プロパン）などといった低GWP冷媒雰囲気下における諸物性評価の結果を示す．","stream":"◯"}]},{"id":128,"title":"冷媒","day":14,"room":"小ホール","start":"13:55","end":"16:00","chair":"座長：永井　大樹（東北大学）","talks":[{"id":"171","title":"BEVにおける熱マネジメントシステムの1Dモデル開発 -（第2報）冷凍サイクル中のオイル挙動予測モデルの構築-","author":"山下　優 ・安田　陽介・佐藤　裕介・須藤　知宏（デンソー）","aff":["デンソー"],"abstract":"BEVの熱マネジメントシステムは運転モードが多様化し，中核を担う冷凍サイクルへの要求が⾼度化している．特にコンプレッサーは冷媒に溶解したオイルで潤滑されるため，潤滑性と効率の両⽴が鍵となる．本報では，サイクル内オイル挙動を物理現象から予測する独⾃モデルを構築し，実機計測値を⾼精度に再現したので報告する．","stream":"✕"},{"id":"172","title":"将来xEVにおける次世代冷媒を活用したサーマルシステムに関する研究","author":"道川内　亮 ・杉原　寛之・太田　篤治（トヨタ自動車）・加見　祐一（デンソー）","aff":["トヨタ自動車","デンソー"],"abstract":"将来の欧州PFAS規制を背景に，現行冷媒の代替として空調電費や電池温調性能に優れるプロパン冷媒を用いたxEV向けサーマルマネジメントシステムを検討した．車両安全性確保のために車室側のエバポレータまでプロパン冷媒を引き込まず，チラーとクーラコアを新設して冷却水を介すことにより，部品点数増加によるシステム複雑化が懸念される．そこで，低コストで低冷媒量な熱回路構成を提案し，机上での成立性を確認した．","stream":"◯"},{"id":"173","title":"電池用低導電率クーラントの長寿命化に向けた処方設計 -電池用低導電率クーラントにおける導電率上昇要因の解析-","author":"児玉　康朗 （トヨタ自動車）・柄澤　涼・大坪　巧（日本ケミカル工業）","aff":["トヨタ自動車","日本ケミカル工業"],"abstract":"BEVでの低導電率クーラント適用は漏洩時の発熱抑制に有効だが，経年使用で酸化や部材イオン溶出で導電率が上昇．本研究はろう付けイオン溶出を防食剤で抑制し，長期安定化と寿命延長を実現．","stream":"◯"},{"id":"174","title":"低GWP冷媒を作動流体とした自励振動ヒートパイプの伝熱特性","author":"道願　陸斗 （東北大学大学院）・根岸　泰隆・文野　明日香・三原　祐二（ダイキン工業）・加納　歩輝・清水　歩（東北大学大学院）・永井　大樹（東北大学）","aff":["東北大学大学院","ダイキン工業","東北大学"],"abstract":"自励振動ヒートパイプ（OHP）は，薄型軽量な高熱拡散デバイスとして注目されている．本研究ではモビリティへの適用を目指し，次世代低GWP冷媒R474Bを封入したOHPの熱輸送性能を実験的に調査した．内部圧力や管壁温度の計測，および他冷媒との比較を通じて，冷媒物性の違いがOHPの熱輸送性能に与える影響を評価した．","stream":"◯"},{"id":"175","title":"Thermal-Flow Stabilization Design of a Coolant Heater for Electric Vehicles","author":"Daeseong Han ･Jung Han Kim･Dae Nyeon Kim (Gyeongbuk Institute of IT Convergence Industry Technology)･Il Hwan Yi (Kumoh National Institute of Technology)･Jaehwan Jeong (DHG)","aff":["Gyeongbuk Institute of IT Convergence Industry Technology","Kumoh National Institute of Technology","DHG"],"abstract":"This study analyzed the outlet coolant temperature characteristics according to the flow channel design of a coolant heater. CFD simulations were conducted under conditions of 8 kW heating power and 10 L/min flow rate to evaluate the outlet coolant temperature and derive an optimal flow channel design. The results confirmed that the flow channel structure attached to the heating plate was effective in improving heat transfer performance and generating coolant turbulence.","stream":"✕"}]},{"id":129,"title":"熱・流体I","day":15,"room":"大ホール1","start":"9:30","end":"11:10","chair":"座長：坪倉　誠（神戸大学大学院／理研）","talks":[{"id":"176","title":"自動車用タイヤのトレッドパターンが自動車の空気抵抗に与える影響の検討","author":"伊田　真悟 ・永瀬　将弘（住友ゴム工業）・山田　悟・田中　郁生（ダッソー・システムズ）","aff":["住友ゴム工業","ダッソー・システムズ"],"abstract":"自動車の走行抵抗を低減するため，タイヤのトレッドパターンの違いが空気抵抗に与える影響を調べた．CFDによる検討には2種類の車両を用い，トレッドパターンの違いによりタイヤ4本分でタイヤのCD寄与が最大0.003変化することが分かった．また，トレッドパターンの違いが車両背面流れにも影響することが分かった．","stream":"✕"},{"id":"177","title":"車両走行による帯電および表面でのイオン中和・電気力変動を考慮した気流変化の解析手法","author":"髙須賀　直一 （SOKEN）・前田　和宏（トヨタ自動車）・前田　登（SOKEN）","aff":["SOKEN","トヨタ自動車"],"abstract":"前報では，車両走行時の帯電による流れ変化を，流体・静電場・電荷輸送の3物理場連成解析により明らかにした．本研究では，タイヤ入力電荷，空気正イオン，中和状態の変動を考慮し，各要因が気流に及ぼす影響度を評価した．","stream":"◯"},{"id":"178","title":"マルチツールをオンライン連成するCo-Simulation環境の構築 -（第7報）OBDを対象とするMBD手法の検討-","author":"緒方　健一郎 ・中村　大二郎・鶴巻　尚志（本田技術研究所）・谷　理範（本田技研工業）・福島　斉春・岡川　洋平・谷本　悠太朗・本荘　拓也（本田技術研究所）","aff":["本田技術研究所","本田技研工業"],"abstract":"製品のタイムリーな量産化に向け，高効率なパワーユニット開発プロセスとMBDが必要である．法規対応の一つのOBDは車両システムを対象とするため，関連デバイスの範囲が広くメカニズムのモデル化が容易ではない．本報は，OBDにおけるエバポレーションリーク診断機能を対象としたMBDの適用可能性を述べる．","stream":"◯"},{"id":"179","title":"3次元流体解析による車室内電子部品の雰囲気温度予測法開発 -（第2報）-","author":"奥村　孝文 ・西森　久雄・武藤　潤・釜谷　大志・初岡　涼平・本多　哉尋・山口　大樹（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"車載電子部品の高機能化や車両の意匠，使われ方の多様化により搭載位置に応じた電子部品の熱設計がより重要になっている．車室内温度を予測するため，本稿では第1報で提案した手法を第1報とは異なる車種，地域に適用し，実測と比較することで本手法が有効となる境界条件の検証及び温度変化量誤差の改善に取り組んだ．","stream":"◯"}]},{"id":130,"title":"熱・流体II","day":15,"room":"大ホール1","start":"12:10","end":"13:50","chair":"座長：飯田　明由（豊橋技術科学大学）","talks":[{"id":"180","title":"全体構造と細部形状を分離した潜在表現に基づく車両空力予測モデルの検討","author":"中島　卓司 ・岡本　泰知・苗　江東・佐々木　千里・Bisser Raytchev・農澤　隆秀（広島大学）・清水　圭吾・中村　優佑・瀬尾　晃平（マツダ）・坪倉　誠（神戸大学／理化学研究所）","aff":["広島大学","マツダ","神戸大学／理化学研究所"],"abstract":"本研究では，車体形状を解像度に基づき全体構造と細部形状に分離し，両者の潜在表現を統合することで，細部形状の特徴をより適切に保持する潜在表現を構築した．この潜在表現に基づき，空力性能予測モデルと，ニューラルオペレーター型モデルを用いた車両周囲流れ場の高解像度予測モデルを構築し，有効性を検証した．","stream":"◯"},{"id":"181","title":"Graph Neural Networksを用いた自動車表面圧力・応力の効率的予測のための転移学習","author":"田中　凱也 （神戸大学）・大西　順也（理化学研究所）・中島　卓司（広島大学）・坪倉　誠（神戸大学/理化学研究所）","aff":["神戸大学","理化学研究所","広島大学","神戸大学/理化学研究所"],"abstract":"自動車空力性能評価の効率化に向け，車体表面の圧力・応力場を直接予測するGNNモデルが注目されている．一方で，車種ごとのスクラッチ学習には流体解析データ作成および学習に高コストを要する．そこで本研究では，事前学習済みモデルを用いた転移学習を適用し，その有効性を学習時間と予測精度の観点から評価する","stream":"◯"},{"id":"182","title":"FEMを用いたドアシールの隙間における漏洩音予測手法の開発","author":"土岐　武也 （トヨタ自動車）・高阪　文彦（ダッソーシステムズ）・伊藤　祐太・安岡　志朗（トヨタ自動車）","aff":["トヨタ自動車","ダッソーシステムズ"],"abstract":"空力騒音に分類されるリーク音は，高速走行時にドア等の微小な隙間から音が漏れ出る現象であり，静粛性の開発要素の一つである．本報はCAEを用いた予測手法を開発し，ドア構造を題材に音響加振時の車室内への透過経路とレベルを予測した．同様の条件で実機評価した結果と検証した結果を報告する．","stream":"◯"},{"id":"183","title":"3次元形状の潜在表現を用いた大規模言語モデルによる空力特性推論に関する基礎研究","author":"伊藤　悟 （名古屋大学大学院）・西口　浩司（理化学研究所）・仲谷　幸一郎・尾嵜　悠利（名古屋大学大学院）・金森　敬宗・則竹　真吾・田中　博（トヨタシステムズ）","aff":["名古屋大学大学院","理化学研究所","トヨタシステムズ"],"abstract":"LLMの自動車の設計支援への応用のためには，3次元空間の学習が不可欠である．本稿はその初期的研究として3次元形状を潜在ベクトルに圧縮して学習させ，抗力係数を推論する手法を提案する．本研究では潜在ベクトルの次元数が推論精度に与える影響を検証し，次元数の増加による推論精度の向上を確認した．","stream":"✕"}]},{"id":131,"title":"振動・騒音・乗り心地IV","day":15,"room":"大ホール3","start":"9:30","end":"11:10","chair":"座長：松村　雄一（岐阜大学）","talks":[{"id":"184","title":"Virtual Point Transformationを導入した実稼働TPAによる高精度6自由度寄与分離手法に関する検討","author":"藤牧　幸輝 ・原　健太・吉田　準史（大阪工業大学）","aff":["大阪工業大学"],"abstract":"本研究ではVirtual Point Transformationと実稼働TPAを連携することで，実測不可能な起振源中心部の6自由度入力から応答点までの寄与分離法を行なう．その際，寄与分離精度向上手法も併せて検討した上で，簡易自動車模型に適用した結果について報告する．","stream":"◯"},{"id":"185","title":"自動車ラゲッジ空間を対象とした実稼働TPA-CAE連携による高寄与音響モード抽出および応答予測手法について","author":"吉田　準史・中村　理人（大阪工業大学）・ 中島　憲久 ・福本　一朗（河西工業）","aff":["大阪工業大学","河西工業"],"abstract":"本研究では，簡易ラゲッジ空間模型を分析対象にCAE固有モードと実稼働TPA主成分モードを連携させることで後席位置に設定した応答点音圧に対するラゲッジ空間の高寄与音響モードを把握する．さらに対策周波数周辺のCAEモード応答をTPAモデルに導入することでラゲッジ形状変更時の応答予測手法も検討した．","stream":"◯"},{"id":"186","title":"マイクロフォン組込みタイヤによる道路インフラ健全性モニタリング方法の検討","author":"谷　弘詞 ・呂　仁国・小金沢　新治（関西大学）","aff":["関西大学"],"abstract":"マイクロフォンを組込んだタイヤを用いて道路の路面粗さや段差，橋梁の床版劣化状態などの健全性をモニタリングする手法について検討した．その結果，路面粗さや段差，橋梁の劣化度合いについて検出可能性があることが分かった．","stream":"◯"},{"id":"187","title":"MLSに基づく曲面構造物の瞬時振動インテンシティの計測手法","author":"山田　宏典 （SUBARU）・阿部　啓介（University of Michigan／North american Subaru）・山崎　徹（神奈川大学）","aff":["SUBARU","University of Michigan／North american Subaru","神奈川大学"],"abstract":"曲面構造物における伝搬初期の振動エネルギーを安定的に時系列で求めることを目的に，瞬時振動インテンシティの計測手法を開発した．レーザードップラー振動計により多点計測した振動速度に移動最小二乗法（MLS）を適用し，瞬時振動インテンシティを導出した．実験結果とFEM解析結果の比較により妥当性を確認した．","stream":"◯"}]},{"id":132,"title":"振動・騒音・乗
