り心地V","day":15,"room":"大ホール3","start":"12:10","end":"13:50","chair":"座長：戸井　武司（中央大学）","talks":[{"id":"188","title":"実車振動を用いた人体-シート系の動特性と乗り心地評価","author":"吉村　卓也 （東京都立大学）・小笠原　浩史（東京都立大学大学院）・洪　佳駿・玉置　元（東京都立大学）・野島　崇矢・塩崎　弘隆（三菱自動車工業）","aff":["東京都立大学","東京都立大学大学院","三菱自動車工業"],"abstract":"本研究では，6軸加振機を用いて実車走行時の振動を再現し，その波形を用いて人が乗った状態の2種類の自動車シートを加振し各速度における主成分の比較とそれぞれのシートにおける主成分の変化等の比較を行い被験者の振動感覚と振動特性について比較をすることにより自動車の乗り心地に影響を及ぼす振動の同定を行うことを目的とする[．","stream":"◯"},{"id":"189","title":"心地良いパワーシート作動音の開発 -(第1報)パワーシート作動音低減につながるモーターギヤ噛合い力最適化モデルの検討-","author":"新堀　圭一郎 ・佐藤　篤司・時田　塁（トヨタ紡織）","aff":["トヨタ紡織"],"abstract":"近年，車両の電動化が急速に進展しており，それに伴い車室内の騒音低減要求が高まる中，本報ではパワーシートのモーターギヤ噛合い起振力に着目し，1D-CAEモデルの構築と最適化計算によりギヤ噛合い起振力の低減効果を評価するとともに，設計初期段階への適用有効性を確認した．","stream":"◯"},{"id":"190","title":"空冷式電池ユニットの送風音抑制に向けた予測技術の構築（ダクト減衰量の予測）","author":"茶谷　文博 ・渡邊　卓夫・西脇　雅宣・大田垣　晃（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"HEV電池パックの冷却性能開発において問題となるブロワ送風音について，ダクト区間の音の減衰量（“ダクト減衰”）に着目した予測技術を構築．吸音材およびダクト曲げによる減衰変化の傾向をとらえることを号口車両のダクトを用いて確認．","stream":"◯"},{"id":"191","title":"表面微細構造によるダクト曲がり部における境界層制御と空力騒音低減","author":"野村　俊平 ・祖父江　祐太（岐阜大学）・小坂　翔・吉田　憲司・関　加夫里（デンソー）・酒井　康彦（名古屋産業科学研究所）・山田　周歩（富山県立大学）・寺島　修（岐阜大学）","aff":["岐阜大学","デンソー","名古屋産業科学研究所","富山県立大学"],"abstract":"空調ダクトや送風ダクトの曲がり部で生じるはく離・再付着流れを対象に，1mm未満の表面微細構造による境界層制御が空力騒音および圧力損失に及ぼす影響を実験的に検討した．微細構造の特性や形状を最適化することで，圧力損失を増加させることなく特定周波数帯の空力騒音を低減できることが明らかとなった．","stream":"◯"}]},{"id":133,"title":"安全一般I","day":15,"room":"104+105","start":"9:30","end":"12:10","chair":"座長：関根　康史（福山大学）","talks":[{"id":"192","title":"項目反応理論を用いた運転リスク評価テストで出現するハザードの分類","author":"篠原　一光 ・増田　奈央子（大阪大学大学院）・島崎　敢（近畿大学）・伊藤　倫・青木　宏文（名古屋大学）","aff":["大阪大学大学院","近畿大学","名古屋大学"],"abstract":"運転リスク評価テストはドライバ視点の動画を観察し，場面中のハザードを次々タッチして回答するものである．テスト中の各ハザードの特性を考慮したハザード検出能力評価が望まれる．本研究では本テストにおけるハザード検出能力の因子構造を解明し，項目反応理論によって各ハザードの特性パラメータを得ることを試みる．","stream":"◯"},{"id":"193","title":"Characteristic Analysis of Vehicle-VRUs Crashes Based on Real Accident Data in China","author":"ze yao Li (Huaqiao University)･ Zhuo Li ･Di Pan (Xiamen University of Technology)･Koji Mizuno (Nagoya University)･Yong Han (Xiamen University of Technology)","aff":["Huaqiao University","Xiamen University of Technology","Nagoya University"],"abstract":"Vulnerable Road Users (VRUs) suffer high casualty rates in traffic crashes and are a major focus of road safety research. Based on 4,060 real vehicle-VRU crash videos from the VRU-TRAVi database in China, this study conducts statistical and characteristic analysis across pre-crash, in-crash, and post-crash stages. K-modes clustering is used to identify typical accident scenarios. The findings reveal spatiotemporal, kinematic, and injury patterns of pedestrians, cyclists, and powered two-wheelers, and clarify key risk factors including visual obstructions, speed, and impact locations. Results provide reliable data support for vehicle safety design, road management, and VRU crash prevention.","stream":"◯"},{"id":"194","title":"機械学習を用いた6000系アルミ合金のBH後の耐力予測に関する研究（第2報）","author":"永井　潤哉 ・青野　健太郎・根川　亮佑・高見　大輝（SUBARU）","aff":["SUBARU"],"abstract":"自動車パネルに使用される6000系アルミ合金は成形ひずみや塗装焼付時に硬化=ベークハード（BH）し，各条件の組み合わせで耐力が決まる．第1報でBH後耐力の予測技術確立を試み，今回はCAEモデルへの適用と予測精度への影響を調査した．","stream":"◯"},{"id":"195","title":"後方散乱光による凍結路面μ計測の妥当性検証","author":"川原　友希 （東北学院大学大学院）・城戸　章宏（東北学院大学）","aff":["東北学院大学大学院","東北学院大学"],"abstract":"NIR後方散乱画像による凍結路面μの計測においては，氷表面およびその下層である路面層からの反射が複合された多層反射を計測しており，特に，路面層からの反射光は測定波長と表面粗さの両方に依存すると考えられる．本研究ではこれらの反射特性について調査し，後方散乱光による凍結路面μ計測の妥当性について理論的に検証した．","stream":"◯"},{"id":"196","title":"砂利への進入による車両横転挙動のモデル化と再現性の検証","author":"伊原　裕貴 （SUBARU）・香西　俊彦・岩瀬　勉（群馬大学/SUBARU）・諸富　直樹（SUBARUテクノ）・木下　博文・極楽寺　誠一（SUBARU）","aff":["SUBARU","群馬大学/SUBARU","SUBARUテクノ"],"abstract":"実際の交通環境において，車両が横滑りして路側の砂や砂利に進入し，横転する事象が考えられる．本稿では，砂利への進入に着目し，砂利のモデル化，ならびに砂利同士の摩擦係数の同定を実施した．さらに，構築した砂利モデルを用いて車両挙動の再現性を検証した．その結果について報告する．","stream":"◯"},{"id":"197","title":"遠隔接続されたドライビング・サイクリングシミュレータにおける通信遅延の影響評価","author":"山口　拓真 ・張本　雅康・伴　和徳（トヨタテクニカルディベロップメント）","aff":["トヨタテクニカルディベロップメント"],"abstract":"交通行動は他者と円滑に移動する協調タスクであるため，複数の交通シミュレータ連携は交通行動解析において有用な手段である．しかし，連携にはネットワーク通信が必要となり，遅延量が重要な課題となる．そこで，遠隔地接続を実証し，その遅延量の検証し，判断モデルを活用することにより，その遅延量の許容度を検証する．","stream":"◯"}]},{"id":134,"title":"自動運転に係わる安全","day":15,"room":"104+105","start":"13:20","end":"15:00","chair":"座長：堤　成可（香川大学）","talks":[{"id":"198","title":"車対自転車出会い頭シナリオにおける自動運転車の安全運転行動とその限界の定量的評価 -（第1報）ヒヤリハット事例をもとにした衝突リスクの評価-","author":"阿賀　正己 （東京農工大学）・齊藤　裕一（筑波大学）・Pongsathorn Raksincharoensak・永井　正夫（東京農工大学）","aff":["東京農工大学","筑波大学"],"abstract":"ドライブレコーダの自転車出会い頭483事例をもとに，ヒヤリハットを“運悪く衝突した場合”のシナリオへ再構成し，自動運転車の安全性を定量的に評価する手法を提案した．これにより，安全運転行動の効果とその限界を明確にすることができる．例として，制限速度走行の場合と事前減速した場合の衝突リスクを示した．","stream":"◯"},{"id":"199","title":"自転車の存在を通知する運転支援システムの受容性評価","author":"原田　あすか ・金森　等（名古屋大学）・山田　健一・水間　隼人・齊藤　雅治（トヨタ自動車）・吉原　佑器・Nihan Karatas・江　林京・田中　貴紘（名古屋大学）","aff":["名古屋大学","トヨタ自動車"],"abstract":"生活道路での出会い頭事故防止には通信型運転支援が期待されるが，自転車の存在を正しく通知する頻度に課題がある．正通知頻度が低い場合の課題を整理し，抽象度の高い通知方法を絞込み，誤通知や未通知を含む条件でDS実験を行い支援の受容性を明らかにした．また，運転注意力への影響についても調査したので報告する．","stream":"◯"},{"id":"200","title":"自動運転バスの遠隔操縦における視点位置が操舵特性に与える影響","author":"松村　勇作 ・古郡　直樹・杉町　敏之・櫻井　俊彰・矢作　修一（東京都市大学）・大貫　正明・中野　公彦（東京大学）・郭　鐘聲（拓殖大学）","aff":["東京都市大学","東京大学","拓殖大学"],"abstract":"本研究では，自動運転バスの遠隔操縦を対象に，視点位置の違いが運転特性へ与える影響を評価した．大型車用ドライビングシミュレータを用いて複数の視点位置および速度条件を設定し，運転特性や操縦負担の観点から比較評価を行うことで，遠隔操縦に適した視点条件について検討した．","stream":"◯"},{"id":"201","title":"ステレオカメラベースのオンライン地図生成に関する事例研究","author":"柳瀬　龍 ・譚　朗星・小甲　啓隆（SUBARU）","aff":["SUBARU"],"abstract":"自動運転や先進運転支援システムにおいて，高精度な地図情報の生成は重要な課題である．本研究では，ステレオカメラから得られる物体認識結果を利用し，走行しながら環境地図を構築する技術を提案する．本フレームワークは観測された物体情報をリアルタイムに統合し，動的な環境変化にも対応可能な地図生成を実現する．さらに，実環境における走行データを用いた評価により，提案手法の有効性および実用性について検証する．","stream":"◯"}]},{"id":135,"title":"xEVモータ技術","day":15,"room":"107+108","start":"9:30","end":"12:10","chair":"座長：安島　俊幸（Astemo）","talks":[{"id":"202","title":"高出力密度モータの開発（第4報） -高回転化の成立限界を考慮した電磁・機械強度統合設計による10 kW/kg級高出力密度化の実証-","author":"板坂　直樹 ・河野　通治・椛嶌　寿行・野村　健太郎・平林　千典（MCF Electric Drive）","aff":["MCF Electric Drive"],"abstract":"前報の課題に基づき，高出力密度モータの設計改良を行った．高回転化，電磁界最適化，冷却構造改善により出力密度向上を図り，解析により各因子の影響を整理した．さらに試作機評価により出力密度10kW/kg超えを実証し，設計の有効性を確認した．","stream":"◯"},{"id":"203","title":"高出力密度モータの開発（第5報） -直接油冷却におけるコイルエンド温度上昇の不均一性の発生要因と低減-","author":"椛嶌　寿行 ・板坂　直樹・河野　通治・野村　健太郎・平林　千典（MCF Electric Drive）","aff":["MCF Electric Drive"],"abstract":"第4報設計の試作機について詳細評価を行い，出力特性，効率，温度分布，高回転域の損失挙動を明らかにした．解析との比較により電磁界設計および冷却構造の寄与を定量化し，各設計因子の相互作用と支配因子を抽出した．さらに設計上の制約条\n                                        件と今後の課題を整理した．","stream":"◯"},{"id":"204","title":"e-Axleにおける小型化・高効率化および高トルク密度化技術の開発","author":"髙橋　洋平 ・植杉　桂・大石　貴彦・塩満　栄一（明電舎）","aff":["明電舎"],"abstract":"軽・Aセグ車両向けに低背・軽量かつ高トルク密度である小型e-Axleを開発した．ギヤは平行2軸の構成で，モータとの空き空間にインバータを配置することで三辺寸法を最小化した．モータ巻線占積率の向上と磁石の二重V字構成により高トルク密度化し，スイッチング速度の向上，オイルの損失低減により高効率化を達成した．","stream":"◯"},{"id":"205","title":"発電モータの位置センサレス制御における異常検知および復帰手法の構築","author":"森　憲一 ・小島　哲朗・澤田　彰・中島　孝（日産自動車）","aff":["日産自動車"],"abstract":"100%電動駆動ハイブリッド車の発電モータに位置センサレス制御を適用する際，万一の推定異常への対応が課題となる．本講演では，回転変化速度と電流を用いた異常検知と，ゲートオフと三相短絡を組み合わせた復帰ロジックを提案し，過電流抑制と振動低減を両立しつつ再始動可能であることを実車試験で確認した．","stream":"◯"},{"id":"206","title":"二重三相巻線の中性点間に界磁巻線を接続したハイブリッド界磁メモリモータの基礎検証 -（第4報）負荷運転時の効率向上効果-","author":"牧野　宏明 ・齋藤　亮介・松下　真琴・遠井　敬大・竹内　活徳（東芝）","aff":["東芝"],"abstract":"モータの高効率化技術として可変磁束技術が着目されている．著者らは，高い可変磁束性能の実現とインバータ容量増加の抑制を目指し，二重三相巻線の中性点間に界磁巻線を接続したハイブリッド界磁メモリモータ・ドライブシステムを提案している．本稿では，ミニモデル試作機を用いて高効率化効果を検証した結果を報告する．","stream":"◯"},{"id":"207","title":"モータ冷却CAEの高速化技術開発","author":"中野　慎太郎 （トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"電動車駆動用モータ開発では冷却性能予測としてCAEを活用して効率的な開発を実施している．CAEは計算に数日を要し更なる効率化として，本研究は粒子法による3次元モータ冷却CAEを対象に，サロゲートモデルによる計算高速化を行った．CAE結果を直交格子上に変換した前処理と，GCNNを用いて冷媒粒子挙動を予測し，濡れ面積を算出する手法を構築．その結果，粒子法解析と比較して計算時間を1分程度に短縮しつつ，濡れ面積予測精度MAPE5％を達成．","stream":"◯"}]},{"id":136,"title":"xEVシステム技術","day":15,"room":"107+108","start":"13:20","end":"16:00","chair":"座長：平野　覚（日野自動車）","talks":[{"id":"208","title":"Development of a Model-Based 2-Stage Motor System Inverter Durability Test Mode Reflecting Customer Usage","author":"Minsu Hyun ･Miyong Lee･Je Hwan Lee･Yeong Ju Koh (Hyundai Motor)","aff":["Hyundai Motor"],"abstract":"This study proposes a methodology for developing durability test profiles for a 2-stage motor system inverter based on real-world customer usage. A C-segment electric crossover vehicle was used as a reference to generate simulation scenarios, and a multi-physical vehicle model was applied to reproduce operating conditions. The generated scenarios were applied to a target vehicle to calculate inverter thermal loads, and an optimization approach was used to derive durability test profiles. The proposed method reproduced customer usage within a 5% error margin and established durability test profiles applicable to component-level inverter durability testing.","stream":"◯"},{"id":"209","title":"充給電機能を統合したパワーユニットの巻線切り替えとAC充電の実機検証","author":"梓沢　慶介 ・久保田　芳永・中富　奏明・浅見　記吉・二村　圭哉・轟　拓海・内藤　直也（本田技術研究所）","aff":["本田技術研究所"],"abstract":"電気自動車の電気部品の小型化・低コスト化・高効率化が求められる中，駆動用モータおよびインバータを活用した充給電統合ドライブユニットを検討した．巻線の直列・並列切替により高出力と高効率駆動を両立するとともに，AC充電時のトルクレス化と充電効率の両立が可能であることを示した．","stream":"◯"},{"id":"210","title":"新型中型ピックアップトラック向けBEVパワートレーンシステムの開発","author":"鈴木　隼人 ・前田　健吾・橋本　剛・中村　康一・河森　央光・西川　耕史（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"カーボンニュートラル社会の実現に向け，燃費・排出ガス規制の強化への対応と，お客様の期待を超える魅力的な車両の提供を両立するため，トヨタはマルチパスウェイ戦略を推進している．今回，商用用途を中心に社会を支える中型ピックアップトラックにおけるマルチパスウェイ実現の一環として，オフロード走行に対応したBEVパワートレーンシステムを開発した．","stream":"◯"},{"id":"211","title":"コンパクトSUV向け第3世代100%電動駆動ハイブリッドパワートレインの開発","author":"桐迫　啓誠 ・小林　敦・矢部　拓也（日産自動車）","aff":["日産自動車"],"abstract":"第3世代100％電動駆動ハイブリッドパワートレイン（e-POWER）をコンパクトSUV向けに開発しました．この第3世代ハイブリッドパワートレインにより，トップレベルの静粛性および加速性能と，高速走行域を含めた高い燃費性能を実現しています．","stream":"◯"},{"id":"212","title":"プレミアムミニバンの力強い走りを実現するバッテリ技術の開発","author":"村上　聡 ・本田　崇・坂本　涼・保坂　賢司・石本　昇三・枚田　典彦（日産自動車）・川崎　龍彦・細谷　陽明・關　栄二（ビークルエナジージャパン）","aff":["日産自動車","ビークルエナジージャパン"],"abstract":"日産自動車は，100％電動駆動ハイブリッドシステムを小型車からミニバンへ展開してきた．大型ミニバンへの適用に向けてバッテリーの高出力化が必要となり，新型バッテリセル開発と発熱量・冷却性能のバランス設計により，コスト・重量・耐久性を両立した高出力バッテリーシステムを実現した．","stream":"◯"},{"id":"213","title":"新型 大型ミニバン向け第3世代100％電動駆動ハイブリッドパワートレインの開発","author":"鈴木　伸一 ・吉田　直弘・石崎　晋・小野川　遼（日産自動車）","aff":["日産自動車"],"abstract":"新型の大型ミニバンは，走りの愉しさと乗員の快適性を高次元で両立することを目指して開発した．第3世代の100％電動駆動ハイブリッドパワートレイン（e-POWER）による燃費と静粛性の向上とサイズの大きな車両に対応する新技術の採用により，優れた走行性能，快適性，燃費性能を実現した．","stream":"◯"}]},{"id":137,"title":"MBSE・要求分析・セーフティ","day":15,"room":"中ホールA","start":"9:30","end":"12:10","chair":"座長：後藤　史英（デンソー）","talks":[{"id":"214","title":"MBSEを用いたTHSエンジン起動時振動の制御適合プロセス改善","author":"清水　聡 ・佐川　正記・原　詳太・神長　隆史・末益　賢治・金子　広孝（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"近年の車両動的性能開発では，制御適合の工数増大と手戻りが課題である．本研究ではハイブリッド車の起動時振動を対象にSysMLモデルを構築し，要求・設計要素間の関係可視化と中間状態量に基づく検証を導入することで，原理原則に基づく適合を実現し，手戻り低減と工数削減の有効性を示した．","stream":"◯"},{"id":"215","title":"MBSEと生成AI（LLM）活用によるe-Axleシステム開発の効率化 -（第2報）-","author":"平野　拓朗 ・勝城　勝・川島　一訓・河住　拓郎（ジヤトコ）・片桐　大輝・森長　誠・西村　元一（ストックマーク）","aff":["ジヤトコ","ストックマーク"],"abstract":"既報では，MBSEモデルのナレッジグラフ化と生成AI活用によるe-Axle開発効率化を報告した．一方，ナレッジグラフの維持管理には継続的な更新が課題となる．本講演では，技術報告資料等の非構造化ドキュメントから，AIが情報構造を自動抽出し，グラフを継続的に更新する手法と実践例について報告する．","stream":"◯"},{"id":"216","title":"車両盗難等の物理攻撃に適したリスク評価手法の検討","author":"下川　真季 ・三好　孝典・垣東　和弘・堀端　啓史（住友電気工業）・Bita Mpidi Isaac・Basabe Hugo（Fraunhofer IEM）・Sokoros Ioannis・Moehrle Felix・Schwarz Reinhard（Fraunhofer IESE）・Wagner Eric（Fraunhofer FKIE）","aff":["住友電気工業","Fraunhofer IEM","Fraunhofer IESE","Fraunhofer FKIE"],"abstract":"ISO/SAE21434のリスク評価は車両に対する物理攻撃のリスクを過小評価する傾向がある．本稿では，車両盗難等の攻撃が増加する社会的状況に対応するため，物理攻撃の実現性に着目したリスク評価手法を提案する．また，ソフト対策に加え，物理層セキュリティの重要性を議論し，攻撃の早期発見を目指す．","stream":"◯"},{"id":"217","title":"高レベル自動運転における未知リスクの定量化のためのベイズ的アプローチ","author":"横田　剛典 （NTTデータオートモビリジェンス研究所）","aff":["NTTデータオートモビリジェンス研究所"],"abstract":"高レベル自動運転ではすべてのコンテキストや誘発条件を事前に想定しつくすことが難しく，安全論証において未知のコンテキストや誘発条件によるリスクを適正に推定し許容水準を満たしているかを評価することが求められる．本講演ではベイズ的アプローチによる未知のリスクの評価の方法について具体例を通じて紹介する．","stream":"◯"},{"id":"218","title":"SDVのOTAソフトウェア更新における再認証クレジット配分手法","author":"橋本　直樹 （モンスターラボ）","aff":["モンスターラボ"],"abstract":"SDVのOTA更新は型式認証関連機能を変えうるが，再評価をどれだけ仮想で消化できるかの手法は未確立．本研究は変更影響度分類と仮想証拠信頼性ティアからクレジット配分マトリクスを構成し，L3 ALKS（UN-R157）の60→95km/h ODD拡張に適用，仮想消化率と実車残存試験を導出する．","stream":"◯"},{"id":"219","title":"UN-R.156-01改正におけるRXSWIN要件の解説","author":"榎本　恵 ・新国　哲也（自動車技術総合機構）","aff":["自動車技術総合機構"],"abstract":"2021年のUN-R156ソフトウェアアップデート法規制定により，使用過程車へのソフトウェア更新による機能追加や変更が可能となった．更新後の基準適合性確認方法は日欧で異なり，欧州方式ではRXSWINを照合する．2025年のUN-R156-01改定の内容とその背景を解説し，今後の運用課題を考察する．","stream":"◯"}]},{"id":138,"title":"高齢ドライバII","day":15,"room":"中ホールB","start":"9:30","end":"10:45","chair":"座長：竹本　雅憲（成蹊大学）","talks":[{"id":"220","title":"高齢ドライバにおけるオンライン運転適性診断と実車運転評価の関連 -（49）運転寿命延伸を目指したドライバ運転特性研究-","author":"伊藤　倫 ・谷口　俊治・青木　宏文（名古屋大学）","aff":["名古屋大学"],"abstract":"高齢ドライバを対象に，オンライン運転適性診断で得られた握力・TMT・MVT・HP等の各指標と実車運転評価との関連を検討した．一定の限界を踏まえつつも，運転適性検査の受検につながる簡易評価手法としての可能性を示す．","stream":"◯"},{"id":"221","title":"ハンドル・ペダルの操作連携の不適合に起因する操作ミスの発生メカニズムの検討","author":"加藤　由衣 ・平松　真知子・中山　友香・海老名　亮彦（日産自動車）・上出　直人・安藤　雅峻（北里大学）・高松　敦（日産自動車）","aff":["日産自動車","北里大学"],"abstract":"高齢運転者に多い操作ミスの発生メカニズム解明のため，車線逸脱や踏み間違いによる事故映像を分析した結果，旋回時のハンドル・ペダル操作連携のタイミングおよび量の不適合が一因と示唆された．そこで操作連携の能力を評価する操作課題を作製し，不適合に関連する身体・認知特性および操作行動の特徴を明らかにした．","stream":"◯"},{"id":"222","title":"白内障傾向が薄暮・夜間走行時の運転行動に及ぼす影響","author":"平松　真知子 ・川野　勉・伊藤　勇希・早川　雄己・高松　敦（日産自動車）・川守田　拓志（北里大学）","aff":["日産自動車","北里大学"],"abstract":"白内障は多くの高齢者にみられ，低コントラストやグレア環境で視力を低下させる．本研究は，白内障による運転への影響を明らかにするため，ドライビングシミュレータで薄暮・夜間の運転行動を測定し，水晶体混濁との関係を分析した．その結果，水晶体混濁のある者は右折時に補償行動を示し，表示読み取りに遅延がみられた．","stream":"◯"}]},{"id":139,"title":"ガソリン燃焼","day":15,"room":"特別会議場","start":"9:30","end":"12:10","chair":"座長：葛西　理晴（日産自動車）","talks":[{"id":"223","title":"燃費・排ガス向上に向けた燃焼室壁温推定に基づく噴射制御合理化","author":"森岡　竜太郎 ・安達　龍・津田　雄史・志村　進・篤　幸太郎（SUBARU）","aff":["SUBARU"],"abstract":"冷却水温で制御されたEV走行後のエンジン再始動時は，筒内状態のばらつきが大きく，排ガス・燃費への影響が課題である．本研究では壁温センサ搭載車で計測を行い噴射量低減効果を確認するとともに，既存パラメータから壁温を推定するAIモデルを構築し，制御適用の可能性を示した．","stream":"◯"},{"id":"224","title":"自動車内燃機関における低計算コストかつ高忠実なLarge Eddy Simulationのための数値手法の検討","author":"八百　寛樹 （菱友システムズ）・伊藤　貴之（日本自動車研究所）・高林　徹（本田技術研究所）","aff":["菱友システムズ","日本自動車研究所","本田技術研究所"],"abstract":"自動車内燃機関開発を取り巻く事情は複雑の一途をたどる中，開発ツールの1つであるCFDの低コスト化および予測精度向上が求められている．著者らはその要請に対して，Cell-Based AMRと高精度離散化手法を採用したCFDコードの研究開発を実施している．本稿ではその取り組みを計算例を交えて紹介する．","stream":"◯"},{"id":"225","title":"単一スロットル方式多気筒エンジン用吸気コレクタ形状に関する基礎検討 -非定常流体解析による吸入空気量分配特性の評価-","author":"高山　拓武 ・小清水　健真・笠松　忍・呉　文宝（東海大学大学院）・小川　和輝（愛知工科大学）・成田　正敬・加藤　英晃（東海大学）","aff":["東海大学大学院","愛知工科大学","東海大学"],"abstract":"著者らは小型競技車両に搭載可能な多気筒ガソリンエンジンの性能向上に関して継続的に研究を行なっている．本報告はエアリストリクタを装着した吸気口からシリンダまでの吸気形状において，吸気コレクタの形状に着目し，形状の評価に非定常流体解析を用いて吸入空気量分配特性に与える影響について基礎的検討を行った．","stream":"◯"},{"id":"226","title":"希薄燃焼火花点火機関における未燃炭化水素生成・排出挙動の実験解析","author":"川口　翔矢 ・窪山　達也・森吉　泰生（千葉大学）","aff":["千葉大学"],"abstract":"希薄燃焼の実用化における課題の一つである未燃炭化水素の生成要因を明らかにし，ガソリンエンジンの熱効率向上手法を提案することを目的として，高速FIDやNDIRを含む排気ガス分析計，熱流束センサ，およびCN燃料として期待されるエタノール混合燃料を用いて，燃焼特性および未燃炭化水素の生成・排出挙動を解析した．","stream":"◯"},{"id":"227","title":"高効率PFIリーンバーンエンジンの開発（第1報）","author":"渡邉　和成 ・永野　幸秀・正月　宏明・奥井　和仁・佐田　景一・草塲　耕佑・櫻木　章樹・島　祐太・内藤　一哉・江原　達哉（ダイハツ工業）","aff":["ダイハツ工業"],"abstract":"CN貢献に向け，コンパクトカー用の良品廉価なPFIリーンバーン（λ≥2）ガソリンエンジンの開発を進めている．燃焼室形状の設計検討等により筒内流動を改善し安定した高速燃焼を実現したことで，最大でλ=3付近まで運転可能となった．中-低速回転数の広範囲において図示熱効率45%以上，低NOx排出を達成した．","stream":"✕"},{"id":"228","title":"リーンバーンSIエンジンを搭載したハイブリッド車両におけるORC-TEG複合廃熱回収システムの検討","author":"成毛　政貴 ・北村　高明（日本自動車研究所）","aff":["日本自動車研究所"],"abstract":"ハイブリッド車両の更なる燃費向上には廃熱の有効利用が重要となる．本研究では，空気過剰率2.0以上の希薄条件で運転可能なSIエンジンを搭載したハイブリッド車両を対象に，エンジン冷却系を含む有機ランキンサイクルと熱電発電装置を組み合わせた廃熱回収システムについて，その効果を数値シミュレーションにより評価した．","stream":"◯"}]},{"id":140,"title":"自動運転と制御I","day":15,"room":"204","start":"9:30","end":"11:35","chair":"座長：加藤　晋（産業技術総合研究所）","talks":[{"id":"229","title":"1次元位置フィードバック下における車両ナビゲーション -特殊螺旋曲線法-","author":"王　威・ 中野　公彦 （東京大学）","aff":["東京大学"],"abstract":"本研究では，1次元位置のみが観測可能で，特殊螺旋曲線を活用した新たな車両ナビゲーション手法を提案する．提案手法を実車実験およびシミュレーションを通じて検証し，その有効性を確認するとともに，従来手法と比較して走行時の経路追従性能が向上し，経路偏差を効果的に低減できることを示した．","stream":"◯"},{"id":"230","title":"E2E自動運転MBDに向けたフォトリアルシミュレーション基盤の開発","author":"仲村　佳悟 ・横山　美優（アイシン）","aff":["アイシン"],"abstract":"CGベースの自動運転シミュレーションは，実映像とのドメインギャップや高い構築コストが課題である．本研究では3次元ガウシアンスプラッティングと車両モデルを同時にシミュレーションすることで，フォトリアル性と車両運動の正確性を両立したシミュレーション基盤を構築し，評価を行った．","stream":"◯"},{"id":"231","title":"自動運転における対向車遮蔽歩行者の検出検証と仮想長焦点カメラを用いた遠方認識の改善","author":"王　奕童 ・繆　継樹・服部　倖也・平川　翼・山下　隆義・藤吉　弘亘（中部大学）","aff":["中部大学"],"abstract":"自動運転の安全向上に向け，遠方の物体に対する検出精度を向上させるために，従来のカメラ視点とともに遠方領域をフォーカスした視点を併用するMulti-View BEVFormerを提案する．本手法の有効性を評価した結果，従来手法では検出が困難な100m先の物体も高精度に検出できることを実証した．","stream":"◯"},{"id":"232","title":"インフラ協調自動運転システムの車両検査ライン導入におけるLiDAR認識の活用と自動検査","author":"穗積　伸哉 ・狩野　岳史・岡元　裕生・永渕　雄平・岩堀　健人・岩崎　典継・澤野　拓朗・岸岡　悠太（トヨタ自動車）・高田　誠也・東　謙太（デンソー）","aff":["トヨタ自動車","デンソー"],"abstract":"労働力不足の課題解消と車両工場の生産性向上のため，インフラ協調自動運転システムを開発している．人や設備との共存空間や外乱のある環境において，従来のカメラに替えて，高精度LiDARを用いた自己位置推定と物標検知の機能を開発した．さらに精緻な車両制御による自働検査の可能性について検討を進めている．","stream":"✕"},{"id":"233","title":"Tightly Coupled LiDAR-IMU-Odometry Fusion with Continuous-Time Trajectory Representation for Robust Ego-Vehicle Localization","author":"Naoki Akai ･Yasuhiro Akagi･Takayuki Morikawa (Nagoya University)","aff":["Nagoya University"],"abstract":"LIO can be used with only a LiDAR and an IMU, while odometry, which represents vehicle motion characteristics, is effective for improving robustness in vehicle applications. This presentation describes a robust vehicle localization technique that extends conventional discrete-time state estimation systems to continuous-time state estimation systems, enabling seamless fusion of LiDAR, IMU, and odometry according to their respective characteristics.","stream":"◯"}]},{"id":141,"title":"自動運転と制御II","day":15,"room":"204","start":"12:45","end":"14:50","chair":"座長：大前　学（慶應義塾大学）","talks":[{"id":"234","title":"Bird's Eye View認識システムと地図を連携した自動運転の開発","author":"久保田　健斗 ・小山　哉・石井　一貴・迫川　海翔・高尾　英行（SUBARU）","aff":["SUBARU"],"abstract":"自動運転の周辺車センシングとしてBird'sEyeView認識と地図を連携したシステムを構築した．周辺車と自車制御を協調させるには周辺車の行動予測が重要である．周辺車を地図に統合し，道路構造や接続関係を踏まえて周辺車挙動を予測する地図連携認識技術を開発した．自動運転における本技術の効果を報告する．","stream":"◯"},{"id":"235","title":"GameFormerによる車両間相互作用予測と走行計画の統合フレームワーク","author":"三輪　真也 ・伊藤　章（愛知工業大学）・金城　健（デンソー）","aff":["愛知工業大学","デンソー"],"abstract":"自動運転におけるプランニングでは，多数の交通参加者による相互作用により，扱う状態次元数が増大し，モデルベース手法のみでは取り扱いが困難である．そこで本研究では，車両軌跡と地形情報から車両間の相互依存を考慮した軌道を予測するGameFomerとモデルベース走行計画を統合したプランニング手法を提案する．","stream":"◯"},{"id":"236","title":"組合せ最適化を用いた高速道路合流計算における監視機能導入による計算コスト削減効果の検証","author":"髙橋　隆志 （ミライズテクノロジーズ）・大矢　晃示（デンソー）・松浦　甲汰・山本　賢伸（ミライズテクノロジーズ）","aff":["ミライズテクノロジーズ","デンソー"],"abstract":"ミライズテクノロジーズは高速道路の合流シーンにおいて組合せ最適化を用いた軌道計画手法を自技会に報告してきている．26年度春季大会においては実データにおけるSIMの合流比較などを示した．本発表では，合流計画計算に監視機能を導入し，計画計算の回数を抑えることで計算コスト削減ができたことを報告する．","stream":"◯"},{"id":"237","title":"合流判断閾値の動的調整を伴う渋滞時の自律合流システムの開発","author":"岩佐　拓未 ・禹　ハンウル（工学院大学）","aff":["工学院大学"],"abstract":"本研究では，人間ドライバの運転行動を模倣した判断アルゴリズムを用い，渋滞時の自動運転車の自律的な合流を実現する．交通流データに基づき再現したシミュレーション環境において，本線車両の速度や車間距離などの挙動に応じて合流判断の閾値を動的に調整することで，固定閾値では困難な柔軟な合流判断を可能とした．","stream":"◯"},{"id":"238","title":"運転シミュレータを用いたインタラクティブな低速直角合流行動の解析とモデル化","author":"畔柳　蓮 ・石黒　達也・奥田　裕之（名古屋大学）・富永　健太（三菱電機）・鈴木　達也（名古屋大学）","aff":["名古屋大学","三菱電機"],"abstract":"本研究では，駐車場から道路本線への低車速かつ直角な合流を対象に，人間ドライバーの行動解析とモデル化を行う．ドライビングシミュレータによる観測実験から，停止線付近での微小な前進挙動「にじり出」に着目し，人間の合流判断を複数状態の遷移として表現する推定モデルを提案する．","stream":"◯"}]},{"id":142,"title":"HMI I","day":15,"room":"206","start":"9:30","end":"11:35","chair":"座長：平岡　敏洋（日本自動車研究所）","talks":[{"id":"239","title":"運転経験を考慮したHUDを用いた注意喚起提示法の効果評価","author":"福田　悠人 （群馬大学）・香西　俊彦・岩瀬　勉（群馬大学／SUBARU）・後藤　育郎・鳥居　武史・三国　司（SUBARU）","aff":["群馬大学","群馬大学／SUBARU","SUBARU"],"abstract":"運転者がヘッドアップディスプレイによる注意喚起提示から受ける効果を評価した．特に運転者の運転経験に注目して，提示効果に違いがあるかを調査した．運転経験の異なる実験参加者群に対して提示効果を評価する官能評価実験を実施した．実験の結果，提示条件や運転経験の差で官能評価や車両制御結果に有意差が確認された．","stream":"◯"},{"id":"240","title":"自動運転マーカーランプの昼夜の見え方に関する屋外評価実験（第3報） -ランプを車両後面信号灯火の近傍に取付けた場合-","author":"阿部　晃大 ・加藤　洋子・飯塚　達也・関根　道昭・青木　義郎（自動車技術総合機構）","aff":["自動車技術総合機構"],"abstract":"国連WP29にて自動運転中に点灯させる「自動運転マーカーランプ」の要件が議論されている．本研究では，2025年にGREへ提出された規則案を参考に製作したブルーグリーン色の評価用ランプを車両後面に設置し，光度や面積等を変化させた際の当該ランプや他の信号灯の見え方を調査する実験を，昼夜の屋外環境下で実施した．","stream":"◯"},{"id":"241","title":"認知しやすいアイコンシンボルの要件","author":"宮下　由佳 （日産自動車）","aff":["日産自動車"],"abstract":"自動車のスイッチや表示のアイコンシンボルはユーザーに操作方法や表示の意味を伝える役割を担っている．特に説明なしでも理解しやすいものも多いが，高機能・複雑化する自動車内のアイコンシンボルをわかりやすく設計するため，身の回りにある公共交通機関の案内や家電・機器の表示などを参考にして哲学の観点で考察した","stream":"◯"},{"id":"242","title":"二輪車前方衝突警告HMIにおける視覚・聴覚刺激への反応特性の定量評価手法の提案","author":"山本　貴登 ・鈴木　桂輔（香川大学）・竹村　直敏・李　柱衡・南　智貴（本田技術研究所）","aff":["香川大学","本田技術研究所"],"abstract":"二輪車特有の運転環境を考慮した前方衝突警報HMIの評価手法を開発した．従来のDS評価を心理学実験手法に代替し，適切な認知負荷を付与しつつ呈示条件を統制して，視覚・聴覚警告への反応を計測した．被験者30名の実験により，統計的な比較に十分なデータを取得でき，既存知見と整合する妥当な結果を得た．","stream":"◯"},{"id":"243","title":"高齢運転者とのco-designによるポータブル型ドライビングシミュレータのデザイン検討","author":"江　林京 ・吉原　佑器・Nihan Karatas・原田　あすか・金森　等・田中　貴紘（名古屋大学）","aff":["名古屋大学"],"abstract":"本研究では，高齢運転者がVR型と物理ペダルを組み合わせたDS，物理ペダル型，デジタルペダル型，タッチ操作型の4種類のポータブルDSを体験し，グループディスカッションを通じて各方式の利点と課題を整理した．受容性，操作の分かりやすさ，身体的負担，携帯性のバランスを高齢運転者の視点から検討し，再デザイン方針を整理した．","stream":"◯"}]},{"id":143,"title":"車両運動IV","day":15,"room":"206","start":"12:35","end":"14:40","chair":"座長：山門　誠（神奈川工科大学）","talks":[{"id":"244","title":"前後輪駆動力配分制御に基づく車両全体の接線力最大化の検討","author":"秋山　峰 ・横倉　勇希・大石　潔（長岡技術科学大学）・福井　順一・龍田　建太・今村　泰理・望月　浩孝（マツダ）","aff":["長岡技術科学大学","マツダ"],"abstract":"多様に変化する路面とタイヤの関係に対し，車両全体で見た接線力の和を適切に維持することは安全性・操作性の面で重要である．前後輪が別個に駆動するAWD車は，駆動力の前後配分比という自由度がこの目標に寄与しうる．本研究ではAWD車を制御対象とし，接線力の和を最大化する駆動力配分制御法について検討する．","stream":"◯"},{"id":"245","title":"次世代道路交通安全に向けた路面摩擦情報に関する研究 -測定手順と精度を向上させるための新システム構築-","author":"景山　一郎 （先進路面摩擦データベース研究組合）・渡辺　淳士・栗谷川　幸代・原口　哲之理（日本大学）・金子　哲也（大阪産業大学）・西尾　実（アブソリュート）","aff":["先進路面摩擦データベース研究組合","日本大学","大阪産業大学","アブソリュート"],"abstract":"自動操縦やADAS搭載車の安全性向上には路面摩擦情報が重要となり，特に冬季雪氷路等におけるこれらの情報は必須と考えられる．我々は，これら路面摩擦情報を継続的に計測してきたが，広範囲計測に向け計測の簡素化と精度向上に向けた新たな計測システムの構築を行なった．本発表では装置概要と計測結果例について示す．","stream":"◯"},{"id":"246","title":"モーター駆動系振動に基づくグリップ余裕度および路面μ推定","author":"小野　英一 ・米澤　紀男（豊田中央研究所）・小薮　忠勝（デンソー）","aff":["豊田中央研究所","デンソー"],"abstract":"車輪速度に現れる共振現象は，路面摩擦状態に応じて変化する．この特性を利用することでグリップ余裕度や路面摩擦係数（μ）の推定が可能となる．本稿では，モーター駆動車両のドライブシャフト共振現象を利用した推定手法を提案する．さらに，路面μが管理されたテストコースにおいて，路面μ推定の実験検証を行う．","stream":"◯"},{"id":"247","title":"トレッドブロック単位走査による据え切り時におけるタイヤ接地面内三分力分布の計測","author":"酒井　智紀 （本田技術研究所）・松原　真己・清水　柊斗（早稲田大学）","aff":["本田技術研究所","早稲田大学"],"abstract":"据え切り時にはタイヤ接地面内に大きなせん断変形が生じ，トレッドブロックと路面との間に複雑な摩擦力分布が形成される．本研究では，据え切り時におけるタイヤ接地面内の力学挙動を明らかにすることを目的として，トレッドブロック単位で接触力を計測可能な走査型計測手法を提案した．","stream":"✕"},{"id":"248","title":"軸力0Nにおけるホイールナットの緩み進展挙動","author":"河野　隆修 ・岡本　絢子・木村　優介（SOKEN）・辻　隆弘・木村　陽介（トヨタ自動車）・鈴木　萌（SOKEN）","aff":["SOKEN","トヨタ自動車"],"abstract":"タイヤ脱落事故防止に向けて，締結軸力消失後の緩みの進展は未解明である．本研究ではタイヤ試験機を用い，軸力0N後のナット挙動を計測した．荷重を受けないナットがタイヤ回転に伴いホイール穴と接触・離脱を繰り返すことで，ナットに回転の力が作用することが，緩み進展の一因となる可能性を示した．","stream":"◯"}]},{"id":144,"title":"自動車用材料IV","day":15,"room":"207","start":"9:30","end":"10:45","chair":"座長：長谷川　誠（横浜国立大学）","talks":[{"id":"249","title":"鋼／アルミ異材スポット溶接接手の強度特性 -（第2報）疲労強度に関する調査-","author":"各務　綾加 ・相本　光宏・梅野　栄介（トヨタ自動車）・松岡　秀明・尼子　龍幸（豊田中央研究所）","aff":["トヨタ自動車","豊田中央研究所"],"abstract":"鋼板とアルミ合金のスポット溶接では，接合界面に生成される金属間化合物が接合強度と密接に関係することが知られている．本報では，鋼板とアルミ合金板のスポット溶接において，金属間化合物の脆さを克服する目的で突起状組織を形成した溶接継手を製作し，疲労強度について調査した．","stream":"✕"},{"id":"250","title":"応力集中部を有するステンレス鋼薄板の疲労におけるコーキシング効果","author":"王　暁光 （東京濾器）","aff":["東京濾器"],"abstract":"ステンレス鋼薄板の応力集中部の疲労挙動を調査し，コーキシング効果が疲労限度に与える影響を明らかにした．ヒステリシスループや疲労線図から，応力比や応力振幅によるき裂の発生・進展の違いを観察し，き裂の伝播や破壊のメカニズムの解明を行った．コーキシング効果はき裂の停留や疲労寿命を左右する重要な要因であった．","stream":"◯"},{"id":"251","title":"A Study on Optimization of Two stage rolling process to Improve formability and Reduce springback of Pure titanium thin sheet for Fuel cell Separator","author":"Jaebong Park ･Sunghwan Kim (Hyundai Motor)","aff":["Hyundai Motor"],"abstract":"It was confirmed to improve the formability and reduce springback of titanium for separators through a two-stage rolling process with intermediate annealing. The effect of rolling texture dispersion due to inducing twin was verified. In addition, the analysis of rolling texture, grain, mechanical properties and springback was conducted based on the number of rolling stage, thickness reduction ratio, final annealing temperature and time. Through these results, the optimal two-stage rolling process that can improve formability and reduce springback were derived.","stream":"◯"}]},{"id":145,"title":"生産・製造","day":15,"room":"207","start":"11:45","end":"13:25","chair":"座長：小澤　信司（日野自動車）","talks":[{"id":"252","title":"塗布型補剛材による外板パネル歪の予測技術の検討","author":"岩間　隆史 ・大西　洋一郎・新宮　豊久（JFEスチール）・本田　彩夏・三井　雄二郎（SUBARU）","aff":["JFEスチール","SUBARU"],"abstract":"外板パネルの張り剛性向上を目的に塗布型補剛材の適用が検討されている．塗装焼付け時に，収縮によりパネルに生じる歪が課題である．実車適用の際，歪の無い適正な塗布サイズ（幅，厚み）の把握が必要だが，パネル歪の予測手法が無い．実車ドアの試作を通じ，補剛材の熱処理過程の物性変化反映により予測精度向上を見出した．","stream":"◯"},{"id":"253","title":"アルミニウム合金溶接継手における単一ブローホールのサイズおよび断面内位置が応力状態に及ぼす影響の調査","author":"宅野　聡悟 ・新里　映太・大竹　和実・菅井　友駿・西川　幸治（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"近年，自動車車体の軽量化を目的としてアルミニウム合金の適用が拡大している．アルミニウム合金溶接継手では，母材に比べて溶接ビード部の強度が低くなる場合が多く，溶接部が構造上の弱点となりやすい．このため，製造過程で発生するブローホールなどの欠陥が継手強度に及ぼす影響が顕在化しやすく，品質安定化の観点から重要な課題となっている．従来はブローホール径や気孔率に着目した評価が主流であったが，同一サイズであっても断面内位置により応力状態が異なるため，サイズと位置の組合せが強度へ及ぼす影響を定量的に整理する必要がある．本研究では，アルミ溶接継手を対象として，単一ブローホールのサイズおよび断面内位置がき裂起点部の応力状態へ及ぼす影響を検討した．有限要素法による線形解析を用いてブローホール径および断面内位置を変化させた解析モデルを作成し，き裂起点部に発生する応力との関係を整理した．さらに，多数の条件を効率的に評価するため，解析結果を用いて機械学習を適用し，ブローホールのサイズおよび位置が応力上昇に及ぼす影響傾向を分析した．また，ドリル加工により人工欠陥を導入した試験片を用い，静的強度および疲労強度試験を実施し，前述のCAEを裏付けるデータを取得した．欠陥サイズよりも位置の寄与が大きいことを明らかにし，サイズと位置を組み合わせて整理することで，単一ブローホールが強度へ及ぼす影響をより体系的に評価できる可能性を示した．本研究は，アルミ溶接部におけるブローホール影響評価の高度化に資するものであり，溶接部設計および品質検討段階における指標整理に有用である．","stream":"✕"},{"id":"254","title":"塗装乾燥工程におけるドア変形予測技術構築の取組み","author":"庄山　和輝 （トヨタ車体）・竹添　慎一（トヨタ車体研究所）","aff":["トヨタ車体","トヨタ車体研究所"],"abstract":"車両を製造するなかで，ボデーとドアの建付けは外観品質を確保するための重要な管理項目である．影響因子である塗装乾燥工程の前後でドア形状が変化してしまう現象（ヘムずれ）に関して，コンポーネント評価を活用した発生メカニズムの検証とシミュレーションを用いた予測技術の構築を行ったので紹介する．","stream":"✕"},{"id":"255","title":"e-Axle用大径インターナルギヤの低ひずみ工法の開発","author":"大川　雄大 ・加藤　豪・前田　誠（ジヤトコ）・梅原　崇秀・出口　拓海（日本製鉄）","aff":["ジヤトコ","日本製鉄"],"abstract":"駆動系歯車は熱処理により強度と耐摩耗性を得るが，熱処理歪みによる変形を矯正する必要がある．特に中空構造の遊星歯車用インターナルギヤは変形が著しい．そこで，高強度と低歪みを両立する材料および工法の組み合わせを開発した．本手法により，矯正工程を省略しつつ高精度な歯車の製造が可能となる．","stream":"◯"}]},{"id":146,"title":"排気後処理III","day":15,"room":"小ホール","start":"9:30","end":"11:10","chair":"座長：松岡　幹泰（デンソー）","talks":[{"id":"256","title":"排気脈動制御による触媒浄化性能の向上","author":"江崎　孝志 ・本田　千恵・杉原　申也（三五）","aff":["三五"],"abstract":"エンジンが高負荷運転する時は，大流量のため触媒での排出ガスの流速が大きく，浄化性能が低下する．本研究ではエンジンの排気脈動に注目し，流速変動を低減することで浄化性能を向上させた．触媒位置での速度変動の制御は，触媒より下流に搭載されたマフラの内部構造を変更することで行った．","stream":"◯"},{"id":"257","title":"データ駆動型モデルによるモーダルEMの高精度予測","author":"酒井　康平 ・荒木　崇至・長野　高皓・河野　通治（マツダ）","aff":["マツダ"],"abstract":"自動車開発において，排出ガス（EM）規制強化に伴う車両全体での機能配分の需要に対し，高速かつ高精度な机上でのEM予測技術の構築が求められる．それに対し本研究では，定常性能マップと過渡補正AIを組みあわせたデータ駆動型モデルを提案し，仕様変更を伴う新機種でのモーダルEM予測技術を構築した．","stream":"◯"},{"id":"258","title":"詳細な表面反応を考慮したPd系三元触媒の数値熱流体解析 -触媒層物質輸送の影響-","author":"井上　敬太 ・小田　颯一郎・青山　颯汰・草鹿　仁（早稲田大学）","aff":["早稲田大学"],"abstract":"排ガス浄化の高効率化に向け，触媒層内のガス拡散が浄化性能に及ぼす影響の定量評価が求められている．本研究では，上層に不活性層を設けたPd三元触媒の試験と，細孔物性に基づく1+1Dモデル解析を比較した．結果，本モデルは浄化挙動を再現し，高温域では拡散律速により反応が表層に集中することを明らかにした．","stream":"◯"},{"id":"259","title":"連通孔付与TWC凝集体の構造・分子拡散特性に基づく粒子設計","author":"千本　隆汰 ・渡邉　摩理子（上智大学）・花村　克悟（科学技術振興機構）","aff":["上智大学","科学技術振興機構"],"abstract":"サブミクロンスケールの連通孔を有するナノスケール粒子凝集体由来の多孔質三元触媒について，拡散シミュレーションにより拡散係数を算出し，簡易多孔質モデルとして粒子層解析に適用した．流動・拡散および反応解析から，連通孔構造と粒子積層構造が反応率に与える影響を整理し，反応促進に寄与する因子を特定した．","stream":"◯"}]},{"id":147,"title":"自転車・歩行者","day":15,"room":"小ホール","start":"12:10","end":"14:15","chair":"座長：平澤　順治（茨城工業高等専門学校）","talks":[{"id":"260","title":"VRシミュレータ実験を用いた緊急時における自転車乗員の回避行動の分析","author":"佐野　広弥 ・趙　雨晴（名古屋大学）","aff":["名古屋大学"],"abstract":"自転車関連死亡・重傷事故の多くは，四輪車との出会い頭衝突事故である．本研究では，VR自転車シミュレータを構築し，四輪車の飛び出しを模擬した実験を実施した．自転車乗員の運転特性および緊急時における回避行動を計測し，衝突回避の成否に影響を与える挙動特性を分析した．","stream":"◯"},{"id":"261","title":"無信号交差点におけるサイクリストの加減速判断に基づく速度決定モデルの構築","author":"脇坂　龍 ・山口　拓真・伴　和徳（トヨタテクニカルディベロップメント）・奥田　裕之・鈴木　達也（名古屋大学）","aff":["トヨタテクニカルディベロップメント","名古屋大学"],"abstract":"自転車はルール認識の曖昧さ等により多様な動きをするため，自転車の動きをモデル化したシミュレーションは自動運転等の安全評価において非常に重要である．本研究では，無信号交差点における左折巻き込みシーンを対象に，自転車シミュレータを用いて計測したデータからサイクリストの速度決定モデルの構築・評価を行った．","stream":"◯"},{"id":"262","title":"後方接近車両との相互作用を考慮したサイクリストの追い越し判断モデルの提案","author":"小栗　漱也 （名古屋大学）・脇坂　龍（トヨタテクニカルディベロップメント）・奥田　裕之・鈴木　達也（名古屋大学）・山口　拓真・伴　和徳（トヨタテクニカルディベロップメント）","aff":["名古屋大学","トヨタテクニカルディベロップメント"],"abstract":"歩車混在空間において，他車両との相互作用がサイクリストに与える影響の考慮は重要である．本研究は，サイクリストが前方の自転車を追い越す行動に着目し，後方接近車両も考慮した追い越し判断モデルを構築する．予備動作を含むLSTMによる意思推定と追い越し実行判断の2段階でモデル化し，その有効性を検証する．","stream":"◯"},{"id":"263","title":"車両減速挙動に対する歩行者の譲り認識およびそのモデリング -初速度，減速度，減速開始位置に基づく分析-","author":"府川　寿紗 ・吉川　大貴（慶應義塾大学大学院）・中島　航・藁谷　剛司（スタンレー電気）・大門　樹（慶應義塾大学）","aff":["慶應義塾大学大学院","スタンレー電気","慶應義塾大学"],"abstract":"無信号横断歩道を再現したVR実験では車両の減速挙動に対する歩行者の譲られた判断に与える影響や譲り意図認知過程を検討した．実験変数として車両の初速度，減速開始位置，停止位置および昼夜環境を操作した．判断時間および心理的側面の観点から分析し，車両挙動が歩行者の認知・判断プロセスに与える影響を報告する．","stream":"◯"},{"id":"264","title":"夜間歩行者事故の削減に向けたパターニング前照灯の効果","author":"飯塚　達也 ・加藤　洋子・青木　義郎・関根　道昭（自動車技術総合機構）・河村　和幸・忍田　圭（本田技術研究所）","aff":["自動車技術総合機構","本田技術研究所"],"abstract":"夜間の対歩行者事故低減に向け，前照灯によるダイヤモンド型パターン照射の効果を実車走行実験により評価した．運転者を想定した評価では歩行者の視認距離，歩行者を想定した評価ではスマートフォン操作中の注意分散状態における車両の視認距離を計測し，従来の走行用及びすれ違い用前照灯と比較した．","stream":"◯"}]},{"id":148,"title":"ドライバの安全行動II","day":16,"room":"大ホール1","start":"9:30","end":"11:10","chair":"座長：木戸　晶洋（科学警察研究所）","talks":[{"id":"265","title":"ドライバの脳活動差が及ぼす左右カーブの認知と運転操作への影響","author":"小川　令恩 ・橋本　幸二郎・篠原　菊紀（公立諏訪東京理科大学）・牧田　匡史（帝京大学）・國行　浩史（公立諏訪東京理科大学）","aff":["公立諏訪東京理科大学","帝京大学"],"abstract":"本研究では左右カーブに対するドライバの脳活動と運転能力優劣の関係をドライビングシミュレータによる実験から分析した．その結果，左右カーブ共に右側の前頭前野が活性化しているとカーブの逸脱量が少ないことがわかった．さらに，右カーブでは右側の前頭極の活性化が高い方がカーブ逸脱量は少ないことがわかった．","stream":"◯"},{"id":"266","title":"信号無視事故を引き起こす要因の分析","author":"國行　浩史 ・大島　俊哉・鈴木　銀平（公立諏訪東京理科大学）","aff":["公立諏訪東京理科大学"],"abstract":"本研究は市街地において信号無視事故が多発している地点の調査を行い，事故要因の分析を行った．その結果，多発地点は信号機間隔が短く，また先に大きな交差点があることがわかった．信号機間隔が短いと同一交差点として誤認識され易く，大きな交差点に気を取られ手前の交差点を見落とししてしまうことが要因と考える．","stream":"◯"},{"id":"267","title":"ドライビングシミュレータを用いた属性別ドライバモデルの開発 -（第1報）：コーナー走行時のドライバモデルの作成とその応用-","author":"杉浦　真吾 （トヨタシステムズ）","aff":["トヨタシステムズ"],"abstract":"ドライビングシミュレータを用いて被験者の曲線走行時の特徴量の計測を実施し，その特徴量を年齢等で分類し属性別のドライバモデルの構築を行った．仮想ADASの設定をある属性向けとなるように今回作成したドライバモデルを使ってパラメタの調整を行うことで属性別のドライバモデルの妥当性検証を実施した．","stream":"◯"},{"id":"268","title":"機械学習によるペダル操作予測結果の解釈のためのドライバ操作の変動の評価","author":"松本　昂洋 ・大貫　正明・廣瀬　敏也（芝浦工業大学）","aff":["芝浦工業大学"],"abstract":"ペダル踏み間違い検知に向け，機械学習によるペダル操作予測の活用が検討されている．一方，ドライバの操作は確率的に変動する．そのため，予測モデルの評価では，モデル性能と確率的変動の両者を考慮する必要がある．本研究では，同一条件下の操作ばらつきを定量評価し，予測誤差を解釈する基礎的指標を検討する．","stream":"◯"}]},{"id":149,"title":"ドライバ特性","day":16,"room":"大ホール1","start":"12:10","end":"13:25","chair":"座長：安藤　貴史（産業技術総合研究所）","talks":[{"id":"269","title":"運転者の行動圏と年齢・移動手段・居住地域の関係 -新潟県の物損事故データを運転者の移動行動の標本として活用した分析-","author":"西木　教智 ・小菅　英恵・田久保　宣晃（交通事故総合分析センター）","aff":["交通事故総合分析センター"],"abstract":"本研究では，物損事故データを運転者の移動行動の標本として解釈し，自宅から事故現場までの距離を代理指標として運転者の行動圏の分析を行った．個人属性及び事故発生状況を説明変数として重回帰分析を適用した結果，行動圏の年齢に伴う3段階の変化や，移動手段及び居住地域別における差異が示唆された．","stream":"◯"},{"id":"270","title":"交差点通過時の運転挙動に基づく熟練度評価指標の探索","author":"村上　拓也 （三菱電機）・松木　裕二（福岡工業大学）・明神　貴羅（三菱電機モビリティ）・小島　太一・表　朝子・中村　雄大（三菱電機）","aff":["三菱電機","福岡工業大学","三菱電機モビリティ"],"abstract":"日常の運転習慣を簡易に評価するため，探索的研究を実施した．熟練運転者と運転初心者を対象にシミュレータを用い，見通しの良さに差がある交差点通過時の運転挙動を比較した結果，一時停止の順守状況と左右確認行動に差がみられた．これらの差は，運転時の安全確認習慣の有無に起因する可能性があるため，報告する．","stream":"◯"},{"id":"271","title":"運転初心者における振り返り映像視聴と肯定的な自己評価が不安感情に与える影響","author":"吉田　創 ・中江　陸人（京都工芸繊維大学大学院）・西崎　友規子（京都工芸繊維大学）","aff":["京都工芸繊維大学大学院","京都工芸繊維大学"],"abstract":"運転初心者が苦手とする運転場面での不安軽減を目的に，自身の運転の映像視聴や肯定的な自己・他己評価による振り返りの効果を，合流場面において検討した．また，交通状況の複雑さが，それぞれの振り返り手法における不安軽減量に与える影響を検討した．主観・生理指標による不安軽減評価の他に運転行動の変化も評価した．","stream":"◯"}]},{"id":150,"title":"運転姿勢","day":16,"room":"大ホール1","start":"13:55","end":"15:35","chair":"座長：平尾　章成（芝浦工業大学）","talks":[{"id":"272","title":"動的および静的ドライビングシミュレータを用いた長時間運転時におけるドライバの着座疲労評価","author":"栗田　皓太 ・増田　大和・早川　聡一郎・池浦　良淳・吉田　俊一（三重大学）・北川　哲也（フォルテック）","aff":["三重大学","フォルテック"],"abstract":"本研究では，動的および静的ドライビングシミュレータを用いてシートモーションの有無が長時間運転時のドライバの着座疲労に及ぼす影響を比較検討することを目的とする．疲労評価には，各種身体状態情報を指標とする客観評価，アンケートによる主観評価を用いた．各指標を比較し，疲労の差異について明らかにする．","stream":"◯"},{"id":"273","title":"座面・背面反力を考慮した腰部負担推定モデルの提案","author":"真鍋　凜太郎 （香川大学大学院）・土谷　圭央（香川大学）","aff":["香川大学大学院","香川大学"],"abstract":"長時間運転する際には，座位姿勢で長時間とどまることになり，血流悪化，腰痛の原因となる．その原因追及のためには，座位における腰部負担を正しく評価する必要がある．そのため，椅子座面・背面に加わる圧力を計測し，それを考慮した腰部負担推定モデルを試作し，シミュレーション評価を行った．","stream":"◯"},{"id":"274","title":"着座姿勢の多様化が乗員挙動に及ぼす影響解析 -6方向周波数スイープ加振下の全身周波数応答-","author":"加藤　大地 ・河口　篤志（豊田中央研究所）・奥田　哲大（トヨタ紡織）","aff":["豊田中央研究所","トヨタ紡織"],"abstract":"次世代モビリティの快適性評価に向けて，大きくリクライニングした姿勢を含む着座条件を設定した．その条件において，6方向の周波数スイープ加振下の全身乗員挙動をモーションキャプチャにより計測した．その結果，リクライニング角度と加振方向の違いによる乗員の周波数応答特性の変化が，基礎的検討として示された．","stream":"◯"},{"id":"275","title":"駐車操作移行時におけるペダル踏み替え動作の特徴分析","author":"馬場　湧大 ・井上　潤哉（日本大学大学院）・風間　恵介・丸茂　喜高（日本大学）・平松　真知子（日産自動車）・毛利　宏（東京農工大学）","aff":["日本大学大学院","日本大学","日産自動車","東京農工大学"],"abstract":"本研究は，踏み間違い事故における走行環境の影響を明らかにするため，通常走行時と駐車時のペダル操作を計測・比較した．踏み替え動作は「踵軸型」と「足部移動型」に分類された．踵軸型では駐車時に踵位置がブレーキ側へ移動して下肢関節運動が変化することが確認され，踏み間違いの発生に関与する可能性が示唆された．","stream":"◯"}]},{"id":151,"title":"車両制御","day":16,"room":"大ホール3","start":"9:30","end":"11:10","chair":"座長：杉町　敏之（東京都市大学）","talks":[{"id":"276","title":"ドライバー個人の操作入力制約を考慮したステアリングアシストシステムの提案 -（第3報）身体制約を模擬したドライバーによる実車評価-","author":"長坂　大輔 （J-QuAD DYNAMICS）・伊藤　章（愛知工業大学）・奥田　裕之・青木　宏文（名古屋大学）・市瀬　茂徳（J-QuAD DYNAMICS）","aff":["J-QuAD DYNAMICS","愛知工業大学","名古屋大学"],"abstract":"前報で提案したドライバー個人の操作入力制約を考慮したステアリングバイワイヤによるアシストシステムについて，身体制約を模擬したドライバーによる実車評価を行った．本報では操作負荷低減効果および運転支援効果の評価結果を報告する．","stream":"◯"},{"id":"277","title":"前後輪への最適トルク配分による自動車の姿勢および外乱抑圧制御","author":"渡邉　僚 ・和田　信敬（広島大学）・宮腰　穂・矢野　康英・足立　智彦・福井　誠志（マツダ）","aff":["広島大学","マツダ"],"abstract":"本稿では，自動車の前輪と後輪への制駆動力の配分を最適化することにより，加減速時における車両姿勢の安定化と，路面の凹凸が車体運動へ及ぼす影響の最小化を達成する制御手法を提案する．提案制御則は，モデル予測制御に基づき導出される．提案手法の有効性は数値シミュレーションにより検証される．","stream":"◯"},{"id":"278","title":"パラメータ変動を考慮した深層強化学習によるパワートレイン制御系のロバスト性能向上","author":"柴田　洸希 （北海道大学大学院）・米沢　平成（北海道大学）・佐藤　晶太・菊池　浩矢・波多野　崇・近藤　秀一・平松　繁喜（マツダ）・梶原　逸朗（北海道大学）","aff":["北海道大学大学院","北海道大学","マツダ"],"abstract":"パワートレインでは，加速時に発生する低周波振動の低減が要求される．モデルベース制御系はシステムのモデルに依存するため，実制御対象のパラメータ変動により制御性能が低下し得る．本研究ではパラメータ変動を考慮した深層強化学習により制御方策を獲得し，変動下における制振性能／ロバスト性能を向上させる．","stream":"◯"},{"id":"279","title":"機能安全分析における一般道での網羅的なシチュエーション導出手法の開発","author":"宮田　義大 ・樫原　修平・中野　貴之（日産自動車）","aff":["日産自動車"],"abstract":"一般道で作動するシステムの安全分析では無数のユースケースが想定され，その定義に膨大な時間がかかる．また，網羅性を証明することが難しい．特に多様な車両制御を行う自動運転システムはこの課題に該当する．これらの課題を解決したユースケースの導出手法を開発した．本講演では開発した手法と適用事例を報告する．","stream":"✕"}]},{"id":152,"title":"情報通信・遠隔操作","day":16,"room":"大ホール3","start":"12:10","end":"14:15","chair":"座長：秋田　時彦（電動モビリティシステム専門職大学）","talks":[{"id":"280","title":"モビリティシステムにおけるネットワークボンディングのための無線特性取得と効果予測","author":"山本　紗也 ・熱田　隆（1Finityモバイルテクノ）","aff":["1Finityモバイルテクノ"],"abstract":"本研究では，モビリティシステムに対し安定した通信環境を提供するために，複数の無線インタフェースを活用したネットワークボンディング技術を検討した．スマートデバイスを用いたセルラ測定系により無線特性を取得・蓄積し，エミュレータによりネットワークボンディングの効果を予測した結果を報告する.","stream":"◯"},{"id":"281","title":"モビリティシステムにおけるネットワークボンディング走行試験","author":"熱田　隆 ・山本　紗也（1Finityモバイルテクノ）","aff":["1Finityモバイルテクノ"],"abstract":"本研究では，モビリティシステムに対し安定した通信環境を提供するために，複数の無線インタフェースを活用したネットワークボンディング技術を検討した．スマートデバイスを用いてネットワークボンディング試験系を開発し走行試験を実施した．本講演ではその結果を報告する.","stream":"◯"},{"id":"282","title":"遠隔型自動運転サービスにおける1:N体制に関するシミュレーション検討","author":"毋　岩斌 ・佐藤　稔久・橋本　尚久（産業技術総合研究所）","aff":["産業技術総合研究所"],"abstract":"レベル4自動運転移動サービスの実装において，遠隔監視者が複数台の車両を監視する運用は，安全性と効率性を両立する必要がある．本研究は，遠隔監視シミュレータを開発し，遠隔監視タスクに関する実験評価と運行シミュレーションを行い，監視台数が安全性・効率性に及ぼす影響と運用上の制約を検討した．","stream":"◯"},{"id":"283","title":"遠隔運転における操舵反力の提示タイミングが運転操作に与える影響","author":"細井　崚大郎 ・自見　圭司（群馬大学）・上林　俊樹（SUBARU／群馬大学）・大熊　蓮・福田　悠人（群馬大学）・香西　俊彦・岩瀬　勉（群馬大学／SUBARU）","aff":["群馬大学","SUBARU／群馬大学","群馬大学／SUBARU"],"abstract":"遠隔運転において，ハンドル操作時の抵抗感や路面からの反力が運転者には伝わらず，安定した操舵が難しいという課題がある．本研究では，ドライビングシミュレータ上で非線形タイヤモデルを用いて操舵反力を生成し，車両制御支援への有効性の検証と操舵反力提示のタイミングが運転操作に与える影響の結果を報告する．","stream":"◯"},{"id":"284","title":"映像品質が遠隔操縦に与える影響と白線強調による運転支援効果のシミュレータによる検討","author":"大熊　蓮 ・自見　圭司（群馬大学）・上林　俊樹（SUBARU／群馬大学）・細井　崚大郎・福田　悠人（群馬大学）・香西　俊彦・岩瀬　勉（群馬大学／SUBARU）","aff":["群馬大学","SUBARU／群馬大学","群馬大学／SUBARU"],"abstract":"遠隔運転では通信環境が著しく変化するが，映像品質を抑えることで通信の安定化が期待できる．しかし，映像品質の低下は周辺環境の認識に影響し，安定した操縦が困難になる．本研究では，低解像度状態と白線強調の影響を比較し，低解像度での白線強調が運転行動にもたらす効果を報告する．","stream":"◯"}]},{"id":153,"title":"車両開発IV","day":16,"room":"104+105","start":"9:30","end":"11:35","chair":"座長：櫻井　俊明（元いわき明星大学）","talks":[{"id":"285","title":"ドライビングシミュレータを活用した雪路車両運動性能評価と開発プロセスへの展開","author":"中島　辰彦 （トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"雪路の車両運動性能評価は必要不可欠だが多くの時間を要している．本研究はドライビングシミュレータと車両・制御モデルを連携し，MBD評価環境を構築．リアルタイムな物理量結合・可視化で，実車評価前の課題抽出・対策検討を可能にした．これにより評価期間短縮と効率向上を確認し，開発プロセス変革の指針を示す．","stream":"◯"},{"id":"286","title":"製造起因の物理特性値を共通言語とする車体開発/生産統合アーキテクチャの提案","author":"田中　一郎 ・堀部　浩由・藤井　隆之・樋口　英生（本田技術研究所）・髙山　光弘（サイバー・フィジカル・エンジニアリング技術研究組合）","aff":["本田技術研究所","サイバー・フィジカル・エンジニアリング技術研究組合"],"abstract":"車体生産の複数工程にて累積される製造起因の物理状態量を予測するCAEを中核に，車体四大性能CAE，生産ロボットシミュレーション，生産時CO₂排出量算出モデルを共通の物理状態量に基づき接続することで各モデルの物理的整合性を担保した形で連成を可能とする車両開発・生産統合アーキテクチャの構想を提案する．","stream":"◯"},{"id":"287","title":"CAEと生産ロボットの情報循環によるデジタルツイン構築技術","author":"藤井　隆之 （本田技術研究所）・陣内　貴洋（本田技研工業）・伊藤　和人（デジタルプロセス）・塚田　誠司（プログレス・テクノロジーズ）・田中　一郎（本田技術研究所）","aff":["本田技術研究所","本田技研工業","デジタルプロセス","プログレス・テクノロジーズ"],"abstract":"CAEと生産ロボット間の情報循環により，設計と製造の乖離解消を目指したデジタルツイン構築技術を提案する．ロボット動作に基づく条件反映と現場調整値のCAEへのフィードバックにより予測精度を向上させ，その有効性を実機適用で検証した．","stream":"◯"},{"id":"288","title":"車室内圧力変化予測に向けた離散薄膜モデルによるエアバッグ膨張挙動の数値解析","author":"野原　聖之 （神戸大学）・柴田　慎輔・疋田　和樹・菅谷　尚貴・長谷川　厚（本田技術研究所）・坪倉　誠（神戸大学）","aff":["神戸大学","本田技術研究所"],"abstract":"エアバッグの展開速度向上や新規部位への搭載に伴い，瞬間的な車室内圧力変化に起因する圧外傷の事例が報告されている．本報では，新たに開発した離散薄膜モデルを用いて内圧を指定したエアバッグ膨張挙動を数値解析し，車室内圧力変化予測技術の構築に向けて，流体構造連成解析への適用可能性を検討する．","stream":"✕"},{"id":"289","title":"FMIを活用した車両全体系モデルによる電動車用熱部品の最適化手法の検討","author":"沢田　龍作 （サワダ技研）・交易場　真（中央図研）","aff":["サワダ技研","中央図研"],"abstract":"電動車の熱管理部品設計において，開発初期に実車環境での最適化を行うことは計算コストの観点から困難である．本研究では，実験式に基づく軽量な1D熱流体モデルを構築し，FMIを介してSimulinkの車両・駆動・空調統合環境へ連携した．パラメータ解析により，3DCFDに依存せず電費や温度挙動に対するロバスト最適仕様を迅速に同定する手法を確立した．","stream":"◯"}]},{"id":154,"title":"車両開発V","day":16,"room":"104+105","start":"12:35","end":"15:15","chair":"座長：槇　徹雄（東京都市大学）","talks":[{"id":"290","title":"鍛造アルミニウム合金の部分鍛造適用が疲労強度に与える影響調査","author":"志水　健人 ・野崎　美紀也・石田　宗一朗・前川　佳大・平川　政昭・吉末　監介（トヨタ自働車）・鈴木　智博（豊田自動織機）・磯野　志之（トヨタ自働車）","aff":["トヨタ自働車","豊田自動織機"],"abstract":"鋳造アルミニウム合金では，鋳巣欠陥を起点とした疲労き裂が発生することが知られている．本研究では，鋳巣を模擬した人工欠陥に部分鍛造を適用し，欠陥サイズおよび欠陥圧潰が疲労強度に与える影響を調査した．実験結果から，欠陥の圧潰方向と主応力方向に対して直交方向に鍛造を適用することで，疲労強度特性に変化が見られることを確認した．","stream":"✕"},{"id":"291","title":"980MPa鋼板を適用した自動車用足回り部品の軽量化","author":"大谷　隆広 ・田中　正顕・木村　大樹（マツダ）","aff":["マツダ"],"abstract":"マツダが目指す，「走る歓び」と「優れた環境・安全性能」の実現には，車両運動性能と環境性能が必要である．より多くのお客様にこの思想を届けるには，板金部品の薄板化が効率的であるが，剛性・強度・防錆性能の高いレベルでの両立が求められる．要素技術の進化により，これらの課題を解決した成果を報告する．","stream":"✕"},{"id":"292","title":"はく離負荷条件下における接着−リベット併用継手の疲労特性に関する調査","author":"和田　千洋 ・河村　拓昌・新里　映太・宅野　聡悟・森重　雄司（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"自動車車体の軽量化およびマルチマテリアル化に対応する接着‐リベット併用継手について，先行研究で主に扱われてきたせん断・引張条件に対し，実車フランジ部を想定したはく離負荷条件下の静的・疲労特性を取得した．高荷重域ではリベット支配，低荷重域では接着併用により疲労強度が向上することを明らかにした．","stream":"◯"},{"id":"293","title":"軟質ウレタンフォームの気泡分布関数と機械特性（圧縮荷重-変位特性）の関係性研究 -(第三報) 気泡分布関数を用いた圧縮F-S特性の検討と機械学習による予測-","author":"井上　実 （マツダ／香川大学／広島大学）・鈴木　桂輔（香川大学）・伊東　博之（東洋シート）・吉田　敏宏（マツダ）","aff":["マツダ／香川大学／広島大学","香川大学","東洋シート","マツダ"],"abstract":"前報までに精度検証ができた気泡分布関数を用いた軟質ウレタンフォームの圧縮F-S特性予測手法を用いて，気泡分布関数を種々変更させた時の圧縮F-S特性を評価した．その結果圧縮F-S特性に影響する気泡分布関数の特性・パラメータが明らかになり，軟質ウレタンフォームによるF-S特性制御の可能性を示すことができた．","stream":"◯"},{"id":"294","title":"流体トポロジー最適化を用いたダクト部品検討効率化手法の研究","author":"伊藤　芳雄 ・伊藤　聡（トヨタ自動車）・白津　史也・河野　昌彦・渡邉　俊樹（トヨタシステムズ）","aff":["トヨタ自動車","トヨタシステムズ"],"abstract":"本研究では，流体トポロジー最適化を用いた空調ダクト設計の効率化手法を提案する．レジスタ有無を考慮した最適化および実機検証により，出口境界条件が圧力損失に及ぼす影響を明らかにし，実使用条件下での性能向上と開発工数削減を実証した．","stream":"◯"},{"id":"295","title":"3D筒内CFDの縮退モデル化による多段噴射条件の筒内状態量予測","author":"長島　広貴 ・安達　龍・江黒　陽介・中川　光葉・桂川　卓磨（SUBARU）・石澤　夏希（IDAJ）","aff":["SUBARU","IDAJ"],"abstract":"環境対応の高度化により，出力・燃費と排ガス低減の両立には開発効率化が不可欠である．多段噴射は排ガスに影響するが，幅広い運転条件における3D-CFD解析は計算コストが高い．そこで，CFD結果に基づく縮退モデル（ROM）を構築し，様々な噴射タイミングでの筒内状態量を素早く推定する手法を提案する．","stream":"◯"}]},{"id":155,"title":"新燃料SIエンジンI","day":16,"room":"107+108","start":"9:30","end":"12:10","chair":"座長：森吉　泰生（千葉大学大学院）","talks":[{"id":"296","title":"カーボンニュートラル燃料（MtG: Methanol to Gasoline，EtG: Ethanol to Gasoline）を用いた火花点火エンジンの燃焼・排出ガス特性","author":"岸本　千宙・森本　晴斗・Ratnak Sok（早稲田大学）・長田　剛・山田　涼太（トヨタ自動車）・ 草鹿　仁 （早稲田大学）","aff":["早稲田大学","トヨタ自動車"],"abstract":"火花点火エンジンにおいて，MtG，EtGによるエンジン性能への影響を低負荷から高負荷領域まで実験的に調査した．正味熱効率について燃料種間での差異は認められなかった．一方で，排出ガス組成については差異が確認された．要因として，各燃料の蒸発特性に起因する混合気形成過程への影響が示唆された．","stream":"◯"},{"id":"297","title":"エタノール混合カーボンニュートラル燃料（MtG: Methanol to Gasoline）を用いた火花点火エンジンの燃焼・排出ガス特性","author":"森本　晴斗 ・岸本　千宙・Ratnak Sok（早稲田大学）・長田　剛・山田　涼太（トヨタ自動車）・草鹿　仁（早稲田大学）","aff":["早稲田大学","トヨタ自動車"],"abstract":"ガソリンおよびMtGにエタノールを添加した際のエンジン性能への影響を実機エンジン試験により調査した．エタノール添加により点火時期の進角が可能になり正味熱効率の向上が確認された．また，添加によりCO・NO・THC排出量が低減された．ガソリンとMtG間でエタノール添加感度の差異は認められなかった．","stream":"◯"},{"id":"298","title":"火花点火エンジン用カーボンニュートラル燃料（MtG: Methanol to Gasoline，EtG: Ethanol to Gasoline）のサロゲート燃焼反応機構の構築","author":"岸本　千宙 ・森本　晴斗・Ratnak Sok（早稲田大学）・長田　剛（トヨタ自動車）・草鹿　仁（早稲田大学）","aff":["早稲田大学","トヨタ自動車"],"abstract":"ガソリン，MtG，EtGの燃焼特性について，定容燃焼容器を用いた実験および数値解析から検討を行った．MtG，EtGはガソリン燃料と比較して層流燃焼速度が小さく，断熱火炎温度も低くなる傾向を示すことが確認された．感度解析の結果，燃料中の重質芳香族成分が層流燃焼速度低下の要因であることを示した．","stream":"◯"},{"id":"299","title":"MTG（Methanol to Gasoline）プロセスによる合成ガソリンの製造と品質制御 -FT合成との比較によるガソリン製造に関する考察-","author":"岡本　憲一 ・網谷　直樹・新谷　紀行・大山　信雄・今井　章雄・鈴木　星哉・大森　敬朗・木濟　寛史（カーボンニュートラル燃料技術センター）","aff":["カーボンニュートラル燃料技術センター"],"abstract":"地球温暖化対策として輸送用燃料へのバイオエタノールや合成ガソリン導入が求められている．本研究ではMTG（Methanol to Gasoline）合成を実施し，粗油の品質分析から規格適合に向けた調整法を検討するとともに，FT合成との比較から今後の合成ガソリン製造の方向性を考察した．","stream":"◯"},{"id":"300","title":"合成燃料（e-fuel）と従来燃料における層流燃焼速度の比較検証","author":"松田　大 ・菊地　慧（九州大学）・岡本　憲一・大山　信雄（カーボンニュートラル燃料技術センター）・Ekenechukwu CHIJIOKE Okafor（九州大学）","aff":["九州大学","カーボンニュートラル燃料技術センター"],"abstract":"火花点火機関への適用を想定した燃料の基礎燃焼特性を明らかにするため，市販ガソリン，MTG燃料および試作FT合成燃料を対象に，定容燃焼容器を用いて層流燃焼速度を測定した．燃料の組成と炭素骨格が燃焼速度に及ぼす影響を検討した結果を報告する．","stream":"◯"},{"id":"301","title":"FT合成由来オレフィン含有ガソリンのエンジン燃焼特性評価","author":"葛岡　浩平 ・小熊　光晴（産業技術総合研究所）・岡本　憲一（カーボンニュートラル燃料技術センター）","aff":["産業技術総合研究所","カーボンニュートラル燃料技術センター"],"abstract":"FT合成によって得られた燃料をガソリンエンジンに適用する際には，十分な耐ノッキング性の確保が課題となる．本研究では，オレフィンを多く含む燃料を直接生成するFT触媒を想定したサロゲート燃料を用い，種々の運転条件下でのエンジン試験からその燃料組成がノッキング特性に及ぼす影響を評価した．","stream":"◯"}]},{"id":156,"title":"新燃料SIエンジンII","day":16,"room":"107+108","start":"13:10","end":"16:15","chair":"座長：近藤　卓（本田技術研究所）","talks":[{"id":"302","title":"エタノール混合ガソリンの共沸現象が冷間始動時の液膜蒸発特性に及ぼす影響","author":"佐藤　志龍・ 田村　賢治 （早稲田大学大学院）・長田　知己（早稲田大学）・内田　健児・堀　隼基・飯田　晋也（マツダ）・草鹿　仁（早稲田大学）","aff":["早稲田大学大学院","早稲田大学","マツダ"],"abstract":"エタノール混合燃料の液膜蒸発特性を定容容器実験および3D熱流体計算で調査した．エタノールはガソリン由来の高沸点成分と共沸して蒸発を促進し，共沸補正した解析でもその挙動を再現した．蒸発特性は，共沸による蒸発速度向上と，高い蒸発潜熱による吸熱という，温度低下をもたらす2つの要因に支配されると結論付けた．","stream":"◯"},{"id":"303","title":"ガソリン中の軽質成分（エタノール）および重質成分と加熱・冷却サイクル条件がデポジットに及ぼす影響の基礎評価","author":"片岡　朋治 （トヨタ自動車）・中山　慶則（SOKEN）","aff":["トヨタ自動車","SOKEN"],"abstract":"近年，CO2排出削減に向けエタノールや合成ガソリンの社会実装の動きが活性化している．また，加熱冷却の繰り返しがガソリンデポジットの硬化を促進することが報告された．本報告では，エタノールといった軽質成分や合成燃料に関する重質成分の，加熱冷却サイクル下におけるデポジット生成への影響を報告する．","stream":"◯"},{"id":"304","title":"高効率ガソリン火花点火機関における燃焼室内デポジットのモデル化研究（第3報） -可視化定容容器を用いたカーボンニュートラル燃料構成成分のデポジット生成に対する感度評価-","author":"本橋　一馬 ・田中　光太郎・境田　悟志（茨城大学）・木下　幸一・阿部　容子（産業技術総合研究所）・森　伸介・小玉　聡（東京科学大学）","aff":["茨城大学","産業技術総合研究所","東京科学大学"],"abstract":"二酸化炭素排出量削減に向け，カーボンニュートラル（CN）燃料の使用が検討されているが，デポジットの生成が懸念されている．本研究では，燃焼室デポジットの生成予測モデルを構築することを目的とし，本報では，燃焼室を模擬した可視化定容容器を用い，CN燃料構成成分がデポジット生成に及ぼす影響を明らかにした．","stream":"◯"},{"id":"305","title":"高効率ガソリン火花点火機関における燃焼室内デポジットのモデル化研究（第4報） -カーボンニュートラル燃料を想定したオートクレーブによるデポジット評価-","author":"木下　幸一 ・阿部　容子（産業技術総合研究所）・田中　光太郎・境田　悟志（茨城大学）・森　伸介・小玉　聡（東京科学大学）","aff":["産業技術総合研究所","茨城大学","東京科学大学"],"abstract":"近年，化石燃料に代わる合成燃料などのカーボンニュートラル燃料の導入が検討されているが，その利用に伴うデポジット生成が懸念されている．本研究では，燃焼室デポジットの生成メカニズムの解明，抑制手法の確立，および予測モデルの構築を目的とする．本報では，カーボンニュートラル燃料を想定した条件下でオートクレーブを用いたデポジット生成実験を実施し，生成挙動および特性の評価を行った．","stream":"◯"},{"id":"306","title":"高効率ガソリン火花点火機関における燃焼室内デポジットのモデル化研究（第5報） -実機データと模擬実験を活用したカーボンニュートラル燃料対応デポジット堆積速度予測モデルの構築-","author":"森　伸介 ・小玉　聡（東京科学大学）・木下　幸一・阿部　容子（産業技術総合研究所）・田中　光太郎・境田　悟志（茨城大学）","aff":["東京科学大学","産業技術総合研究所","茨城大学"],"abstract":"近年，内燃機関の高効率化とカーボンニュートラル燃料の活用が求められている．一方，燃焼室内に生成・堆積するデポジットは，異常燃焼などを誘発する要因となることが懸念される．そこで本研究では，カーボンニュートラル燃料を対象とした燃焼室デポジット堆積速度予測モデルの構築を目的とした．本報では，模擬デポジット生成実験結果を活用し，燃料組成がデポジット堆積特性へ及ぼす影響について検討した．さらに，実機試験により得られるデータを活用したモデル化についても検討した．","stream":"◯"},{"id":"307","title":"アンモニア/水素SIエンジンの開発 -実機によるアンモニア/水素PFIでの初期性能と点火の影響検証-","author":"村上　亮 ・西橋　知博・牟田　直輝・黒木　志典・澤下　真人（ダイハツ工業）・山本　浩史・木村　裕幸・鴛海　博・泉　光宏（ダイヤゼブラ電機）","aff":["ダイハツ工業","ダイヤゼブラ電機"],"abstract":"本講演は26年度春季大会からの続報となる．アンモニアと水素をPFIにて供給する混焼エンジンを制作し，エンジン性能や安定した燃焼に必要な水素添加率を実機で検証した．また，始動運転点において点火プラグギャップと点火エネルギーが燃焼へ及ぼす影響を評価したため，その内容について報告する．","stream":"✕"},{"id":"308","title":"水素混合が火花点火天然ガスエンジンのノッキングに及ぼす影響の研究","author":"西尾　渉 ・清水　剛世（早稲田大学）・吉村　佳・徳原　聡（スズキ）・草鹿　仁（早稲田大学）","aff":["早稲田大学","スズキ"],"abstract":"HCNG燃料を用いた火花点火エンジンにおいて，水素混合がノッキングに及ぼす影響を実験および数値解析により検討した．水素混合によりノッキング強度は増大する一方，開始時期への影響は小さいことを確認した．そして反応経路解析から，HO₂/H₂O₂系を介した自着火時の酸化反応の活性化が主因であることを示した．","stream":"◯"}]},{"id":157,"title":"認知・感性","day":16,"room":"中ホールA","start":"9:30","end":"11:10","chair":"座長：松下　詩穂（日産自動車）","talks":[{"id":"309","title":"無信号横断歩道における自動運転車の減速挙動を介した譲り意図伝達に関する研究","author":"吉川　大貴 ・府川　寿紗（慶應義塾大学大学院）・中島　航・藁谷　剛司（スタンレー電気）・大門　樹（慶應義塾大学）","aff":["慶應義塾大学大学院","スタンレー電気","慶應義塾大学"],"abstract":"無信号横断歩道において，自動運転車の初速度，減速開始位置および減速度の違いが，歩行者による譲り意図の認識に及ぼす影響を実車実験により検討する．特に，譲られたと判断する割合と判断タイミングに着目し，減速開始後の早期に譲り意図が伝わりにくい減速挙動の特徴を明らかにする．","stream":"◯"},{"id":"310","title":"夜間環境が歩行者の横断判断に与える影響の分析","author":"中島　航 （スタンレー電気）・吉川　大貴・府川　寿紗（慶應義塾大学大学院）・藁谷　剛司（スタンレー電気）・大門　樹（慶應義塾大学）","aff":["スタンレー電気","慶應義塾大学大学院","慶應義塾大学"],"abstract":"自動運転車が，無信号横断歩道で歩行者に進路を譲る場面を想定し，暗い環境が歩行者の横断判断に与える影響を分析した．実車試験により，譲られたと認識したか否かを判断有無として取得し，車両挙動を説明変数とする交互作用を含む統計解析を行った．","stream":"◯"},{"id":"311","title":"クロスモーダル特性を考慮した前方映像提示型運転支援システムの感性評価","author":"中野　塔莉 （上智大学大学院）・竹原　昭一郎（上智大学）・坂本　秀樹（アルプスアルパイン）","aff":["上智大学大学院","上智大学","アルプスアルパイン"],"abstract":"本研究は，直感的で快適な左折ガイダンスを実現するため，音と振動の組み合わせによるクロスモーダル効果を検証した．左折案内シーンを対象にSD法実験を行い，刺激条件が感性評価に与える影響を整理し，設計指針を得た．","stream":"✕"},{"id":"312","title":"振動と注意対象の位置対応を利用したシートによる注意喚起方法の検討 -（第3報）-","author":"上村　洋介 （京都工芸繊維大学大学院）・北川　哲也・古舞　隆司（フォルテック）・西崎　友規子（京都工芸繊維大学）","aff":["京都工芸繊維大学大学院","フォルテック","京都工芸繊維大学"],"abstract":"単純な視覚刺激を用いて検討してきたシート振動による空間的注意誘導の注意対象物への反応促進効果について，実車走行映像を提示した動的視覚環境下で再検証した．これまでの結果と同様に，若年群および高齢群ともに，注意対象物の出現位置と一致するシート振動を呈示することで注意対象物への反応時間が有意に短縮した．","stream":"◯"}]},{"id":158,"title":"HMI II","day":16,"room":"中ホールA","start":"12:10","end":"14:50","chair":"座長：蜂須賀　知理（東京大学）","talks":[{"id":"313","title":"複数車線交差点における交通シナリオの確率的予測に基づく右折意思決定支援の提案","author":"石附　悠 ・奥田　裕之（名古屋大学）・山口　拓真・伴　和徳（トヨタテクニカルディベロップメント）・豊田　平司郎（トヨタ自動車）・鈴木　達也（名古屋大学）","aff":["名古屋大学","トヨタテクニカルディベロップメント","トヨタ自動車"],"abstract":"本研究は，複数車線交差点における対向車の車線変更行動を考慮し，広域インフラセンサ情報を用いた右折意思決定支援システムを提案する．車線変更に伴うギャップの分布を動的に確率的に予測し，安全マージンと待ち時間のトレードオフに基づくドライバの期待効用を最大化する最適な意思決定を支援する．","stream":"◯"},{"id":"314","title":"フルブレーキバイワイヤ技術におけるブレーキ操作時の足関節受動抵抗を考慮した設計手法","author":"横山　智宏 ・伊藤　健悟・加賀　翔大郎・曽我　雅之（トヨタ自動車）・吉武　宏・小竹　元基（東京科学大学）","aff":["トヨタ自動車","東京科学大学"],"abstract":"従来の油圧ブレーキシステムでは，制動力を確実に発生させるために必要な液量やマスタシリンダ行程を基準として設計が行われており，ブレーキペダルのストローク量は構造的に規定された値を前提としてきた．そのため，ペダル操作系の設計は油圧成立性を優先する形で最適化され，人間の操作特性に基づいて自由に設計することは困難であった．これに対し，Brake-by-Wire（BbW）技術の適用により，制動力生成とペダル操作が機械的に分離され，液量や機構制約から解放された設計が可能となる．その結果，ブレーキ操作系を人間特性に基づいて設計するための新たな可能性が開かれつつある．BbW技術の適用により，ブレーキペダルの踏力（Force），ストローク（Stroke），車両減速度（G）の関係，いわゆるF-S-G特性は機械的制約から解放され，設計自由度が大きく向上している．これにより，操作フィーリングや運転者負担の低減を意識した多様なブレーキ操作系設計が可能となってきた．例えば，ペダル反力だけでなくストローク量そのものを設計対象とすることが可能となり，従来の油圧制約下では困難であった操作様式の再構成が可能となった．その結果，足関節の自然な回転運動を活用し，踵支持を前提とした操作など，人間の運動特性に適合したブレーキ操作系設計を実現できると考えられる．一方で，F-S-G特性の設計は依然として試乗評価や経験的調整に基づく部分が大きく，人間特性に立脚した体系的な設計指針は十分に整理されていないのが現状である．これまでの研究では，足関節主導のブレーキ操作に着目し，ヒラメ筋を主働筋とする筋力制御領域において，操作量と知覚減速度の関係がWeber–Fechner則により近似可能であることが示されてきた．しかし一方で，実車評価や試乗会における官能評価から，運転者が脱力している状態においても踏力が発生し，ブレーキ操作初期のフィーリングに強く影響することが確認されている．このような操作初期特性は，従来の液量・行程制約を前提とした設計思想の下では明確に理論化されてこなかった．本研究では，脱力状態において発生する踏力の起源を，足関節における関節受動抵抗として再定義し，これを明示的に考慮したF-S-G特性設計手法を提案することを目的とする．","stream":"◯"},{"id":"315","title":"構造方程式モデリングを活用した安全運転促進のためのHMI個人適合設計論","author":"室谷　帆人 （香川大学）・吉田　恵美子（あいおいニッセイ同和損害保険）・鈴木　桂輔（香川大学）","aff":["香川大学","あいおいニッセイ同和損害保険"],"abstract":"実走行データと個人特性調査に基づき，潜在的要因（性格）と顕在的要因（運転行動）を統合した情報提示HMIデバイスの設計手法を提案した．SEMによる因果構造の可視化とAIにない明瞭なロジックで情報への信頼感を高めた．個人に最適化した警告により，トラスト醸成と安全運転を両立する，新たな設計論である．","stream":"◯"},{"id":"316","title":"スイッチ操作感触の心理量定量化モデル構築（第4報）","author":"坂本　秀樹 （アルプスアルパイン）・金　宣亨（東北大学）・竹内　翔太（アルプスアルパイン）・張　文玉・劉　淳琳・丁　一（東北大学）・下村　尚登・佐藤　邦生（アルプスアルパイン）・杉浦　元亮（東北大学）","aff":["アルプスアルパイン","東北大学"],"abstract":"自動車の車室内に装備されるスイッチは，用途毎に様々な操作感触が求められる．操作感触の評価は官能評価を用いていたが，心理量を示す項目は被験者による差が大きく客観的な評価が困難であることが知られている．本研究は，触覚の体験時の感覚次元をfMRIにて脳内表現を明らかにし，脳指標を用いた客観的評価の確立を目指した．","stream":"◯"},{"id":"317","title":"スイッチ操作感触の心理量定量化モデル構築（第3報）","author":"七枝　佑哉 ・坂本　秀樹（アルプスアルパイン）・竹原　昭一郎（上智大学）","aff":["アルプスアルパイン","上智大学"],"abstract":"自動車の車室内で搭載されるスイッチは，使用者ごとに用途に応じて様々な操作感触が求められる．本報では，スイッチ押下時の操作感触の主観評価結果を基に個人の嗜好を分ける要因を明らかにした．また，属性別の評価者群の心理量とスイッチの機械特性との相関関係を示すモデル構築も併せて行った．","stream":"◯"},{"id":"318","title":"A Study on a Quantitative Evaluation Method for Daytime Visibility of Automotive Interior Illumination Using CIELAB","author":"Seong Uk Kim (Hyundai Motor)","aff":["Hyundai Motor"],"abstract":"Daytime visibility assessment of automotive interior illumination has traditionally relied on subjective evaluation, leading to inconsistent pass or fail criteria. This study proposes a quantitative method based on LMK imaging photometer measurements in CIELAB color space. Although dE00, a conventional color difference metric, did not correlate well with visual perception, dLstar and LCR were found to be more effective indicators of daytime visibility. Empirical analysis showed that daytime visibility was insufficient when dLstar was below 4.5 or LCR was below 0.06. This luminance based criterion enables objective and reproducible evaluation for automotive interior illumination design.","stream":"◯"}]},{"id":159,"title":"ディーゼル燃焼I","day":16,"room":"中ホールB","start":"9:30","end":"12:10","chair":"座長：林田　和宏（北見工業大学）","talks":[{"id":"319","title":"高圧縮比大型ディーゼル機関における最適燃焼室形状および高流量ノズルによる冷却損失低減","author":"向山　智之 ・内田　登（新エィシーイー）","aff":["新エィシーイー"],"abstract":"大型商用ディーゼル機関の更なる熱効率向上には，高圧縮比化と，増加する冷却損失を画期的に低減する必要がある．本研究ではまず圧縮比23.5の燃焼室形状設計を数値シミュレーションで検討し，得られた指針を圧縮比26の設計へ応用した．さらに高流量ノズルと組合せ，単気筒実機評価により冷却損失低減効果を確認した．","stream":"◯"},{"id":"320","title":"畳み込みニューラルネットワークモデルを用いたディーゼルエンジンの熱発生制御 -（第1報）熱発生率推定と精度向上-","author":"関口　亮 ・岡本　毅・小澤　恒（いすゞ中央研究所）・栁内　滉洋・Ratnak Sok・草鹿　仁（早稲田大学）","aff":["いすゞ中央研究所","早稲田大学"],"abstract":"カーボンニュートラル燃料の多様化に対応するため，燃料特性によらず目標性能を実現する燃焼制御が求められる．本研究では，CNNを用いた熱発生率推定に基づく制御ロジックを構築し，セタン価の異なる軽油を用い，筒内圧力とクランク角加速度をそれぞれモデル入力として，推定精度への影響を評価した．","stream":"◯"},{"id":"321","title":"燃料の物理特性がディーゼルエンジンの噴霧と燃焼特性に与える影響 (第1報) -ディーゼル噴霧の噴孔近傍における空気導入に及ぼす燃料物性の影響-","author":"小林　亮太 ・藍澤　岳斗・座間　淑夫（群馬大学）・橋詰　剛（トヨタ自動車）","aff":["群馬大学","トヨタ自動車"],"abstract":"近年の圧縮着火機関ではCN燃料の適用により，更なる環境負荷への低減が期待されている．一方，CN燃料は従来の軽油と表面張力など物性値が異なる可能性があり，混合気の形成に寄与する空気導入特性の変化が予想される．そこで本研究では蛍光PIVを用いて噴霧への空気導入特性に及ぼす燃料物性の影響を調査した．","stream":"◯"},{"id":"322","title":"燃料の物理特性がディーゼルエンジンの噴霧と燃焼特性に与える影響 -（第2報）燃料の物理特性が燃焼，排出ガス特性に与える影響-","author":"遠藤　佑馬 （早稲田大学大学院）・志田　光希（早稲田大学）・橋詰　剛（トヨタ自動車）・草鹿　仁（早稲田大学大学院）","aff":["早稲田大学大学院","早稲田大学","トヨタ自動車"],"abstract":"本研究では燃料の物理特性がディーゼル燃焼に及ぼす影響を明らかにすることを目的として，物理特性の異なる5種類の燃料を用いた実験を実施した．供試機関に単気筒ディーゼルエンジンを用い，2領域モデルで空気導入量を推算した結果，空気導入の早期化により従来よりも低い噴射圧においても微粒子低減が可能となった．","stream":"◯"},{"id":"323","title":"数値熱流体計算と機械学習を組み合わせた大型ディーゼルエンジンの燃焼室形状の最適化手法の研究","author":"松前　諒大 ・松田　知紘・草鹿　仁（早稲田大学）","aff":["早稲田大学"],"abstract":"ディーゼルエンジン燃焼室のリップ径・リップ深さ・リエントラント角を対象に，熱効率，Soot，NOx排出量を指標とした最適化を実施した．燃焼室形状と性能指標の関係を推定するためANNモデルを構築し，最適化にはPSOを適用した．感度解析により各形状因子の影響を明確化し，熱効率向上と排出ガス低減を両立する形状を探索した．","stream":"◯"},{"id":"324","title":"数値熱流体計算と機械学習を組み合わせた大型ディーゼルエンジンの燃焼室形状の最適化手法の研究 -設計意図を反映した最適形状の解析-","author":"松前　諒大・ 松田　知紘 ・草鹿　仁（早稲田大学）","aff":["早稲田大学"],"abstract":"PSOで最適化した2種の燃焼室形状の筒内現象を解析し，性能向上の要因を調査した．両立型は流速抑制により壁面熱損失を低減し，効率と排出ガス低減を両立した．熱効率特化型は流動強化と燃料噴霧のリップ部衝突により初期燃焼と後期酸化を促進した．PSOの重み設定により，特定の燃焼戦略を実現可能であることを示した．","stream":"◯"}]},{"id":160,"title":"ディーゼル燃焼II","day":16,"room":"中ホールB","start":"13:10","end":"14:25","chair":"座長：中島　大（日野自動車）","talks":[{"id":"325","title":"ディーゼルエンジンにおける水素酸素ガスの吸気添加によるPM低減効果","author":"春日井　貫太 ・加藤　尊史・武田　凌政・大西　凌馬・栗田　健聖・西島　義明（愛知工業大学大学院）","aff":["愛知工業大学大学院"],"abstract":"生成した水素酸素ガスをエンジンの吸気に投入することで，燃費向上が期待できる．水を電気分解することで生じた水素酸素ガスを投入し，排出ガス中のPM（粒子状物質）質量の低減効果を評価した．","stream":"◯"},{"id":"326","title":"ディーゼル噴霧燃焼におけるホルムアルデヒド生成挙動の可視化解析","author":"稗島　利明 ・林　朋博・上田　佳紀（SOKEN）・福田　晶・河内　隆史・筒井　優斗（豊田自動織機）","aff":["SOKEN","豊田自動織機"],"abstract":"カーボンニュートラル対応で燃料多様化が進む中，ディーゼル自着火燃焼では燃料性状差が燃焼・排気特性に大きく影響する．そこで，燃焼状態の評価指標として有効なエンジン筒内のホルムアルデヒド分布に着目し，RCEMを用いた自発光・LIF法による可視化解析技術を開発した．","stream":"◯"},{"id":"327","title":"ディーゼル機関における吸気ガス条件がすす粒子の炭素結晶子サイズに及ぼす影響","author":"竹内　真隆 ・山本　心優・黒島　悠（北見工業大学大学院）・稲葉　一輝・林田　和宏（北見工業大学）","aff":["北見工業大学大学院","北見工業大学"],"abstract":"本研究では，吸気ガス条件（圧力，温度，酸素濃度）がディーゼル機関から排出されるすす粒子の炭素結晶子サイズLaに及ぼす影響を実機試験により調査した．燃料には軽油とHVOを用いたが，燃料によらず吸気ガス条件に応じてLaが変化し，その定性的な変化の傾向は一致した．","stream":"◯"}]},{"id":161,"title":"新燃料CIエンジン","day":16,"room":"中ホールB","start":"14:55","end":"17:00","chair":"座長：鈴木　健太（いすゞ自動車）","talks":[{"id":"328","title":"メタノール-軽油デュアルフュエルエンジンの燃焼特性に関する研究","author":"森田　慧・ 森脇　大翔 （早稲田大学）・小暮　涼介・田中　貴文（三菱重工エンジン&ターボチャージャ）・古賀　智大（三菱重工業）・草鹿　仁（早稲田大学）","aff":["早稲田大学","三菱重工エンジン&ターボチャージャ","三菱重工業"],"abstract":"急速圧縮膨張装置を用いた可視化実験より，広い範囲の条件における軽油メタノール混焼の基礎燃焼特性の取得ならびに化学反応機構の選定およびパラメータ変更に対して精度よく予測できる3D-CFD燃焼モデルの構築を行った．軽油噴射時期の過度な進角および遅角は軽油噴霧の状態悪化と著しい着火遅れを引き起こすことを示した．","stream":"◯"},{"id":"329","title":"水素含有率に着目したバイオ燃料の煤生成への影響","author":"加藤　尊史 ・春日井　貫太・武田　凌政・大西　凌馬・栗田　健聖・西島　義明（愛知工業大学大学院）","aff":["愛知工業大学大学院"],"abstract":"燃料組成中の水素含有率が高いと相対的に炭素含有率が低いことから，ディーゼルエンジンの燃焼時の煤の生成が少ないことが期待できる．単気筒エンジンを用いた燃焼試験を行った．排気の実測から水素含有率に対する煤の生成量が変化することを確認した．","stream":"◯"},{"id":"330","title":"HVO混合割合が着火時期に与える影響","author":"武田　凌政 ・大西　凌馬・加藤　尊史・栗田　健聖・春日井　貫太・西島　義明（愛知工業大学大学院）","aff":["愛知工業大学大学院"],"abstract":"ディーゼルエンジンの排気性能改善手段としてバイオ燃料が注目されている．特にHVOは水素化処理により，水素含有率が高い．この特性により，燃料中の水素と大気中の酸素との結合が促進されることで着火開始時期が早期化される．本研究では，HVOにおいて軽油と比較して着火開始時期が早期化することを確認した．","stream":"◯"},{"id":"331","title":"DPFを備えたディーゼルエンジンを用いたバイオ混合燃料の着火・燃焼特性評価","author":"津田　稔 ・石田　雅照・山西　大（水産大学校）・神部　典之（ワーズインク）・佐々木　秀次（東京海洋大学）","aff":["水産大学校","ワーズインク","東京海洋大学"],"abstract":"BDFの着火温度は軽油よりも高いため，着火・燃焼特性を明らかにする必要がある．本研究では排気系統にDPFを実装した214kW/3101min-1のディーゼルエンジンの燃料として，B5（5%バイオ混合燃料），B10，B20，B30を用いた場合の着火・燃焼特性と，セリウム系燃料添加剤によるDPFに堆積した“すす”の低減効果（燃費の改善効果）を明らかにした．","stream":"◯"},{"id":"332","title":"燃料物性値がディーゼル噴霧の形状におよぼす影響","author":"有冨　功大 ・駒田　佳介（福岡工業大学）・山本　昌平（大阪電気通信大学）・髙津　康幸（福岡工業大学）","aff":["福岡工業大学","大阪電気通信大学"],"abstract":"本研究では燃料の動粘度，表面張力および密度に注目し，それぞれの物性値のみが主に異なる燃料を製作した．60MPaに加圧した燃料を噴孔径0.133mmの10噴孔インジェクタから大気圧中に噴射し，燃料噴霧を高速度カメラで撮影した．動粘度が低い場合および表面張力が低い場合は噴霧幅が広い．密度が高い場合は噴霧先端到達距離が短い．","stream":"✕"}]},{"id":162,"title":"振動・騒音・乗り心地VI","day":16,"room":"特別会議場","start":"9:30","end":"12:10","chair":"座長：市川　佳（本田技術研究所）","talks":[{"id":"333","title":"機械学習によるエアサスペンションの非線形振動応答のモデル化と性能予測","author":"渥美　良宏 ・佐藤　恭一（横浜国立大学）","aff":["横浜国立大学"],"abstract":"機械学習を用いてエアサスペンションの非線形特性を表現する振動応答モデルを構築し，乗り心地性能を高精度に予測する手法を提案する．設計値および実験データに基づき非線形特性を静特性と動特性に分離してモデル化した．台上試験による検証に向けて予測精度をシミュレーションで評価し，本手法の有効性を確認した．","stream":"◯"},{"id":"334","title":"機械学習を用いたショックアブソーバ用ピストンバルブの差圧-流量特性の予測手法","author":"加藤　大人 ・呂　鵬・柱山　健二・原田　脩史（Astemo）","aff":["Astemo"],"abstract":"ショックアブソーバの初期設計では，搭載するピストンバルブの差圧-流量特性の推定が必要である．この特性はバルブ形状に依存するため，一般的な物理計算に基づく推定では，精度と計算時間の両立が難しい．この問題に対し，本研究では，機械学習を用いる方法を開発し，短時間で精度よく推定できることを確認した．","stream":"◯"},{"id":"335","title":"サロゲートモデルを用いた伝達関数合成法によるタイヤ・サスペンション目標特性設定手法","author":"秋間　奎人 （三菱自動車工業）・片山　拓人（三菱自動車エンジニアリング）・河合　英樹・清野　裕之・竹谷　昌之（三菱自動車工業）","aff":["三菱自動車工業","三菱自動車エンジニアリング"],"abstract":"ロードノイズ開発は期間短縮や低燃費要求で制約が増大しており，設計自由度の高い初期段階での適切なコンポーネント目標設定が重要である．本研究はサロゲートモデルと伝達関数合成法を用い，車内音目標からコンポーネントの剛性や共振周波数など具体的に設計可能な目標を導出する手法を提案する．","stream":"◯"},{"id":"336","title":"機械学習モデル（LSTM）による乗員の頭部挙動推定技術に関する取り組み","author":"西田　健二 ・河村　力・佐藤　大地・西村　啓人・宮武　宏明・武田　健二・陳　宇・青木　智朗・丸山　晃助・石川　亨（マツダ）","aff":["マツダ"],"abstract":"車両要件変更が乗員頭部挙動へ及ぼす影響を，設計初期段階で定量的に把握することは困難であった．本研究では，実験データを用いて車両挙動から乗員頭部挙動を予測するLSTM時系列モデルを構築した．入力履歴を考慮できる点を特徴とし，車両挙動変化に対する頭部挙動の予測精度を検証し，車両要件検討への適用性を評価した．","stream":"◯"},{"id":"337","title":"機械学習モデルを活用したモータパラメトリック多性能最適化とロバスト検証","author":"八川　晃一 ・安達　亮一・中山　遼太郎（マツダ）","aff":["マツダ"],"abstract":"本発表では，機械学習モデルを用いたパラメトリック最適化による仕様探索と，ロバスト検証の手法を紹介する．電動車用モータの開発において，人間の手によるすり合わせでは多性能の相反を解決する仕様の導出や，ばらつき因子に対する網羅検証に時間がかかる．今回，JMAGの計算結果を基に機械学習モデルを作成し，最適化ツールに組み込み最適化を行った．また作成した機械学習モデルを用いてばらつき因子の影響評価を行った．","stream":"◯"},{"id":"338","title":"Optimization of an FCEV Air Exhaust System for Flow-Induced Noise Reduction and Cost Efficiency","author":"Jong Yeol Lee ･Seung Tae Gong･Jong Seung Won (Hyundai Motor)･Hyun Soo Kim･Joon Ho Jang (SJG SEJONG)","aff":["Hyundai Motor","SJG SEJONG"],"abstract":"This study investigates an optimized air exhaust silencer for a fuel cell electric vehicle to reduce flow-induced noise while improving cost efficiency. Vehicle tests identified discharge noise in the 1-3 kHz range as the primary NVH issue, originating from APC valve-induced turbulence and structural limitations of the production silencer. To mitigate this, the noise attenuation zone was relocated forward and a Helmholtz resonator-based concept was applied. Transmission loss analysis showed that the optimal design achieved up to 16.6 dB improvement in TL RMS, maintained approximately 90% gas-liquid separation, and reduced dependence on absorptive materials.","stream":"◯"}]},{"id":163,"title":"振動・騒音・乗り心地VII","day":16,"room":"特別会議場","start":"13:10","end":"15:15","chair":"座長：海老澤　弘道（エステック）","talks":[{"id":"339","title":"キャリア周波数の変調制御がインバータ音の不快度に及ぼす影響","author":"加曽利　拓真 （中央大学大学院）・金堂　雅彦・山口　雅夫・戸井　武司（中央大学）","aff":["中央大学大学院","中央大学"],"abstract":"インバータ音はキャリア周波数およびその側帯波による複数の純音成分で構成される．近年ではキャリア周波数を変調させることで純音成分を分散し，マスキング効果の向上を図る制御が用いられている．本研究では変調幅などの制御パラメータが不快度に与える影響を定量的に評価し，不快度低減に有効な変調条件を明らかにした．","stream":"◯"},{"id":"340","title":"EVパワートレインの振動抑制に向けたバックラッシュ角オンライン同定に基づくバックラッシュ推定オブザーバの適応更新","author":"川﨑　磨那斗 ・坂本　登・中島　明（南山大学）","aff":["南山大学"],"abstract":"EVパワートレインの振動抑制を目的に，ギアバックラッシュ角をオンライン同定し，その同定値をバックラッシュ推定オブザーバへフィードバックして適応更新する手法を提案する．数値実験により提案法の有効性，従来オブザーバとのパラメータ変動に対する比較を示す．同定誤差が振動推定に与える影響も考察する．","stream":"◯"},{"id":"341","title":"ATにおける歯打ち挙動計測とバックラッシュのモデル化","author":"森田　聖惇 ・今西　健介・鈴木　康太郎・近末　竜・陳　宇（マツダ）","aff":["マツダ"],"abstract":"ATにおいてロックアップ領域の拡大，またはトルクコンバータレス構造とすることで環境性能と走行性能を向上できる一方，歯打ち音発生リスクが高くなる．AT内部のバックラッシュ前後の角速度を計測し，運転条件毎の歯打ち発生有無を特定した．計測結果に基づき，歯打ち速度を再現可能なバックラッシュモデルを構築した．","stream":"◯"},{"id":"342","title":"電動パワートレインのモータベアリング打音 -（第1報：モータと減速機のシャフト挙動解析によるメカニズム解明）-","author":"近藤　慎平 ・小林　大介（日産自動車）・中谷　貴典（日産オートモーティブテクノロジー）・井田　徹・浅原　康之・児島　剛・松尾　宏（日産自動車）","aff":["日産自動車","日産オートモーティブテクノロジー"],"abstract":"電気自動車では電動パワートレインの異音が顕在化しやすいが，そのメカニズムが明確になっていない．本報ではモータベアリング打音に着目し，動解析と実機検証から，その発生メカニズムは，ギヤ反力で傾いたモータシャフトの振れ回り軌跡がベアリングのラジアルガタ内を通過するときにガタ打ちする現象であることを示した．","stream":"◯"},{"id":"343","title":"電動パワートレインのモータベアリング打音 -(第2報) 打音抑制のための設計手法構築-","author":"小林　大介 ・近藤　慎平・浅井　尭之・橋本　真（日産自動車）・川東　勇輝・田中　哲郎（日産オートモーティブテクノロジー）","aff":["日産自動車","日産オートモーティブテクノロジー"],"abstract":"第1報にて明らかにした電動パワートレインの軸挙動メカニズムに基づき，本報では軸の姿勢制御による異音抑制を目的とした設計プロセスを提案する．軸挙動解析を部品設計に適用可能な手法として取り入れ，異音の定量予測を可能とすることで，コストと効率およびNVHの均衡に優れた仕様の設計手法を構築した．","stream":"◯"}]},{"id":164,"title":"振動・騒音・乗り心地VIII","day":16,"room":"特別会議場","start":"15:45","end":"17:50","chair":"座長：吉田　準史（大阪工業大学）","talks":[{"id":"344","title":"パネル設計における固有振動数の間隔の均等化","author":"山田　塁 （岐阜大学大学院）・小西　敬三・飯田　州人（本田技術研究所）・松村　雄一（岐阜大学）","aff":["岐阜大学大学院","本田技術研究所","岐阜大学"],"abstract":"自動車などの構造物の設計を行う際，一般には，組み立て後に固有振動数が大きく変動することを避けるために，それぞれの分系の固有振動数を互いに離隔させる．本研究では，パネルを想定した構造物において構造変更を行わず，スポット溶接の打ち方の工夫によってパネルの固有振動数の間隔を均一化する方法を検討した．","stream":"◯"},{"id":"345","title":"スパースな構造変更でBlocked forceを低減する方法","author":"森下　龍生 （岐阜大学大学院）・加藤　由幹（高知工科大学）・松村　雄一（岐阜大学）","aff":["岐阜大学大学院","高知工科大学","岐阜大学"],"abstract":"本研究では，受動側分系の応答低減を目的として，加振源側分系の構造変更によってBlocked forceを低減する手法を開発した．スパースモデリングを用いることで，構造変更を小規模に抑え，全系への影響低減を図った．本発表では，有限要素モデルへの適用結果を報告する．","stream":"◯"},{"id":"346","title":"加速時通過騒音の二峰性を考慮したタイヤ/路面騒音モデルの拡張","author":"鈴木　直樹 （神奈川大学大学院）・白橋　良宏・山崎　徹・岩泉　佑花里（神奈川大学）・和田　将行・守江　大祐（日産自動車）","aff":["神奈川大学大学院","神奈川大学","日産自動車"],"abstract":"従来の加速時タイヤ／路面騒音モデルは，主に蹴り出し側騒音を対象としていた．本研究では，加速時通過騒音に現れる二峰性に着目し，踏み込み側騒音を含むモデルへ拡張した．複数タイヤで検証し，踏み込み側騒音も弾性エネルギーに基づき表現できること，および車外騒音評価への有効性を示した．","stream":"◯"},{"id":"347","title":"自動車用ダブルフェルト構造防音材の低バネ領域制御によるフェルト有効質量化と透過損失向上技術の開発","author":"笠間　勘太 ・森崎　凌士・岩井　紳一郎（ヒロタニ）","aff":["ヒロタニ"],"abstract":"自動車用ダブルフェルト型防音材において，吸音層フェルトとフィルム間の低バネ定数領域を制御することで透過損失（TL）を向上する技術を開発した．さらに，本技術を適用したダッシュインシュレーター試作品を作成し実車評価で効果を確認した．","stream":"◯"},{"id":"348","title":"単純試験片を用いた積層コア・樹脂固定材を有するモータジェネレータ固定子構造の振動特性評価技術","author":"青木　真悟 ・橋本　洋志・澤村　雄介（トヨタ自動車）・柳生　泰秀・座間　一浩・山本　貴也","aff":["トヨタ自動車"],"abstract":"モーターNV性能開発のリーン化に向け試作レスに取り組むが，積層コアおよび樹脂固定材を有するMG固定子構造の振動特性予測精度に課題があった．本研究では単純試験片を用いて積層コアの変形に着目した実験的検証を実施した．その結果，振動特性・形状影響を把握し，モデル反映により振動特性予測の高精度化を実現した．","stream":"◯"}]},{"id":165,"title":"交通・シミュレーション","day":16,"room":"201+202","start":"9:30","end":"11:10","chair":"座長：鈴木　宏典（東洋大学）","talks":[{"id":"349","title":"実軌跡データに基づく合流意思決定モデルを組み込んだ大型車混在交通流シミュレーション環境の構築","author":"新徳　顕大 ・荒木　伸太・齊藤　朋世・Tushar Shrotriya（構造計画研究所）・古性　裕之・今長　久・中村　英夫（日本自動車研究所）・藤本　浩（日本自動車工業会）","aff":["構造計画研究所","日本自動車研究所","日本自動車工業会"],"abstract":"自動運転車や高度運転支援車等が混在する交通流での自然な合流挙動を評価するため，実軌跡データから人間の合流意思決定プロセスを抽出しモデル化した．さらに，特性の異なる大型車の混在や合流シーン分類を交通流シミュレーションに導入し，実態に即した高精度な車両挙動の再現性を確認した．","stream":"◯"},{"id":"350","title":"高速道路本線部を自動運転車両が走行することを想定した合流支援システムの有効性検証 -（第1報）自動運転車両の普及初期に実施できる支援方策の効果的な普及率-","author":"今長　久 （日本自動車研究所）・新徳　顕太・荒木　伸太・Tushar Shrotriya・岡崎　凌太（構造計画研究所）・中村　英夫（日本自動車研究所）・藤本　浩（日本自動車工業会）","aff":["日本自動車研究所","構造計画研究所","日本自動車工業会"],"abstract":"高速道路本線部に自動運転車が普及することを想定した合流支援の方法を提案する．本線部を走行する車両が合流しやすいように車間距離を広げる．普及初期段階の非自動運転車が多い状況を前提とした場合，普及率30％程度までであれば負の影響を抑えた形で支援が可能なことを交通流シミュレーションで確認した．","stream":"◯"},{"id":"351","title":"個人特性を考慮したエージェントベースシミュレーションによる歩車混在空間の交通制御の検討","author":"荒木　俊人 ・奥田　裕之（名古屋大学）・伴　和徳（トヨタテクニカルディベロップメント）・鈴木　達也（名古屋大学）","aff":["名古屋大学","トヨタテクニカルディベロップメント"],"abstract":"歩車混在空間において，交通参加者の判断の個人特性が交通流に与える影響を考慮することは重要である．本研究では，仮想環境における実験データから個人の意思決定特性を確率的にモデル化し，これを組み込んだエージェントベースシミュレーションを構築した．構築したシミュレーションを用いて様々な交通制御シナリオを実行し，効率性および安全性の観点から，交通制御のあり方を検討・評価する．","stream":"◯"},{"id":"352","title":"長距離輸送用電気トラックの普及を考慮した充電インフラ最適配置モデルの開発","author":"石井　宗一郎 ・安芸　裕久（筑波大学）","aff":["筑波大学"],"abstract":"本研究では，高速道路を走行する長距離輸送用の電気トラックを対象に，走行中ワイヤレス給電システムとパーキングエリアの急速充電設備を組み合わせた充電インフラの最適配置モデルを構築した．さらに，車両の普及状況に応じた交通シミュレーションを実施し，設備配置の変化や充電状況，電力負荷への影響について分析した．","stream":"◯"}]},{"id":166,"title":"ヒューマンエラー","day":16,"room":"201+202","start":"12:10","end":"14:50","chair":"座長：平松　真知子（日産自動車）","talks":[{"id":"353","title":"ヒューマンエラー防止のための主体的行動変容の促進 -第1報 高齢ドライバーの知覚・認知機能が戦略的運転行動に及ぼす影響の経年変化-","author":"佐藤　稔久 （産業技術総合研究所）・吉武　宏（東京科学大学）・合田　美子・戸田　真志（熊本大学）・小竹　元基（東京科学大学）","aff":["産業技術総合研究所","東京科学大学","熊本大学"],"abstract":"高齢ドライバー106名（女性57名）を対象として，知覚・認知機能と戦略的運転行動との関係性をある年とその4年後の2時点で比較した．構造方程式モデルにより，経年により，その認知機能の変化による影響が明確になった戦略的運転行動や，影響を及ぼす認知機能の因子が変化した戦略的運転行動等を見出した．","stream":"◯"},{"id":"354","title":"ヒューマンエラー防止のための主体的行動変容の促進 -第2報 協調的リフレクションを通じた高齢ドライバーの安全行動変容プロセスの分析-","author":"合田　美子 ・戸田　真志（熊本大学）・新目　真紀・半田　純子（職業能力開発総合大学校）・吉武　宏（東京科学大学）・佐藤　稔久（産業技術総合研究所）・小竹　元基（東京科学大学）","aff":["熊本大学","職業能力開発総合大学校","東京科学大学","産業技術総合研究所"],"abstract":"本研究では，高齢ドライバー9名を対象として，AI教習車による運転データと振り返り対話を組み合わせ，安全行動変容のプロセスを分析した．参加者は，運転特徴や危険場面を共有しながら協調的に振り返りを行った．その結果，大きな運転ミスの減少が確認されるとともに，自身の運転特徴への気づき，他者視点を通じた認識の更新，危険予測に関するメタ認知的発話などが観察された．本報では，協調学習的な振り返りが主体的行動変容に与える影響について質的に検討する．","stream":"◯"},{"id":"355","title":"ヒューマンエラー防止のための主体的行動変容の促進 -第3報 高齢ドライバの運転行動変化を促す介入における効用提示の効果-","author":"吉武　宏 （東京科学大学）・郭　鐘聲（拓殖大学）・小竹　元基（東京科学大学）","aff":["東京科学大学","拓殖大学"],"abstract":"高齢ドライバの安全な運転行動への変化を促すため，先行研究では運転行動の振り返りと反復練習を用いた介入手法を提案した．しかし，介入効果には個人差があり，行動変化の効用の理解が影響する可能性が示唆された．本研究では，介入時に行動変化の効用を提示し，その内容が介入後の運転行動変化に及ぼす影響を検討した．","stream":"◯"},{"id":"356","title":"ヒューマンエラー防止のための主体的行動変容の促進 -第4報 運転行動分析のための車載カメラによるドライバ顔向き・視線・姿勢推定および視認対象物の可視化-","author":"石原　稜大 ・山崎　彬人（名城大学）・吉武　宏・小竹　元基（東京科学大学）","aff":["名城大学","東京科学大学"],"abstract":"ドライバの主体的な行動変容を促す支援方策の構築には，運転行動の定量的な分析が不可欠である．本研究では，車載カメラ映像から顔向き・視線・姿勢を非接触で推定し，さらに視線方向を外界映像上に投影することで視認対象を可視化するシステムを提案する．実車環境での実験により本手法の有効性を示す．","stream":"◯"},{"id":"357","title":"ヒューマンエラー防止のための主体的行動変容の促進 -第5報 大規模言語モデルによる交通環境文脈理解に基づく注意対象抽出とドライバ視認行動の統合のための基盤技術開発-","author":"山﨑　壮馬 ・山崎　彬人（名城大学）・吉武　宏・小竹　元基（東京科学大学）","aff":["名城大学","東京科学大学"],"abstract":"従来の運転行動分析では，ドライバが「何を見たか」は評価できても，「何を見るべきだったか」という交通環境側の要求を扱うことは困難であった．本研究では，大規模言語モデルにより道路環境から「注意対象」を抽出・構造化し，ドライバの「視認対象」と統合することで，確認行動の妥当性を定量評価する手法を提案する．","stream":"◯"},{"id":"358","title":"高齢運転者の自己評価を適正化させる運転教育システムの構築とその効果","author":"小竹　元基・ 井内　柊仁 ・吉武　宏（東京科学大学）・藤田　涼太・加藤　寛登（三菱プレシジョン）","aff":["東京科学大学","三菱プレシジョン"],"abstract":"補助者が介在せずに運転に対する自己評価を適正化させる運転教育システムを構築し，高齢ドライバに適用した結果，安全運転意識と事故不安を高め，交差点における運転行動を改善できる可能性を示した．また，運転教育による過大評価の是正の程度が大きいほど，運転行動の改善効果が高いことを明らかにした．","stream":"◯"}]},{"id":167,"title":"視覚・注意","day":16,"room":"201+202","start":"15:20","end":"17:00","chair":"座長：関根　道昭（自動車技術総合機構）","talks":[{"id":"359","title":"運転映像視認時におけるアイセンタリング現象を用いた注意力低下判別","author":"小川　洋明 ・浅見　克志（デンソー）・川守田　拓志（北里大学）","aff":["デンソー","北里大学"],"abstract":"既報の注意力低下時に視線が視野中央に寄るアイセンタリング現象は，前方注視が多い運転環境への有効性に懸念があった．本研究では運転映像を視認する環境でも同現象の生起を確認し，注意力低下判別への適用可能性を示した．","stream":"◯"},{"id":"360","title":"運転時のドライバー視線行動を利用した意図推定技術の構築 第1報","author":"山本　健太 ・古市　崇・後藤　輝・坪内　淳志（本田技術研究所）","aff":["本田技術研究所"],"abstract":"コップを手に取る場合，ヒトはコップを見てから手を伸ばす．このように，視線の動きは四肢の動きに先行して発生する．この特性を利用し，ドライバーの視線の動きから，ドライバーが通りたい軌跡（＝意図）を運転行動に先行して推定する技術の構築を行う．本報ではまず，軌跡と関係するヒト視線特性を報告する．","stream":"◯"},{"id":"361","title":"DS実験による自動車ドライバの視野急変時の運転行動分析（第1報） -視野急変再現方法とブラインドスポットモニタの有効性の検討-","author":"三盛　優心 （関西大学大学院）・伊藤　大輔（関西大学）・國行　浩史（公立諏訪東京理科大学）","aff":["関西大学大学院","関西大学","公立諏訪東京理科大学"],"abstract":"視野急変時の運転行動とブラインドスポットモニタ（BSM）の有効性をドライビングシミュレータ実験により分析した．後方からの接近車両がある状態での車線変更・停止を想定したシナリオにおいて，心配性傾向が高いドライバは停車まで時間を要する傾向があり，BSMは警告灯より警告音が有効である可能性が示唆された．","stream":"◯"},{"id":"362","title":"車内固視時において前方視界の広さが車酔いへ与える影響","author":"天野　真輝 ・樋口　和則・服部　義和（豊田中央研究所）","aff":["豊田中央研究所"],"abstract":"車内視覚作業時の車酔い低減を目的に，後席乗員が車内を固視する状況において前方視界の広さが車酔いに与える影響を評価した．最大ヨーレート15deg/sの8の字旋回時に，視野角±30degの前方視界を遮蔽した条件において車酔いスコアMISCがもっとも低下した．","stream":"◯"}]},{"id":168,"title":"動力伝達系の最新技術I","day":16,"room":"204","start":"9:30","end":"12:10","chair":"座長：小栗　昌己（SUBARU）","talks":[{"id":"363","title":"ハイブリッド車用トランスミッション油に及ぼす泡の影響","author":"園田　修三 （本田技術研究所）","aff":["本田技術研究所"],"abstract":"ハイブリッド車ではモーターをトランスミッション内に統合する構成が一般的であり，冷却・潤滑には同一油が用いられる．高回転化に伴う油のせん断劣化が懸念される中，本稿では油の泡立ち挙動に着目し，消泡剤の種類による表面泡および油中泡の差異とその影響を考察した．","stream":"◯"},{"id":"364","title":"マイクロバブルによる油膜すべり軸受の摩擦低減に向けた検討 -新規給油溝の適用と評価-","author":"坂部　翔大 ・吉村　友輝・山崎　佑人・権田　晃生・川本　裕樹・畔津　昭彦・落合　成行（東海大学）","aff":["東海大学"],"abstract":"油膜すべり軸受においてマイクロバブルと呼ばれる微細な気泡の適用によって摩擦が低減することが実証されており，摩擦低減効果の向上には軸受すきま内のボイド率（液相に対する気相の体積割合）の上昇が影響している．そこで，高ボイド率化に向けた新規給油溝を検討し，それを有した軸受の摩擦トルク測定実験を実施した．","stream":"◯"},{"id":"365","title":"EHL計算によるエンジン用すべり軸受の焼付予測の研究","author":"櫻井　真一 ・清水　章史・幸島　元彦（大同メタル工業）","aff":["大同メタル工業"],"abstract":"エンジン用すべり軸受の焼付予測においては，通常，PV値，膜厚比（Λ），および温度などのパラメータが用いられる．しかし，EHL（弾性流体潤滑）計算を活用して，より多様な物理量に基づいて評価することで，焼付予測のさらなる高精度化が期待されるため，研究内容を紹介する．","stream":"✕"},{"id":"366","title":"EV駆動モータ用ベアリングの電食に及ぼす油膜厚さと潤滑油導電性の影響","author":"瀬詰　知弘 ・前田　誠・加藤　豪・権田　友彦（ジヤトコ）・小山　真司・南　斗和（群馬大学）","aff":["ジヤトコ","群馬大学"],"abstract":"軸受等で発生する電食は，モーターの漏れ電流が起因となる．本現象は，摺動部に介在する潤滑油を介した通電により溶損が生じ，損傷に至るものである．そこで本研究では，摺動部の潤滑状態および潤滑油の特性に着目し，それらが電食に及ぼす影響を実験的に明らかにした．","stream":"✕"},{"id":"367","title":"e-Axle用減速機ギヤの歯面損傷挙動に及ぼす潤滑油の影響","author":"柳原　貴 （出光興産）","aff":["出光興産"],"abstract":"e-Axle用減速機ギヤを対象に，高速回転化に伴い重要性が増す歯面損傷に対する潤滑油の影響を評価した．歯面観察，歯形および粗さ計測に基づき，潤滑油の違いによる摩耗挙動と微小歯面損傷の差異を報告する．","stream":"◯"},{"id":"368","title":"Severity Analysis of m-LSD Differential Durability Test Using the Morrison Surface Fatigue Equation","author":"Hwiun Lee ･Daejin Kim･seonghyun Son･seungyong Bae (Hyundai Motor)","aff":["Hyundai Motor"],"abstract":"This study investigates pitting fatigue life at the cam-ring gear contact in a mechanical limited slip differential (m-LSD) with asymmetric spur gears. Using the Morrison life equation, it quantitatively compares accumulated contact fatigue damage between component-level bench tests and full-vehicle circuit driving. Two representative loading conditions were analyzed: high-load/low-differential-speed and low-load/high-differential-speed. Contact stress factors and fatigue damage were calculated for each case, and equivalent bench test cycles were derived from actual circuit driving distances.","stream":"◯"}]},{"id":169,"title":"動力伝達系の最新技術II","day":16,"room":"204","start":"13:10","end":"16:15","chair":"座長：佐藤　恭一（横浜国立大学）","talks":[{"id":"369","title":"大型FCVの回生ブレーキ作動不可時向け空気圧縮開放式補助制動装置（第6報） -コンパクト化のためのロータリーベーン方式の提案-","author":"天田　瑚生 ・藤田　大樹・土屋　美海・藤田　壽憲・柴山　尚士（東京電機大学）","aff":["東京電機大学"],"abstract":"FCVトラックの回生ブレーキ作動不可時に備える空気圧縮開放式の簡易型補助ブレーキを前報までに提案した．前報まではアキシャルピストン方式を採用しており回転運動を往復運動に変換する必要があり，コンパクト化には限界があった．そこで，本報ではコンパクト化のためのロータリーベーン方式を提案し，その特性を報告する．","stream":"◯"},{"id":"370","title":"高回転・高出力・高減速比トラクションドライブの動力伝達特性試験機の開発","author":"森田　夏輝 ・山本　建（東海大学）","aff":["東海大学"],"abstract":"トラクションドライブの性能を確認すべく，50,000rpm・50kWでの測定に向け，動力循環試験機を開発した．本試験機により設備的制約を克服し，50,000rpm・50kWでのトラクション係数測定を実現した．また，高減速比における試験では，トラクション係数が低下しないで測定することを確認した．","stream":"◯"},{"id":"371","title":"セルフロック減速機構を用いた2輪用CVTの電動制御","author":"上田　源士郎 （法政大学大学院）・相原　建人（法政大学）","aff":["法政大学大学院","法政大学"],"abstract":"セルフロック機能を有する減速機とモータを用いた2輪用CVTの電動制御を提案する．モータによりプーリ位置を制御することで，高速な変速および高効率化を狙う．またセルフロック機能によりプーリの位置保持を無電力で行うことができる．本発表では，機構構成，動作原理，および変速特性について報告する．","stream":"◯"},{"id":"372","title":"環境乱択に基づく深層強化学習制御とモデルベース制御の融合によるパワートレインの振動抑制","author":"米沢　平成 ・米沢　安成・梶原　逸朗（北海道大学）","aff":["北海道大学"],"abstract":"パワートレインの制御系設計は，非線形性や動特性の不確かさを考慮する必要がある．近年，深層強化学習が有力な手法として注目されているが，学習の非効率性や方策の保守化が課題である．本研究はベース性能を担保するモデルベース制御器を導入することで，環境乱択に基づく深層強化学習制御を支援する手法を提案する．","stream":"◯"},{"id":"373","title":"多層運行モードに対応可能な燃料電池ごみ収集車の変速制御最適化手法の構築","author":"鮑　義達 ・高　佳カイ・張　翔・奚　佳晨・方　亦园・楊　イ翔・紙屋　雄史（早稲田大学）","aff":["早稲田大学"],"abstract":"燃料電池ごみ収集車は収集作業・走行パターンが複雑で要求性能の幅も広く，固定シフトマップでは最適動作が困難である．本研究は多層運転モードに基づくシフトマップを提案，モータ特性と回生機構を考慮しベイズ最適化で変速比とマップを協調最適化した．固定マップ比でドライバビリティを保ち電費と動力性能を向上した．","stream":"◯"},{"id":"374","title":"EV用CVT制御マップの提案と各種走行モードでの比較検討","author":"趙　漢卿 ・森吉　泰生・窪山　達也（千葉大学）","aff":["千葉大学"],"abstract":"電気自動車用CVT制御では，経験的に設計された変速マップが一般的に用いられているが，その最適性は十分に検討されていない．本研究では，最適化手法により各走行条件における最適CVT変速比を算出し，既存CVTマップとの差異を解析した．さらに，決定木を用いて補正領域の分類を行い，各領域に対する補正マップを構築することで，既存CVT変速マップの改良手法について検討した．","stream":"◯"},{"id":"375","title":"Development of a Virtual Performance Evaluation Model for New Multi-Mode Hybrid Powertrain System with RCP-HIL Validation","author":"Myeong-Won Seo ･Dohyun Park･Janghyeok Won･Beomho Lee･Taeho Park･Deokjin Kim (Korea Automotive Technology Institute)","aff":["Korea Automotive Technology Institute"],"abstract":"This study presents a virtual performance evaluation model for a multi-mode hybrid powertrain comprising a 1.6L GDI engine, P1/P3 electric motors, and a dog-clutch 2-speed transmission. Three driving modes - EV, Series HEV, and Parallel HEV - are supported through a multi-controller architecture (HCU, TCU, ECU, MCU, BMS, BCU). Plant and controller subsystems are separated into non-virtual blocks, enabling RCP-HIL deployment via dual Speedgoat machines over CAN bus. All performance targets were met: (FTP-75, HWFET), 0-100 km/h in 10.00 s, EV grade ability 39.14%, and maximum speed 168.7 km/h.","stream":"✕"}]},{"id":170,"title":"衝突安全・人体傷害","day":16,"room":"206","start":"9:30","end":"12:10","chair":"座長：伊藤　大輔（関西大学）","talks":[{"id":"376","title":"人体FEモデルを用いた前突スレッドシミュレーションによる腹部傷害評価に向けた検討","author":"樋口　友樹 （日本自動車研究所）・増田　光利（日本自動車工業会）・佐藤　房子（日本自動車研究所）","aff":["日本自動車研究所","日本自動車工業会"],"abstract":"腹部傷害は，交通事故の死亡重症者数の低減に向けて重要な傷害部位であるが，ダミーによる評価手法は十分に確立されていない．そこで腹部傷害評価の実現に向け，ミクロ事故データから前突事故形態と腹部受傷のパターンを整理し，THUMS AF05を用いた前突スレッドシミュレーションにより受傷メカニズムを調査した．","stream":"◯"},{"id":"377","title":"人体有限要素モデルを用いた前面衝突時のベルト経路条件に関する感度解析","author":"西村　海飛 ・吉田　貴史・樹神　滋・齋藤　望（東海理化）","aff":["東海理化"],"abstract":"本研究では，THUMS人体モデルを用いた前面衝突解析により，正規装着方法とそれとは異なる複数のベルト経路条件における乗員応答を同一条件下で比較した．","stream":"✕"},{"id":"378","title":"前面衝突時における人体有限要素モデルの骨盤回転運動の分析","author":"東　才晴 ・趙　雨晴・水野　幸治（名古屋大学）・長坂　圭・鈴木　貴大・増田　出光（スズキ）","aff":["名古屋大学","スズキ"],"abstract":"前面衝突を模擬した後席スレッド試験の有限要素シミュレーションを実施し，ラップベルト拘束時に生じる骨盤の後方回転運動を分析した．人体有限要素モデル（THUMS）の標準男性および小柄女性のモデルを用い，骨盤重心まわりのモーメント時刻歴を比較し，骨盤形状に起因する回転挙動の特徴を明らかにした．","stream":"◯"},{"id":"379","title":"機械学習を用いた前面衝突時における乗員下肢傷害指標（Tibia Index）の予測","author":"棚本　誠也 （山梨大学）・長坂　圭・増田　出光（スズキ）・横山　優太（ダイバーテクノロジー）・杉山　裕文（山梨大学）・岡澤　重信（山梨大学/ダイバーテクノロジー）","aff":["山梨大学","スズキ","ダイバーテクノロジー","山梨大学/ダイバーテクノロジー"],"abstract":"前面衝突時における乗員の下肢傷害は，車体減速度やダッシュパネル変形などが複雑に関連しており，予測が難しい．本研究では，スレッド解析に入力される加速度波形およびダッシュパネルの変形モードを用いて，乗員下肢傷害指標（Tibia Index）を推定する機械学習モデルを構築する．さらに，解析ケースの違いが予測精度に与える影響を検討し，数値解析結果との比較により提案手法の有効性を評価する．","stream":"◯"},{"id":"380","title":"乗用車前面の形状とエネルギ吸収特性の関係","author":"福山　慶介 ・一色　孝廣・三上　耕司（日本自動車研究所）","aff":["日本自動車研究所"],"abstract":"交通事故解析において，車両の変形エネルギの算出にはエネルギ吸収分布図が活用されている．既存の分布図は，近年の多様な車両前面形状への適合性において更なる改善の余地が示唆される．本研究では，同課題に対応するため，近年の車両における前面形状とエネルギ吸収特性の関係を明らかにした．","stream":"◯"},{"id":"381","title":"年齢を考慮したD-Call Net死亡重症率アルゴリズムの効果検証","author":"勝間田　静江 ・棚瀬　昇・安藤　貴裕（トヨタ自動車）・影澤　英子（交通事故総合分析センター）・長岡　靖（トヨタ自動車）","aff":["トヨタ自動車","交通事故総合分析センター"],"abstract":"D-Call Netの死亡重症率は現在の運用上，乗員年齢を65歳とおいて算出されている．本研究では，事故データとD-Call Netの通報データを突き合せて，実際の事故の乗員の年齢の分布状況とその影響について確認する．","stream":"◯"}]},{"id":171,"title":"空力I","day":16,"room":"206","start":"13:10","end":"14:50","chair":"座長：寺門　晋（トヨタ自動車）","talks":[{"id":"382","title":"実風況を考慮したソーラーカーの空力開発","author":"小川　将虎 ・二ノ宮　孝仁・福田　紘大（東海大学）・田中　博・金森　敬宗（トヨタシステムズ）・佐川　耕平・木村　英樹（東海大学）","aff":["東海大学","トヨタシステムズ"],"abstract":"東海大学は長年に渡りソーラーカー世界大会に参戦している．ソーラーカーの空力開発のレベルは年々上がっておりトップチームは最先端の流体解析技術を駆使した開発を行っている．一方で，公道で大会が行われるため実風況を考慮した開発が重要となる．本発表では実風況を考慮したソーラーカー空力開発の概要について述べる．","stream":"◯"},{"id":"383","title":"Ahmed body周りの流れにおける流れ形態の傾斜角とレイノルズ数依存性 ―乱流モデルによる違い","author":"福岡　駿太 （東京都市大学大学院）・郡　逸平・白鳥　英（東京都市大学）","aff":["東京都市大学大学院","東京都市大学"],"abstract":"Ahmed bodyの周りの流れは車体後部の傾斜面角によって流れ形態が変わり，これに伴ってCD値も大きく変化することが知られている．本研究ではこの遷移が出現するレイノルズ数と傾斜角範囲を俯瞰することを目的にRANSモデルを用いた数値計算を行ったところ，用いる乱流モデルによって遷移の出現範囲が異なる結果を得たので報告する．","stream":"◯"},{"id":"384","title":"VAEとPINNによる空力形状最適化 -SDFと点群を併用した方法-","author":"疋田　夏帆 （東京都市大学大学院）・白鳥　英（東京都市大学）","aff":["東京都市大学大学院","東京都市大学"],"abstract":"効力係数を小さくする車体形状最適化において，メッシュ再生成を伴う従来手法は計算コストが高い．筆者らは生成AIとしてVAEを用いて形状を潜在変数としてパラメータ化し，PINNを用いて空力計算する最適化法を研究している．本報告では形状表現としてSDFと点群を併用した方法を提案し，2次元翼型に対する検証結果を報告する．","stream":"◯"},{"id":"385","title":"実路走行とシャシダイナモメータにおける車両周りの空気流動に関する比較検証","author":"川野　大輔 （大阪産業大学）・飯干　壮馬（大阪産業大学大学院（現ダイハツ工業））・青山　一樹（大阪産業大学）・高橋　利道（明電舎）","aff":["大阪産業大学","現ダイハツ工業","明電舎"],"abstract":"車両周りの空気流動はその車両性能に大きな影響を与えるため，シャシダイナモメータでは実路走行における空気流動を再現する必要がある．本研究では，車両周りの空気流速の同時多点計測により，実路走行とシャシダイナモメータにおける空気流動の比較を行うとともに，CFDによりこれらの空気流動の差異の要因を解析した．","stream":"◯"}]},{"id":172,"title":"空力II","day":16,"room":"206","start":"15:20","end":"17:25","chair":"座長：白鳥　英（東京都市大学）","talks":[{"id":"386","title":"自走式トンネル風洞Catesby Aero Research Facility（CARF）の概要","author":"下山　浩 ・永野　弘樹・吉澤　慧・加藤　航・渡邉　圭一（SUBARU）","aff":["SUBARU"],"abstract":"SUBARUがCVCを通じ出資し2019年に運用開始した実走式トンネル風洞CARFの設備特性と計測技術を報告する．鉄道トンネルを転用した2.7kmの直線路は，低速域まで連続可能なコーストダウン試験により屋外試験に対し高い再現性を確保した．CFD，従来の風洞試験と実走行試験の乖離を相補することが期待される．","stream":"◯"},{"id":"387","title":"運動で発生する動的空気力とその車両運動への影響 -風洞での実車加振試験-","author":"前田　和宏 ・杉本　満・遠藤　康宏・山本　暁尚（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"運動性能向上を狙った空力デバイスの効果は定常空気力だけでは説明できず，運動で発生する動的空気力に着目することが必要と考え，実車風洞内で加振試験を行なった．走行風によりフロントは動きにくくリヤは動きやすくなり，流れが乱れると動きにくく整流すると動きやすくなる等，動的空気力の影響が確認できた．","stream":"◯"},{"id":"388","title":"Wind Tunnel Evaluation of Combined Active Aerodynamic Systems on a CUV-type EV","author":"Dong Ha kim ･Hak Lim kim･Hong Hee lee･Jin Young youn･Su Bok kim･Suk Bom son･Woo Jae Kwon･Ju Wan Han･Woo Yul Baek (Hyundai Motor)","aff":["Hyundai Motor"],"abstract":"This study investigates the combined aerodynamic effects of three active systems Active Air Skirt, Active Rear Diffuser, and Active Spoiler Module on a CUV-type EV through wind tunnel testing. Results confirm a total drag coefficient improvement of delta Cd 0.023 versus baseline, with negligible interaction between systems, enabling linear superposition for aerodynamic performance prediction. These findings serve as fundamental data for the development of effective combination and control strategies for EV active aerodynamic systems, ultimately contributing to improved energy efficiency in next-generation EVs.","stream":"◯"},{"id":"389","title":"物流分野におけるCN実現に向けたトラック空力技術開発","author":"日野　雄太 ・北沢　祐介・槇原　孝文（トヨタ自動車）","aff":["トヨタ自動車"],"abstract":"物流分野はCN実現の為の重要な分野であり，トラック空気抵抗（CD）低減はCO₂削減に有効である．本研究では風洞試験・CFDを用い，トラック各領域のCD低減ポテンシャルを明確化した上で，高ポテンシャル領域に対しトラック特有課題を考慮し，コスト，質量，他性能と両立する実車適用可能な形状を具現化した．","stream":"◯"},{"id":"390","title":"自動車空力開発における設計側拘束条件を考慮した逆問題設計手法の提案","author":"吉永　裕輔 ・養父　拓也・濱本　直樹・奥津　泰彦・橋本　紀公（三菱自動車工業）","aff":["三菱自動車工業"],"abstract":"開発期間短縮を目的とし，自動車空力開発における目標達成形状取得までの検討サイクル数を削減するため，主成分分析（PCA）を用いた統計的な制約下での逆問題設計アプローチを提案する．設計自由度を考慮した拘束条件の中で性能改善が期待される形状を効率的に生成し，開発初期段階での設計検討精度向上を図る．","stream":"◯"}]},{"id":173,"title":"危険運転・ドライバ心理・電動キックボード","day":16,"room":"207","start":"9:30","end":"12:10","chair":"座長：西本　哲也（日本大学）","talks":[{"id":"391","title":"高速暴走車による自転車事故の危険性の評価 -交通事故統計の人身傷害分析から評価した高速暴走車両の自転車乗員への危険性-","author":"関根　康史 （福山大学）","aff":["福山大学"],"abstract":"高速暴走車の危険性を論ずる上で，被害者の人身傷害への加害性を無視してはいけない．本報では，交通事故統計データから，自動車の衝突速度と自転車乗員の死亡重傷者率の関係を分析することによって，高速暴走車両の自転車乗員の人身傷害への加害性を明らかにすることを試みた．","stream":"◯"},{"id":"392","title":"運転違反特性尺度（TOTS）の妥当性の検証 -認知課題を用いた量的および質的検討-","author":"小嶋　理江 （名古屋大学）・荘島　宏二郎（大学入試センター）・岡村　和子（科学警察研究所）・西澤　智恵子・松林　翔太（トヨタテクニカルディベロップメント）・伴　和徳（トヨタテクニカルディベロップメント／名古屋大学）","aff":["名古屋大学","大学入試センター","科学警察研究所","トヨタテクニカルディベロップメント","トヨタテクニカルディベロップメント／名古屋大学"],"abstract":"先行研究にて開発されたTOTSの妥当性を，認知課題を用いて検証する．WebパネルにてTOTSとBART（リスク意思決定），IGT（意思決定学習），SST（反応抑制）を施行し，各TOTS因子と対応する認知指標との関連を検討する．TOTSが違反リスク評価ツールとして機能することを実証する．","stream":"◯"},{"id":"393","title":"交通安全教育プログラム構築に向けた交通違反者の特性と行動の分析","author":"西澤　智恵子 ・松林　翔太（トヨタテクニカルディベロップメント）・小嶋　理江（名古屋大学）・山口　拓真・伴　和徳（トヨタテクニカルディベロップメント）","aff":["トヨタテクニカルディベロップメント","名古屋大学"],"abstract":"交通違反者に対して現在行われている教育はどの違反者にも画一的であり，一部の違反者には効果的とは言えない．そこで，効果の高い新たな違反者教育方針の策定を目指し，その前段階として違反者に対する適切なフィードバック方法を検討する．本件ではそのフィードバックに向けた特性と運転行動の分析結果を報告する．","stream":"◯"},{"id":"394","title":"ITARDAマクロデータとTUATドライブレコーダーデータによる電動キックボードの事故分析","author":"木内　透 （交通事故総合分析センター）・阿賀　正己（東京農工大学）・石井　麻友（交通事故総合分析センター）・大北　由紀子・永井　正夫（東京農工大学）","aff":["交通事故総合分析センター","東京農工大学"],"abstract":"令和5年7月から，16歳以上は免許不要で電動キックボードの運転が可能となった．警察庁の事故統計データは，令和4年改正で「車両形状等」に「立ち乗り型電動車」が，さらに令和6年改正で「特定小型原付自転車」が追加された．著者らは，令和5年・6年のITARDAマクロデータを使って，事故実態の把握を試みた．","stream":"✕"},{"id":"395","title":"ボンネット型自動車に正面衝突された電動キックボード乗員の衝突挙動の検討","author":"大賀　涼 （自動車安全運転センター / 東京都市大学）・櫻井　俊彰・大友　凌太朗（東京都市大学）・上　裕樹（東京都市大学大学院）・木戸　晶洋（科学警察研究所）","aff":["自動車安全運転センター / 東京都市大学","東京都市大学","東京都市大学大学院","科学警察研究所"],"abstract":"走行車両を用いた電動スクーターの衝突研究は乏しい．本報告では，移動する自動車と停止状態のスクーターの正面衝突実験により乗員挙動を検証した．乗員はボンネットに乗り上げ前窓に頭部を衝突させた．ステップにより歩行者より初期位置が高いため乗り上げが大きく，30km/hでのステム破断からハンドルの影響は軽微と示唆された．","stream":"◯"},{"id":"396","title":"誰にどんな支援が効くのか？運転支援の心理的効果に対する大規模横断研究","author":"山崎　陽 （マツダ／弘前大学）・道田　奈々江・本田　正徳・大林　弘宗・古谷　庸介（マツダ）・玉田　嘉紀・伊東　健・三上　達也・村下　公一・中路　重之（弘前大学）","aff":["マツダ／弘前大学","マツダ","弘前大学"],"abstract":"運転者の個々の特性に寄り添う支援は，安心快適な運転のために必要である．今回，調査参加者約900名の特性を，運転注意能力と運転に対する自己効力感（自信）に基づき4群に分類し，3種の異なる特徴を持つ運転支援の心理的効果を検証した．その結果，各特徴の運転支援の効果は，参加者の特性により異なることが示された．","stream":"◯"}]},{"id":174,"title":"歩行者傷害・自転車乗員傷害","day":16,"room":"207","start":"13:10","end":"15:50","chair":"座長：松井　靖浩（自動車技術総合機構）","talks":[{"id":"397","title":"歩行者事故ミクロデータにおけるボンネット先端高さと体幹部傷害との関係","author":"後藤　司 ・江島　晋（SUBARU）","aff":["SUBARU"],"abstract":"歩行者事故ミクロデータを用いてフード先端の相対高さと体幹部の傷害の関係を調査した結果，相対高さが上がるほど胸部，腹部，腰部のAIS2以上の傷害が発生した事故の割合が増えることが分かった．本研究では調査結果とその原因，歩行者保護への影響について述べる．","stream":"◯"},{"id":"398","title":"高フードSUV歩行者保護における胸部受傷メカニズムの解析 -車体反力によるTHUMS全身運動の変化-","author":"飯塚　洋二朗 （トヨタ自動車）・植木　大空（メイテック）・川島　潤司・今井　裕明・濱田　満寛・中根　裕司（トヨタ自動車）","aff":["トヨタ自動車","メイテック"],"abstract":"高フードSUV実車モデルにおける歩行者胸部傷害メカニズム解明を目的に，歩行者THUMSによる衝突解析を実施した．胸たわみは骨盤支持を介したバンパ反力による胸郭速度に依存し，肋骨ひずみは胸郭へ作用するフード反力の影響を受けることが示された．これらから，胸部傷害に対する車体反力の重要性が示唆された．","stream":"◯"},{"id":"399","title":"欧州における歩行者のGIDASを用いた傷害予測アルゴリズムの開発","author":"郡司　泰明 ・長谷川　卓（本田技術研究所）・吉田　傑（SGRコンサルティング）・富永　茂（日本大学）","aff":["本田技術研究所","SGRコンサルティング","日本大学"],"abstract":"本研究では欧州の歩行者事故を対象とした先進事故自動通報（AACN）システム向けの傷害予測アルゴリズムをGIDAS事故調査データベースを用い，車両と歩行者の衝突速度と年齢を回帰分析のリスク要因とする事で開発した．結果，MAISが3以上となる確率予測が救命救急の活動判断に役立つ水準で可能となった．","stream":"◯"},{"id":"400","title":"医工連携の歩行者衝突事故CAEシミュレーションにおける精度向上の取り組み","author":"徳山　美惠 ・安藤　貴裕・大西　浩史・棚瀬　昇（トヨタ自動車）・木内　透・辻　武弘（交通事故総合分析センター）","aff":["トヨタ自動車","交通事故総合分析センター"],"abstract":"医工連携は交通事故現場調査や車両損傷解析など工学的分析と，医療診断情報を統合し，傷害発生メカニズムを解明することで死傷者低減対策につなげることを目的としている．さらにCAEを用いたシミュレーションも統合することでより詳細な分析が可能になる．本研究では歩行者事故シミュレーションを行うに際し歩行者のモデル化に着目し，身長と体重分布の挙動への影響をパラスタ手法で調査した
